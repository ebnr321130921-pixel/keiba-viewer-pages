<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#06080c" />
<link rel="manifest" href="manifest.json?v=20261031053642" />
<title>競馬予測｜Ver2.08</title>

<style>
:root {
  --bg: #0f1115;
  --panel: #141823;
  --panel2: #10131b;
  --text: #e9edf5;
  --muted: #aab3c5;
  --line: rgba(255,255,255,0.10);
  --shadow: 0 10px 24px rgba(0,0,0,0.35);
  --shadow2: 0 6px 16px rgba(0,0,0,0.30);

  /* ★ Navy UI（共通・暗め） */
  --navy: rgba(25,40,95,0.92);
  --navy-border: rgba(105,150,245,0.50);
  --navy-text: #f2f7ff;
  --navy-focus: rgba(105,150,245,0.16);
}

* { box-sizing: border-box; }
html {
  min-height: 100%;
  background-color: #06080c;
}
body { min-height: 100%; }
body {
  margin: 0;
  background: radial-gradient(1200px 800px at 15% 10%, rgba(90,140,255,0.10), transparent 55%),
              radial-gradient(900px 700px at 85% 0%, rgba(255,220,120,0.07), transparent 60%),
              var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}

.hit-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: 0;
  mix-blend-mode: screen;
}

.hit-glow.gold {
  background:
    radial-gradient(1200px 900px at 50% 10%, rgba(255,211,77,0.22), transparent 60%),
    radial-gradient(900px 700px at 15% 80%, rgba(255,211,77,0.12), transparent 60%),
    radial-gradient(900px 700px at 85% 85%, rgba(255,211,77,0.12), transparent 60%);
}

.hit-glow.silver {
  background:
    radial-gradient(1200px 900px at 50% 10%, rgba(210,220,235,0.20), transparent 60%),
    radial-gradient(900px 700px at 15% 80%, rgba(210,220,235,0.11), transparent 60%),
    radial-gradient(900px 700px at 85% 85%, rgba(210,220,235,0.11), transparent 60%);
}

@keyframes goldGlow {
  0%   { opacity: 0.08; filter: brightness(1.00); }
  50%  { opacity: 0.26; filter: brightness(1.15); }
  100% { opacity: 0.08; filter: brightness(1.00); }
}

@keyframes silverGlow {
  0%   { opacity: 0.07; filter: brightness(1.00); }
  50%  { opacity: 0.22; filter: brightness(1.12); }
  100% { opacity: 0.07; filter: brightness(1.00); }
}

body.hot-hit-gold .hit-glow.gold {
  animation: goldGlow 1.05s ease-in-out infinite;
}

body.hot-hit-silver .hit-glow.silver {
  animation: silverGlow 1.10s ease-in-out infinite;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: linear-gradient(180deg, rgba(15,17,21,0.98), rgba(15,17,21,0.86));
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: calc(10px + env(safe-area-inset-top)) 12px 10px 12px;
}

.controls {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.controls-row {
  display: flex;
  flex-wrap: nowrap;
  gap: 8px;
  align-items: center;
  width: 100%;
}
.controls-row > * {
  min-width: 0;
}

/* ★ Top 2行目：4ボタンを均等配置 */
.controls-row.top-row2 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.controls-row.top-row2 > * {
  width: 100%;
}


.select {
  width: auto;
  min-width: 140px;
  flex: 1 1 140px;
  padding: 10px 12px;
  background: var(--navy);
  color: var(--navy-text);
  border: 1px solid var(--navy-border);
  border-radius: 12px;
  font-size: 14px;
  outline: none;
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
}

.select:focus {
  border-color: var(--navy-border);
  box-shadow: 0 0 0 3px var(--navy-focus);
}

.badge {
  padding: 10px 12px;
  background: rgba(20,24,35,0.92);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-weight: 900;
  font-size: 12px;
  white-space: nowrap;
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
}
.badge.sub {
  font-weight: 700;
  opacity: 0.95;
}

/* ★ 更新バー（3行目・黒背景） */
.updatebar {
  width: 100%;
  min-height: 40px;
  padding: 10px 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  border: 1px solid var(--navy-border);
  background: var(--navy);
  color: var(--navy-text);
  font-weight: 1000;
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
}

.btn {
  padding: 10px 12px;
  background: var(--navy);
  border: 1px solid var(--navy-border);
  border-radius: 12px;
  color: var(--navy-text);
  font-weight: 1000;
  font-size: 12px;
  white-space: nowrap;
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
  cursor: pointer;
  user-select: none;
}
.btn:active {
  transform: scale(0.99);
  filter: brightness(1.08);
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.btn.mobile-only {
  display: none;
}
.racename {
  margin-top: 0;
  margin-bottom: 8px;
  padding: 10px 12px;
  background: rgba(16,19,27,0.92);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 15px;
  font-weight: 900;
  line-height: 1.25;
  box-shadow: var(--shadow2);
}

.racename.battle-gold {
  border-color: rgba(255,211,77,0.88);
  background: rgba(255,211,77,0.18);
  color: #fff8da;
  text-shadow: 0 0 12px rgba(255,211,77,0.52);
  box-shadow: 0 0 0 1px rgba(255,211,77,0.16) inset, 0 0 18px rgba(255,211,77,0.24), var(--shadow2);
}

.racename.battle-silver {
  border-color: rgba(210,220,235,0.88);
  background: rgba(210,220,235,0.16);
  color: #f7fbff;
  text-shadow: 0 0 12px rgba(210,220,235,0.46);
  box-shadow: 0 0 0 1px rgba(210,220,235,0.14) inset, 0 0 16px rgba(210,220,235,0.20), var(--shadow2);
}
.sugouma-flag {
  margin-top: 8px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  font-weight: 1000;
  letter-spacing: 0.02em;
  display: none;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 24px rgba(0,0,0,0.35);
}
.sugouma-flag.on {
  display: block;
}
.sugouma-flag::before {
  content: "";
  position: absolute;
  inset: -55% -85%;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(var(--shine-rgb, 255,255,255), 0.00) 35%,
    rgba(var(--shine-rgb, 255,255,255), 0.46) 50%,
    rgba(var(--shine-rgb, 255,255,255), 0.00) 65%,
    transparent 100%
  );
  transform: translateX(-70%) rotate(12deg);
  animation: sgShine 1.35s linear infinite;
  pointer-events: none;
  mix-blend-mode: screen;
}
@keyframes sgShine {
  0%   { transform: translateX(-70%) rotate(12deg); opacity: 0.06; }
  40%  { opacity: 0.62; }
  100% { transform: translateX(70%) rotate(12deg); opacity: 0.06; }
}
@keyframes sgPulse {
  0%   { filter: brightness(1.00); }
  50%  { filter: brightness(1.18); }
  100% { filter: brightness(1.00); }
}
.sugouma-flag.sg-sugo {
  border-color: rgba(220,240,255,0.35);
  background: rgba(180,220,255,0.12);
  text-shadow: 0 0 10px rgba(200,240,255,0.28);
  animation: sgPulse 1.0s ease-in-out infinite;
}
.sugouma-flag.sg-cho {
  border-color: rgba(70,179,255,0.60);
  background: rgba(70,179,255,0.18);
  text-shadow: 0 0 12px rgba(70,179,255,0.45);
  box-shadow: 0 0 0 1px rgba(70,179,255,0.20) inset, 0 0 18px rgba(70,179,255,0.35), var(--shadow2);
  animation: sgPulse 0.95s ease-in-out infinite;
}
.sugouma-flag.sg-chocho {
  border-color: rgba(181,108,255,0.65);
  background: rgba(181,108,255,0.18);
  text-shadow: 0 0 14px rgba(181,108,255,0.55);
  box-shadow: 0 0 0 1px rgba(181,108,255,0.22) inset, 0 0 22px rgba(181,108,255,0.42), var(--shadow2);
  animation: sgPulse 0.90s ease-in-out infinite;
}
.sugouma-flag.sg-goku {
  border-color: rgba(255,75,75,0.70);
  background: rgba(255,75,75,0.18);
  text-shadow: 0 0 14px rgba(255,75,75,0.58);
  box-shadow: 0 0 0 1px rgba(255,75,75,0.22) inset, 0 0 24px rgba(255,75,75,0.46), var(--shadow2);
  animation: sgPulse 0.88s ease-in-out infinite;
}
.sugouma-flag.sg-zetsu {
  border-color: rgba(255,211,77,0.80);
  background: rgba(255,211,77,0.20);
  color: #fff8da;
  text-shadow: 0 0 16px rgba(255,211,77,0.70);
  box-shadow: 0 0 0 1px rgba(255,211,77,0.24) inset, 0 0 26px rgba(255,211,77,0.52), var(--shadow2);
  animation: sgPulse 0.85s ease-in-out infinite;
}

/* ★ 乗替推奨（凄馬風バナー） */
.norikae-flag {
  margin-top: 8px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  font-weight: 1000;
  letter-spacing: 0.02em;
  display: none;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 24px rgba(0,0,0,0.35);
  line-height: 1.35;
}
.norikae-flag.on {
  display: block;
}
.norikae-flag::before {
  content: "";
  position: absolute;
  inset: -55% -85%;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(var(--shine-rgb, 255,255,255), 0.00) 35%,
    rgba(var(--shine-rgb, 255,255,255), 0.46) 50%,
    rgba(var(--shine-rgb, 255,255,255), 0.00) 65%,
    transparent 100%
  );
  transform: translateX(-70%) rotate(12deg);
  animation: sgShine 1.25s linear infinite;
  pointer-events: none;
  mix-blend-mode: screen;
}
.norikae-flag.nk-on {
  border-color: rgba(90, 230, 140, 0.58);
  background: rgba(90, 230, 140, 0.14);
  text-shadow: 0 0 12px rgba(90, 230, 140, 0.38);
  box-shadow: 0 0 0 1px rgba(90, 230, 140, 0.14) inset, 0 0 18px rgba(90, 230, 140, 0.20), var(--shadow2);
  animation: sgPulse 0.95s ease-in-out infinite;
}

.racemeta {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
#raceMeta { display:block; line-height:1.55; }
.meta-reason { border-left:2px solid #779a83; padding-left:10px; font-size:13px; color:var(--text); }
.meta-reason-label { display:block; font-size:11px; color:#a6c4af; margin-bottom:2px; }
.meta-conditions { margin:8px 0 0 12px; font-size:11px; color:var(--muted); }
.meta-wind { margin:8px 0 0 12px; font-size:12px; }
.meta-wind-line { display:flex; flex-wrap:wrap; align-items:center; gap:7px; }
.meta-wind-arrow { font-size:22px; line-height:1; color:#c5dacc; }
.meta-wind-compass { font-size:10px; color:var(--muted); }
.meta-wind-segments { margin-top:3px; font-size:11px; color:var(--muted); }
.chip {
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.06);
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
  transition: transform 120ms ease, filter 120ms ease;
}
.chip b {
  color: var(--text);
  margin-right: 8px;
}
.chip:active {
  transform: scale(0.98);
  filter: brightness(1.05);
}
.chip.baba-turf { background: rgba(0, 160, 70, 0.44); color: #f3fff5; border-color: rgba(0,160,70,0.70); }
.chip.baba-dirt { background: rgba(140, 85, 55, 0.48); color: #fff5ef; border-color: rgba(140,85,55,0.72); }
.chip.baba-jump { background: rgba(0, 145, 165, 0.46); color: #effdff; border-color: rgba(0,145,165,0.72); }
.chip.rank-s  { background: rgba(220, 170, 0, 0.56); color: #1a1400; border-color: rgba(220,170,0,0.85); }
.chip.rank-a  { background: rgba(0, 95, 210, 0.56); color: #f2f7ff; border-color: rgba(0,95,210,0.85); }
.chip.rank-ng { background: rgba(210, 55, 55, 0.56); color: #fff3f3; border-color: rgba(210,55,55,0.85); }

/* ★ 表示だけ廃止：指数比較（混戦など）のバッジを出さない */
#raceMeta .chip[data-key="指数比較"] {
  display: none !important;
}

/* ★ おすすめ買い目が存在する場合（.rec-on）: 凄馬同様のエフェクト */
@keyframes recShine {
  0%   { transform: translateX(-70%) rotate(12deg); opacity: 0.06; }
  40%  { opacity: 0.62; }
  100% { transform: translateX(70%) rotate(12deg); opacity: 0.06; }
}
@keyframes recPulse {
  0%   { filter: brightness(1.00); }
  50%  { filter: brightness(1.16); }
  100% { filter: brightness(1.00); }
}
.chip.rec-on {
  position: relative;
  overflow: hidden;
  animation: recPulse 0.95s ease-in-out infinite;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.10) inset, 0 0 16px rgba(255,255,255,0.10);
}
.chip.rec-on::before {
  content: "";
  position: absolute;
  inset: -55% -85%;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(var(--shine-rgb, 255,255,255), 0.00) 35%,
    rgba(var(--shine-rgb, 255,255,255), 0.46) 50%,
    rgba(var(--shine-rgb, 255,255,255), 0.00) 65%,
    transparent 100%
  );
  transform: translateX(-70%) rotate(12deg);
  animation: recShine 1.20s linear infinite;
  pointer-events: none;
  mix-blend-mode: screen;
}

.wrapper {
  padding: 12px 12px calc(24px + env(safe-area-inset-bottom)) 12px;
}

.tablewrap {
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  background: rgba(16,19,27,0.88);
  box-shadow: var(--shadow);
}
.scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.scroll::-webkit-scrollbar {
  height: 10px;
}
.scroll::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.18);
  border-radius: 999px;
}
.scroll::-webkit-scrollbar-track {
  background: rgba(255,255,255,0.06);
}

table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  min-width: 980px;
}
th, td {
  border-bottom: 1px solid var(--line);
  padding: 8px 10px;
  font-size: 13px;
  text-align: center;
  white-space: nowrap;
  vertical-align: middle;
  line-height: 1.15;
}
th {
  position: sticky;
  top: 0;
  z-index: 5;
  background: rgba(255,255,255,0.06);
  font-weight: 900;
  font-size: 12px;
  letter-spacing: 0.02em;
}
tbody tr {
  --rowbg: rgba(16,19,27,0.96);
  transition: transform 120ms ease, filter 120ms ease;
}
tbody tr:nth-child(even) {
  --rowbg: rgba(18,22,32,0.96);
}
tbody td {
  background-color: var(--rowbg);
}
tbody tr:active {
  transform: scale(0.995);
  filter: brightness(1.06);
}

@keyframes podiumPulse {
  0%   { filter: brightness(1.00); }
  50%  { filter: brightness(1.14); }
  100% { filter: brightness(1.00); }
}
@keyframes podiumShine {
  0%   { background-position: -140% 0; opacity: 0.08; }
  40%  { opacity: 0.55; }
  100% { background-position: 140% 0; opacity: 0.08; }
}

tbody tr.in3 td {
  background-image: linear-gradient(
    90deg,
    rgba(255,255,255,0.00) 0%,
    rgba(255,255,255,0.07) 45%,
    rgba(255,255,255,0.00) 70%,
    rgba(255,255,255,0.00) 100%
  );
  background-size: 260% 100%;
  background-position: -140% 0;
  animation: podiumShine 1.20s linear infinite, podiumPulse 1.05s ease-in-out infinite;
}

tbody tr.pos1 td {
  box-shadow: 0 0 0 1px rgba(255,211,77,0.16) inset, 0 0 20px rgba(255,211,77,0.18);
}
tbody tr.pos2 td {
  box-shadow: 0 0 0 1px rgba(210,220,235,0.14) inset, 0 0 18px rgba(210,220,235,0.14);
}
tbody tr.pos3 td {
  box-shadow: 0 0 0 1px rgba(255,160,95,0.14) inset, 0 0 18px rgba(255,160,95,0.12);
}

td.vstack {
  white-space: pre-line;
  line-height: 1.20;
  font-size: 12px;
}
td.umaban {
  font-weight: 900;
  padding: 8px 10px;
  font-size: 13px;
  border-radius: 0;
}
td.horse {
  font-weight: 900;
  font-size: 13px;
  text-align: left;
}
td.bigcell {
  font-size: 13px;
  font-weight: 800;
}

.sticky-left-1 {
  position: sticky;
  left: 0;
  z-index: 6;
  background-color: var(--rowbg);
}
.sticky-left-2 {
  position: sticky;
  left: 72px;
  z-index: 6;
  background-color: var(--rowbg);
}
th.sticky-left-1, th.sticky-left-2 {
  z-index: 8;
  background: rgba(18,22,32,0.98);
}
.sticky-left-1::after, .sticky-left-2::after {
  content: "";
  position: absolute;
  top: 0;
  right: -1px;
  width: 1px;
  height: 100%;
  background: rgba(255,255,255,0.10);
}

.waku-1 { background: #ffffff; color: #111; }
.waku-2 { background: #2b2b2b; color: #fff; }
.waku-3 { background: #c65a5a; color: #fff; }
.waku-4 { background: #4f7db8; color: #fff; }
.waku-5 { background: #b99a00; color: #fff; }
.waku-6 { background: #2f8f5a; color: #fff; }
.waku-7 { background: #c97a2a; color: #fff; }
.waku-8 { background: #c46ab0; color: #fff; }

.hmark-ss { color: #ffd34d; }
.hmark-s  { color: #a8d5ff; }
.hmark-m  { color: #ff9fc9; }
.hmark-w  { color: #e9edf5; }
.mark-consensus {
  color: #ffd34d !important;
  text-shadow: 0 0 10px rgba(255,211,77,0.62);
}

@keyframes sgSpark {
  0%   { filter: brightness(1.00); }
  50%  { filter: brightness(1.22); }
  100% { filter: brightness(1.00); }
}
@keyframes sgSweep {
  0%   { background-position: -140% 0; }
  100% { background-position: 140% 0; }
}
.sg-row td {
  transition: filter 120ms ease, background 120ms ease;
}
.sg-row td.horse {
  border-radius: 0;
  background-image: linear-gradient(
    90deg,
    rgba(255,255,255,0.00) 0%,
    rgba(255,255,255,0.08) 45%,
    rgba(255,255,255,0.00) 70%,
    rgba(255,255,255,0.00) 100%
  );
  background-size: 260% 100%;
  background-position: -140% 0;
  animation: sgSweep 1.10s linear infinite, sgSpark 0.95s ease-in-out infinite;
}
.sg-row.sg-sugo td.horse {
  box-shadow: 0 0 0 1px rgba(200,240,255,0.18) inset, 0 0 16px rgba(200,240,255,0.18);
  text-shadow: 0 0 10px rgba(200,240,255,0.22);
}
.sg-row.sg-cho td.horse {
  box-shadow: 0 0 0 1px rgba(70,179,255,0.22) inset, 0 0 22px rgba(70,179,255,0.32);
  text-shadow: 0 0 12px rgba(70,179,255,0.45);
}
.sg-row.sg-chocho td.horse {
  box-shadow: 0 0 0 1px rgba(181,108,255,0.24) inset, 0 0 26px rgba(181,108,255,0.38);
  text-shadow: 0 0 12px rgba(181,108,255,0.55);
}
.sg-row.sg-goku td.horse {
  box-shadow: 0 0 0 1px rgba(255,75,75,0.24) inset, 0 0 28px rgba(255,75,75,0.40);
  text-shadow: 0 0 12px rgba(255,75,75,0.58);
}
.sg-row.sg-zetsu td.horse {
  box-shadow: 0 0 0 1px rgba(255,211,77,0.26) inset, 0 0 30px rgba(255,211,77,0.50);
  text-shadow: 0 0 14px rgba(255,211,77,0.75);
}

.cardwrap {
  display: none;
  margin-top: 12px;
}
.cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.card {
  border: 1px solid var(--line);
  background: rgba(16,19,27,0.88);
  border-radius: 16px;
  box-shadow: var(--shadow2);
  overflow: hidden;
  transform: translateY(0);
  animation: fadeUp 180ms ease both;
}

@keyframes cardPodiumPulse {
  0%   { filter: brightness(1.00); }
  50%  { filter: brightness(1.12); }
  100% { filter: brightness(1.00); }
}

.card.in3 {
  animation: fadeUp 180ms ease both, cardPodiumPulse 1.10s ease-in-out infinite;
}

.card.pos1 {
  border-color: rgba(255,211,77,0.55);
  box-shadow: 0 0 0 1px rgba(255,211,77,0.12) inset, 0 0 22px rgba(255,211,77,0.22), var(--shadow2);
}
.card.pos2 {
  border-color: rgba(210,220,235,0.55);
  box-shadow: 0 0 0 1px rgba(210,220,235,0.12) inset, 0 0 18px rgba(210,220,235,0.18), var(--shadow2);
}
.card.pos3 {
  border-color: rgba(255,160,95,0.50);
  box-shadow: 0 0 0 1px rgba(255,160,95,0.10) inset, 0 0 16px rgba(255,160,95,0.16), var(--shadow2);
}
.card.sg-card {
  position: relative;
  overflow: hidden;
}
.card.sg-card::before {
  content: "";
  position: absolute;
  inset: -40% -60%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.30), transparent);
  transform: rotate(12deg);
  animation: sgShine 1.15s linear infinite;
  pointer-events: none;
  opacity: 0.65;
}
.card.sg-card.sg-sugo {
  border-color: rgba(200,240,255,0.35);
  box-shadow: 0 0 0 1px rgba(200,240,255,0.10) inset, 0 0 16px rgba(200,240,255,0.18), var(--shadow2);
}
.card.sg-card.sg-cho {
  border-color: rgba(70,179,255,0.55);
  box-shadow: 0 0 0 1px rgba(70,179,255,0.12) inset, 0 0 22px rgba(70,179,255,0.30), var(--shadow2);
}
.card.sg-card.sg-chocho {
  border-color: rgba(181,108,255,0.60);
  box-shadow: 0 0 0 1px rgba(181,108,255,0.12) inset, 0 0 26px rgba(181,108,255,0.36), var(--shadow2);
}
.card.sg-card.sg-goku {
  border-color: rgba(255,75,75,0.65);
  box-shadow: 0 0 0 1px rgba(255,75,75,0.12) inset, 0 0 28px rgba(255,75,75,0.38), var(--shadow2);
}
.card.sg-card.sg-zetsu {
  border-color: rgba(255,211,77,0.75);
  box-shadow: 0 0 0 1px rgba(255,211,77,0.14) inset, 0 0 30px rgba(255,211,77,0.46), var(--shadow2);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card .c1 {
  display: grid;
  grid-template-columns: 68px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 12px 12px 8px 12px;
  cursor: pointer;
}
.card .umabadge {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  height: 44px;
  border-radius: 14px;
  font-weight: 1000;
  font-size: 16px;
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset;
}
.card .hname {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 8px;
  font-weight: 1000;
  font-size: 15px;
  line-height: 1.15;
}
.card .hname .htext {
  flex: 1 1 auto;
  min-width: 0;
}
.card .hname .hscore {
  flex: 0 0 auto;
  transform: translateY(-1px);
}
.card .hname .hscore .pill {
  padding: 5px 9px;
  font-size: 11px;
}
.card .marks {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-end;
  font-size: 12px;
  color: var(--muted);
}
.card .marks .mstrong {
  font-size: 16px;
  font-weight: 1000;
  color: var(--text);
}
.card .marks .fin {
  font-size: 11px;
  font-weight: 900;
  color: #e9edf5;
  padding: 4px 8px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.06);
}
.card.pos1 .marks .fin {
  border-color: rgba(255,211,77,0.34);
  background: rgba(255,211,77,0.16);
  color: #fff8da;
}
.card.pos2 .marks .fin {
  border-color: rgba(210,220,235,0.32);
  background: rgba(210,220,235,0.14);
  color: #f7fbff;
}
.card.pos3 .marks .fin {
  border-color: rgba(255,160,95,0.30);
  background: rgba(255,160,95,0.12);
  color: #fff3ec;
}
.card .grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px 10px;
  padding: 10px 12px 12px 12px;
  border-top: 1px solid var(--line);
  align-items: start;
}

.kv {
  display: grid;
  grid-template-columns: 78px 1fr;
  gap: 8px;
  align-items: start;
}

.card.collapsed .grid {
  display: none;
}
.card .hname { flex-direction:column; align-items:flex-start; }
.card .market-line { display:inline-flex; flex-wrap:wrap; gap:3px 10px; font-size:13px; font-weight:normal; }
.card .market-line > span { white-space:nowrap; }
.probability-pair { display:grid; gap:4px; width:100%; min-width:0; }
.probability-bar { display:grid; grid-template-columns:3em minmax(24px,1fr) 4em; align-items:center; gap:6px; font-size:11px; line-height:1.2; font-weight:600; color:var(--text); }
.probability-track { height:5px; overflow:hidden; border-radius:8px; background:rgba(128,145,163,.30); }
.probability-fill { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,#bb8128,#f5cd67); }
.probability-bar.top3 .probability-fill { background:linear-gradient(90deg,#4589d7,#5ac8dc); }
.probability-number { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
td.probability-cell { min-width:140px; }
td.probability-cell .probability-bar { grid-template-columns:minmax(36px,1fr) 4em; font-size:13px; }
td.probability-cell .probability-label { display:none; }
.card .market-jockey { order:-1; }
.card .market-odds { order:0; }
.card .market-pop { order:1; }
.card.collapsed .market-pop { order:0; }
.card.collapsed .market-odds { order:1; }
.card.collapsed .marks .fin { display:none; }
.card.collapsed .c1 {
  grid-template-columns: 56px 1fr auto;
  padding: 12px 12px 12px 12px;
}
.card.collapsed .umabadge {
  height: 38px;
  border-radius: 12px;
  font-size: 14px;
}
.card.collapsed .hname {
  font-size: 14px;
}
.card.collapsed .hname .hscore .pill {
  padding: 5px 9px;
  font-size: 11px;
}
.card.collapsed .marks {
  opacity: 0.95;
  flex-direction: column;
  gap: 4px;
  align-items: flex-end;
}
.card.collapsed .marks .mstrong {
  font-size: 15px;
}

.kv {
  display: grid;
  grid-template-columns: 78px 1fr;
  gap: 8px;
  align-items: baseline;
}
.kv .k {
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.02em;
}
.kv .v {
  color: var(--text);
  font-size: 13px;
  font-weight: 900;
  white-space: pre-line;
  line-height: 1.20;
}
.kv.full {
  grid-column: 1 / -1;
}
.pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 6px 10px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  font-weight: 900;
  font-size: 12px;
  white-space: nowrap;
}
.pill.p-score { background: rgba(120,170,255,0.14); border-color: rgba(120,170,255,0.26); }
.pill.p-u    { background: rgba(255,210,120,0.12); border-color: rgba(255,210,120,0.22); }
.pill.p-n    { background: rgba(255,255,255,0.06); }
.pill.p-nk   { background: rgba(90, 230, 140, 0.16); border-color: rgba(90, 230, 140, 0.55); color: #eafff1; }

.footer {
  margin-top: 10px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}

.controls-row.viewer-row4 {

.pack4c-wrap {

}

.pack4c-grid {
  display: block;
}

.pack4c-scatter {

.pack4c-yaxis {

.pack4c-plot {

@keyframes pack4cBallGlow {

  50%  { filter: brightness(1.18); }
  100% { filter: brightness(1.00); }

@media (prefers-reduced-motion: reduce) {

.pack4c-horse .star {

}

/* Purchase-panel palette, with the original prediction HTML font family. */

}

  --text:#172536; --muted:#354459; --line:#778492;
  --navy-text:#172536; --navy-border:#778492;
}
body {font-family:var(--viewer-font);background:var(--bg);color:var(--ink)}
button,select,input,textarea {font-family:var(--viewer-font)}
.topbar {background:var(--panel);border-color:var(--line);box-shadow:0 4px 20px rgba(23,34,56,.04)}
.racename {background:var(--purchase-card);border-color:var(--line);color:var(--ink);box-shadow:none}

<script>(() => {
  const key='keibaDisplayTheme';
  let theme='night';
  try {if(localStorage.getItem(key)==='day') theme='day'} catch (_) {}
  const apply=()=>{
    document.documentElement.dataset.displayTheme=theme;
    document.querySelectorAll('.theme-toggle').forEach(b=>{
      b.textContent=theme==='night'?'昼モード':'夜モード';
      b.setAttribute('aria-label',theme==='night'?'昼モードへ切替':'夜モードへ切替');
    });
  };
  apply();
  document.addEventListener('DOMContentLoaded',()=>{
    if(!document.querySelector('.theme-toggle')) {
      const parent=document.querySelector('.view-switch')||document.querySelector('.topbar');
      if(parent){const b=document.createElement('button');b.type='button';b.className='theme-toggle';parent.appendChild(b)}
    }
    document.querySelectorAll('.theme-toggle').forEach(b=>b.addEventListener('click',()=>{
      theme=theme==='night'?'day':'night';
      try{localStorage.setItem(key,theme)}catch(_){}
      apply();
    }));
    apply();
  });
})();
</script>
<script>// Display-only pull-to-refresh. Preserve the current page, date and race.
(() => {
  document.addEventListener('DOMContentLoaded', () => {
    const area = document.querySelector('.topbar');
    if (!area) return;
    let start = null, refreshing = false;
    function begin(x, y, target) {
      start = null;
      if (refreshing || window.scrollY > 8 || target.closest('button,a,select,input,label,summary')) return;
      start = {x, y, at: Date.now()};
    }
    function end(x, y) {
      const origin = start;
      start = null;
      if (!origin || refreshing) return;
      const dx = Math.abs(x - origin.x), dy = y - origin.y;
      if (dy < 90 || dy < dx * 1.5 || Date.now() - origin.at > 1800) return;
      refreshing = true;
      const hint = area.querySelector('.swipe-hint');
      if (hint) hint.textContent = '更新中…';
      const url = new URL(location.href);
      url.searchParams.set('v', Date.now());
      location.href = url.href;
    }
    area.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) { start = null; return; }
      const t = e.touches[0]; begin(t.clientX, t.clientY, e.target);
    }, {passive:true});
    document.addEventListener('touchend', e => {
      if (e.touches.length) { start = null; return; }
      const t = e.changedTouches[0]; if (t) end(t.clientX, t.clientY);
    }, {passive:true});
    document.addEventListener('touchcancel', () => {start = null;}, {passive:true});
    area.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'touch' && e.button === 0) begin(e.clientX, e.clientY, e.target);
    });
    document.addEventListener('pointerup', e => {
      if (e.pointerType !== 'touch') end(e.clientX, e.clientY);
    });
    document.addEventListener('pointercancel', () => {start = null;});
  }, {once:true});
})();
</script>

      <!-- ★ 文言は「表示/非表示」に寄せる（JSで追従させます：置換③） -->

<script>
// Presentation only: aggregate the exact tickets, never create purchase tickets.
const TicketDisplay = (() => {
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const yen = value => `${Number(value).toLocaleString('ja-JP')}円`;
  const key = ns => ns.join('-');
  const canonical = (kind, ns) => ['3連複','馬連','ワイド'].includes(kind) ? [...ns].sort((a,b)=>a-b) : [...ns];
  const priority = (marks,n) => ({'◎':0,'◉':0,'○':1,'▲':2,'△1':3,'△2':4,'△3':5,'△4':6,'△5':7})[(String(marks[n]||'').match(/^(◎|◉|○|▲|△[1-5])/)||[])[1]] ?? 99;
  function expand(kind,groups) {
    const found=new Map();
    function visit(ns,col) {
      if(col===groups.length) {const result=canonical(kind,ns);found.set(key(result),result);return;}
      for(const n of groups[col]) if(!ns.includes(n)) visit([...ns,n],col+1);
    }
    visit([],0);
    return [...found.values()];
  }
  function groupFormation(kind,groups,marks) {
    const sorted=groups.map(g=>[...g].sort((a,b)=>priority(marks,a)-priority(marks,b)||a-b));
    const equal=(a,b)=>a.length===b.length && a.every(n=>b.includes(n));
    const fixed=sorted.map((g,i)=>g.length===1?i:-1).filter(i=>i>=0);
    if(kind==='3連複') {
      if(equal(sorted[0],sorted[1]) && equal(sorted[1],sorted[2]))
        return {label:`${sorted[0].length}頭BOX`,rows:[['対象',sorted[0]]]};
      if(fixed.length===1) {
        const others=sorted.filter((_,i)=>i!==fixed[0]);
        if(equal(others[0],others[1])) return {label:'1頭軸固定',rows:[['軸',sorted[fixed[0]]],['相手',others[0]]]};
      }
      if(fixed.length===2) {
        const axes=fixed.map(i=>sorted[i][0]).sort((a,b)=>priority(marks,a)-priority(marks,b)||a-b);
        return {label:'2頭軸固定',rows:[['軸',axes],['相手',sorted.find((_,i)=>!fixed.includes(i))]]};
      }
    }
    if(kind==='3連単' && equal(sorted[0],sorted[1]) && equal(sorted[1],sorted[2])) return {label:sorted[0].length+'頭BOX',rows:[['対象',sorted[0]]]};
    let label='フォーメーション';
    if(kind==='3連単' && fixed.length===2) label=fixed.map(i=>i+1).join('・')+'着固定';
    if(kind==='3連単' && sorted[0].length===2 && equal(sorted[0],sorted[2])) label='1・3着入替';
    return {label,rows:sorted.map((g,i)=>[['3連単','馬単'].includes(kind)?`${i+1}着`:`${i+1}列目`,g])};
  }

  // Keep the broad purchase formations. Pack supplements only when expansion
  // exactly fits the remaining tickets; this never changes the wager ledger.
  function formationSections(bets) {
    const result=[];
    for(const part of summarize(bets)) {
      const remaining=new Map(part.tickets.map(t=>[key(t.numbers),{numbers:t.numbers,stake:t.stake}]));
      const seen=new Set();
      function add(groups,unit,topup) {
        const numbers=expand(part.kind,groups),overlapPoints=numbers.filter(ns=>seen.has(key(ns))).length;
        for(const ns of numbers) {
          const entry=remaining.get(key(ns));
          if(!entry || entry.stake<unit) throw Error('表示フォーメーションと購入金額が不一致です');
          entry.stake-=unit;seen.add(key(ns));
        }
        result.push({...part,groups:groups.map(g=>[...g]),tickets:numbers.map(ns=>({numbers:ns,stake:unit})),
          formation:groupFormation(part.kind,groups,part.marks),points:numbers.length,
          overlapPoints,amount:numbers.length*unit,stakeText:`各${yen(unit)}${topup?'追加':''}`,topup,section:result.length});
      }
      for(const bet of bets.filter(b=>b.bet_type===part.kind)) {
        if(![2,3].includes(bet.groups?.length) || bet.groups.filter(g=>g.length>1).length<2) continue;
        const generated=expand(part.kind,bet.groups),original=new Set(bet.tickets.map(ns=>key(canonical(part.kind,ns))));
        if(generated.length!==original.size || !generated.every(ns=>original.has(key(ns)))) continue;
        if(!generated.every(ns=>remaining.get(key(ns))?.stake>=bet.unit_yen)) continue;
        // Preserve explicit formations; overlapPoints labels the additive stakes.
        add(bet.groups,Number(bet.unit_yen),generated.every(ns=>seen.has(key(ns))));
      }
      while([...remaining.values()].some(t=>t.stake>0)) {
        const positive=[...remaining.values()].filter(t=>t.stake>0);
        const unit=Math.min(...positive.map(t=>t.stake));
        for(const topup of [false,true]) {
          const available=new Set(positive.filter(t=>t.stake>=unit && seen.has(key(t.numbers))===topup).map(t=>key(t.numbers)));
          while(available.size) {
            const tuples=[...available].map(id=>remaining.get(id).numbers);
            const horses=[...new Set(tuples.flat())].sort((a,b)=>priority(part.marks,a)-priority(part.marks,b)||a-b);
            const fits=groups=>{
              const ts=expand(part.kind,groups);
              return ts.length && ts.every(ns=>available.has(key(ns)))?ts:[];
            };
            let best=null,bestTickets=[];
            for(const seed of tuples) {
              let groups=seed.map(n=>[n]),tickets=fits(groups);
              while(true) {
                let improved=null,larger=tickets;
                for(let col=0;col<groups.length;col++) for(const n of horses) {
                  if(groups[col].includes(n)) continue;
                  const trial=groups.map((g,i)=>i===col?[...g,n]:[...g]);
                  const ts=fits(trial);
                  if(ts.length>larger.length) {improved=trial;larger=ts;}
                }
                if(!improved) break;
                groups=improved;tickets=larger;
              }
              if(tickets.length>bestTickets.length) {best=groups;bestTickets=tickets;}
            }
            add(best,unit,topup);
            bestTickets.forEach(ns=>available.delete(key(ns)));
          }
        }
      }
    }
    return result;
  }
  function summarize(bets) {
    const kinds = new Map();
    for (const bet of bets || []) {
      if (!kinds.has(bet.bet_type)) kinds.set(bet.bet_type, {kind:bet.bet_type, tickets:new Map(), marks:{}, names:{},frames:{}});
      const part = kinds.get(bet.bet_type);
      Object.assign(part.marks, bet.horse_marks || {}); Object.assign(part.names, bet.horse_names || {});
      Object.assign(part.frames,bet.horse_frames || {});
      for (const raw of bet.tickets || []) {
        const numbers = canonical(bet.bet_type, raw.map(Number));
        const id = key(numbers), old = part.tickets.get(id);
        part.tickets.set(id, {numbers, stake:(old?.stake || 0)+Number(bet.unit_yen)});
      }
    }
    return [...kinds.values()].map(part => {
      part.tickets = [...part.tickets.values()];
      part.points = part.tickets.length;
      part.amount = part.tickets.reduce((sum,t)=>sum+t.stake,0);
      part.formation = formation(part.kind, part.tickets.map(t=>t.numbers));
      const stakes = [...new Set(part.tickets.map(t=>t.stake))].sort((a,b)=>a-b);
      part.stakes = stakes;
      part.stakeText = stakes.length === 1 ? `各${yen(stakes[0])}` :
        `基本${yen(stakes[0])}・` + stakes.slice(1).map(stake=>`重点${part.tickets.filter(t=>t.stake===stake).length}組は${yen(stake)}`).join('・');
      return part;
    });
  }
  function formation(kind, tickets) {
    const all = [...new Set(tickets.flat())].sort((a,b)=>a-b);
    const actual = new Set(tickets.map(ns=>key(canonical(kind,ns))));
    const matches = groups => {
      const found = new Set(expand(kind,groups).map(key));
      return found.size===actual.size && [...found].every(id=>actual.has(id));
    };
    if (kind === '3連複') {
      if (matches([all,all,all])) return {label:`${all.length}頭BOX`, rows:[['対象',all]]};
      const axes = all.filter(n=>tickets.every(ns=>ns.includes(n)));
      const rest = all.filter(n=>!axes.includes(n));
      if (axes.length===1 && matches([axes,rest,rest])) return {label:`1頭軸・相手${rest.length}頭`,rows:[['軸',axes],['相手',rest]]};
      if (axes.length===2 && matches([[axes[0]],[axes[1]],rest])) return {label:`2頭軸・相手${rest.length}頭`,rows:[['軸',axes],['相手',rest]]};
    }
    if (['3連単','馬単'].includes(kind)) {
      const groups = (kind==='馬単'?[0,1]:[0,1,2]).map(i=>[...new Set(tickets.map(ns=>ns[i]))]);
      if (matches(groups)) return {label:'フォーメーション',rows:groups.map((ns,i)=>[`${i+1}着`,ns])};
    }
    return {label:'選択した組み合わせ',rows:[]};
  }
  function render(bets, options = {}) {
    const summarized=summarize(bets);
    const sections=options.formations || summarized.some(p=>!p.formation.rows.length)
      ?formationSections(bets):summarized.flatMap(displaySections);
    return sections.map((part,index) => {
      const order = n => ({'◎':0,'◉':0,'○':1,'▲':2,'△1':3,'△2':4,'△3':5,'△4':6,'△5':7})[(String(part.marks[n]||'').match(/^(◎|◉|○|▲|△[1-5])/)||[])[1]] ?? 99;
      const horse = n => options.horseBadge ? options.horseBadge(n,part.marks,part.names) : badge(n,part);
      const separator=['3連単','馬単'].includes(part.kind)?'＞':'×';
      // Align to the number badge itself, keeping the first row stable on wrap.
      const numberTop=options.horseBadge?14:15,numberSize=options.horseBadge?25:28;
      const combinations=part.formation.layout==='tickets';
      const columns=part.formation.rows.map(([label,ns])=>`<div class="ticket-column" aria-label="${esc(label)}" style="min-width:34px;display:inline-flex;align-items:flex-start;gap:4px;flex:0 1 auto">${['軸','相手'].includes(label)?`<span style="opacity:.7;font-size:12px;line-height:12px;white-space:nowrap;margin-top:${numberTop+(numberSize-12)/2}px">${esc(label==='軸' && ns.length>1?'軸'+ns.length+'頭':label)}</span>`:''}<span class="bet-formation" style="min-width:0;display:flex;align-items:flex-start;flex-wrap:wrap;gap:6px">${[...ns].sort((a,b)=>order(a)-order(b)||a-b).map(horse).join('')}</span></div>`);
      const rows=combinations
        ? `<div class="ticket-combinations" role="list" style="display:grid;gap:8px;margin-top:8px">${part.formation.rows.map(([label,ns])=>{
            const numbers=['3連単','馬単'].includes(part.kind)?ns:[...ns].sort((a,b)=>order(a)-order(b)||a-b);
            const between=`<span class="ticket-number-separator" style="display:inline-flex;align-items:center;justify-content:center;height:${numberSize}px;margin-top:${numberTop}px;font-size:15px;opacity:.65">${['3連単','馬単'].includes(part.kind)?'＞':'−'}</span>`;
            return `<div class="ticket-combination" role="listitem" data-ticket="${ns.map(Number).join('-')}" aria-label="${esc(label)}" style="display:flex;align-items:flex-start;gap:8px"><small style="min-width:28px;margin-top:${numberTop+(numberSize-12)/2}px;font-size:11px;opacity:.7">${esc(label)}</small><span class="bet-formation" style="display:flex;align-items:flex-start;gap:6px">${numbers.map(horse).join(between)}</span></div>`;
          }).join('')}</div>`
        : `<div class="ticket-columns" style="margin-top:8px;display:inline-flex;align-items:flex-start;gap:6px;max-width:100%">${columns.join(`<span class="ticket-separator" style="display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;height:${numberSize}px;margin-top:${numberTop}px;font-size:20px;line-height:1;font-weight:700;opacity:.65">${separator}</span>`)}</div>`;
      const topupLabel=part.formation.label.startsWith('2頭軸')?'2頭軸固定':part.formation.label;
      const title=combinations?(part.topup?'重ね買い・組み合わせ':'組み合わせ'):part.overlapPoints>0 && part.overlapPoints<part.points ? part.formation.label+'（'+part.overlapPoints+'組重ね買い）' : part.topup?'重ね買い・'+topupLabel:part.formation.label;
      return `<div class="compact-ticket" style="padding:12px 0;border-bottom:1px solid #8884"><b>${options.formations?`${index+1}. `:''}${esc(part.kind)}　${esc(title)}</b><div style="margin-top:4px">${part.points}${combinations?'組':'点'}・${yen(part.amount)}（${esc(part.stakeText)}）</div>${rows}</div>`;
    }).join('');
  }
  function displaySections(part) {
    const base=part.stakes[0];
    const levels=[base,...part.stakes.slice(1).map((stake,i)=>stake-part.stakes[i])];
    return levels.map((unit,i)=>{
      const included=part.tickets.filter(t=>i===0 || t.stake>=part.stakes[i]);
      const tickets=included.map(t=>({numbers:[...t.numbers],stake:unit}));
      const form=formation(part.kind,tickets.map(t=>t.numbers));
      // Even an irregular top-up lists its exact few combinations up front.
      if(i>0 && (!form.rows.length || form.label.endsWith('頭BOX'))) {
        form.rows=tickets.map((t,j)=>[`組${j+1}`,t.numbers]);
        form.layout='tickets';
      }
      return {...part,tickets,formation:form,points:tickets.length,amount:tickets.length*unit,
        stakeText:`各${yen(unit)}${i>0?'追加':''}`,topup:i>0,section:i};
    });
  }
  function badge(n,part) {
    const frame=Number(part.frames[n]) || 1;
    const bg=['','#fff','#202225','#e53935','#2979d8','#f4d538','#2f984d','#ef8a2e','#ef9ebd'][frame];
    const fg=[2,3,4,6].includes(frame)?'#fff':'#111';
    const mark=String(part.marks[n]||'');
    const name=Array.from(String(part.names[n]||'')).slice(0,3).join('');
    return `<span style="display:inline-flex;flex-direction:column;align-items:center;gap:3px;min-width:32px" title="${esc(part.names[n]||'')}" aria-label="${frame}枠 ${n}番 ${esc(mark)} ${esc(part.names[n]||'')}"><small style="display:block;height:12px;line-height:12px;font-size:11px;font-weight:900">${esc(mark)||'&nbsp;'}</small><b style="display:inline-grid;box-sizing:border-box;place-items:center;background:${bg};color:${fg};width:28px;height:28px;border:1px solid #8888;border-radius:7px;font-size:14px">${n}</b><small style="height:10px;line-height:10px;font-size:8px;white-space:nowrap">${esc(name)||'&nbsp;'}</small></span>`;
  }
  return {summarize, formation, displaySections, formationSections, expand, render};
})();

/* Fixed display order: front-runner, prominent, closer, hold-up. */
function styleIndicatorHtml(value, compact=false) {
  if(String(value??'').includes('対象外'))return compact?'':'<span class="style-label">対象外</span>';
  if(String(value??'').includes('後方'))return '<span class="style-indicator'+(compact?' compact':'')+'" role="img" aria-label="後方待機" title="後方待機・追込候補と区別"><span class="style-symbols" aria-hidden="true">◁◁◁◁</span>'+(compact?'':'<span class="style-label">後方待機</span>')+'</span>';
  const candidates=String(value??'').match(/逃げ|先行|差し|追い込み|追込み|追込|逃|先|差|追/g)||[];
  const names=candidates.map(s=>s.startsWith('逃')?'逃げ':s.startsWith('先')?'先行':s.startsWith('差')?'差し':'追込');
  const order=['逃げ','先行','差し','追込'],label=names[0]||'不明',index=order.indexOf(label);
  const symbols=order.map((_,i)=>i===index?'◀︎':'◁').join('');
  return '<span class="style-indicator'+(compact?' compact':'')+'" role="img" aria-label="脚質 '+label+'" title="左から逃げ・先行・差し・追込"><span class="style-symbols" aria-hidden="true">'+symbols+'</span>'+(compact?'':'<span class="style-label">'+label+'</span>')+'</span>';
}

/* Compact predicted/observed pairs; blank is unknown, never a zero-second run. */
function sectionNumber(value,suffix='秒') {
  if(value===null||value===undefined||String(value).trim()==='')return '—';
  const n=Number(value);return Number.isFinite(n)?(suffix==='番手'&&Number.isInteger(n)?String(n):n.toFixed(1))+suffix:'—';
}
function sectionCorner(row) {
  if(row['4C馬群予測版'])return sectionNumber(row['4C位置予測'],'番手')+'目安';
  const low=row['4C予測下限'],high=row['4C予測上限'];
  if(low!==null&&low!==undefined&&high!==null&&high!==undefined&&String(low).trim()!==''&&String(high).trim()!==''&&Number.isFinite(Number(low))&&Number.isFinite(Number(high)))
    return (Number(low)===Number(high)?String(Number(low)):String(Number(low))+'–'+String(Number(high)))+'番手';
  return sectionNumber(row['4C位置予測'],'番手');
}
function sectionPairHtml(predicted,actual) {
  return '<span class="section-pred">予想 '+escapeHtml(predicted)+'</span>'+
    '<small class="section-actual">実績 '+escapeHtml(actual||'—')+'</small>';
}
function sectionStyleHtml(row) {
  const predicted=row['脚質予測対象外']?'対象外':String(row['脚質(推定)']||'—')+(row['末脚評価']?'・'+String(row['末脚評価']):'');
  return sectionPairHtml(predicted,String(row['脚質(実績)']||'—'));
}
function sectionKickHtml(row) {
  return sectionPairHtml(row['脚質予測対象外']?'対象外':sectionNumber(row['予想上がり3F']),sectionNumber(row['実績上がり3F']));
}
function sectionCornerHtml(row) {
  return sectionPairHtml(row['脚質予測対象外']?'対象外':sectionCorner(row),sectionNumber(row['4C位置実績'],'番手'));
}

/* One field-aware position scenario; late speed is a separate signal. */
function packBoardRows(rows) {
  const number = v => v === null || v === undefined || String(v).trim() === '' ? null : Number.isFinite(Number(v)) ? Number(v) : null;
  const known = [], unknown = [];
  for (const row of rows || []) {
    const pos = number(row['4C位置予測']);
    const horse = {row, no:String(row['馬番'] || ''), pos, order:number(row['4C配置順'])};
    if (row['脚質予測対象外'] || pos === null || pos < 1) unknown.push(horse);
    else known.push(horse);
  }
  known.sort((a,b) => (a.order ?? a.pos) - (b.order ?? b.pos) || Number(a.no)-Number(b.no));
  const n = known.length;
  const head = Math.max(1, Math.floor(.15*n));
  const front = Math.max(head, Math.floor(.45*n));
  const middle = Math.max(front, Math.floor(.60*n));
  known.forEach((horse,i) => {
    const saved = String(horse.row['4C馬群区分'] || '');
    const group = saved || (i < head ? '先頭' : i < front ? '前方' : i < middle ? '中団' : '後方');
    const charge = horse.row['末脚評価'] === '追上候補';
    horse.band = group === '先頭' ? 0 : group === '前方' ? 1 : group === '中団' ? 2 : charge ? 3 : 4;
    horse.charge = charge;
  });

}

function packBoardHtml(rows, frontOnRight, frameColor) {
  const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const projection = packBoardRows(rows);
  const labels = ['逃げ候補','先行','中団','後方・追上','後方待機'];
  const bands = frontOnRight ? [4,3,2,1,0] : [0,1,2,3,4];
  const badge = horse => {
    const r = horse.row, frame = String(r.__枠番 || '');
    const color = frameColor(frame) || '#374151';
    const key = /[◉◎○▲]/.test(String(r['予想印']||'')) || !!r.__sugouma || !!r.__norikae;
    const name = String(r['馬名'] || '');
    const late = String(r['末脚評価'] || '末脚未判定');
    const title = `${horse.no} ${name}／4C目安 ${horse.pos?.toFixed(1) || '—'}番手／${late}`;
    return `<span class="pack-projection-horse${key?' is-key':''}${horse.charge?' has-kick':''}" title="${esc(title)}"><b style="background:${esc(color)};color:${frame==='1'?'#111':'#fff'}">${esc(horse.no)}</b><small>${esc(name.slice(0,4))}</small>${horse.charge?'<em>脚あり</em>':''}</span>`;
  };
  const columns = bands.map(band => {
    const horses = projection.known.filter(h=>h.band===band);
    return `<section class="pack-projection-group" data-pack-band="${band}"><h4>${labels[band]}<small>${horses.length}頭</small></h4><div>${horses.map(badge).join('') || '<span class="pack-projection-empty">—</span>'}</div></section>`;
  });
  const unknown = projection.unknown.length ? `<div class="pack-projection-unknown">位置未判定 ${projection.unknown.map(h=>esc(h.no)+' '+esc(String(h.row['馬名']||'').slice(0,4))).join('・')}</div>` : '';
  return `<div class="pack-projection-board" data-front-on-right="${frontOnRight}">${columns.join('')}</div>${unknown}<div class="pack-projection-note">配置は推定序列 · 後方の末脚は別評価</div>`;
}

  const label = kind === "win" ? "1着" : "3着内";
  return '<span class="probability-bar '+kind+'" aria-label="'+label+'率 '+text+'"><span class="probability-label">'+label+'</span><span class="probability-track" aria-hidden="true"><span class="probability-fill" style="width:'+width+'%"></span></span><span class="probability-number">'+text+'</span></span>';
}
function modelRankText(raw) {
  return raw !== null && raw !== undefined && Number.isInteger(Number(raw)) && Number(raw) >= 1 ? String(raw)+"位" : "—";
}
function oddsTimeText(raw) {
  const stamp = new Date(raw);
  if (!raw || Number.isNaN(stamp.getTime())) return "未取得";
  const parts = new Intl.DateTimeFormat("en-GB", {timeZone:"Asia/Tokyo",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(stamp);
  const value = type => parts.find(p => p.type === type).value;
  return value("month") + "/" + value("day") + "  " + value("hour") + ":" + value("minute") + ":" + value("second");
}

// ★ WIN5対象レースを日付から抽出（payloadの win5_target を参照）
function getWin5TargetsForDate(dateStr) {
  const out = [];
  const d = String(dateStr || "").trim();

  // ★ payload構造に合わせる：DATA.races[date]
  const day = (DATA && DATA.races && DATA.races[d]) ? DATA.races[d] : null;
  if (!day) return out;

  const raceKey = (x) => {
    const m = String(x || "").match(/\d+/);
    return m ? parseInt(m[0], 10) : 999;
  };

  for (const track of Object.keys(day)) {
    const races = day[track] || {};
    for (const rno of Object.keys(races)) {
      const obj = races[rno] || {};
      if (obj && obj.win5_target) {
        out.push({ track, rno, race_name: obj.race_name || "" });
      }
    }
  }

  // 走る順：競馬場名→R番号（"11R" なども数値化して安定化）
  out.sort((a,b) => {
    if (a.track !== b.track) return String(a.track).localeCompare(String(b.track), "ja");
    return raceKey(a.rno) - raceKey(b.rno);
  });
  return out;
}

// ★ date/track/race を指定して移動（selectのoption生成待ちを含む）
function gotoRaceBySelect(dateStr, trackStr, rnoStr) {
  const ds = el("dateSel");
  const ts = el("trackSel");
  const rs = el("raceSel");
  if (!ds || !ts || !rs) return;

  const d = String(dateStr || "").trim();
  const t = String(trackStr || "").trim();
  const r = String(rnoStr || "").trim();

  if (d) {
    ds.value = d;
    ds.dispatchEvent(new Event("change"));
  }

  let tries = 0;
  const timer = setInterval(() => {
    tries++;

    if (t && ts.options && ts.options.length > 0) {
      ts.value = t;
      ts.dispatchEvent(new Event("change"));
    }

    if (r && rs.options && rs.options.length > 0) {
      rs.value = r;
      rs.dispatchEvent(new Event("change"));
      clearInterval(timer);
    }

    if (tries > 40) {
      clearInterval(timer);
    }
  }, 120);
}

// ★ 同日付のWIN5先頭へジャンプ（R番号優先でソート）
function jumpToWin5FirstForDate(dateStr) {
  const d = String(dateStr || "").trim();
  const targets0 = getWin5TargetsForDate(d);

  if (!targets0 || targets0.length === 0) {
    alert("WIN5が開催されていません");
    return;
  }

  const raceKey = (x) => {
    const m = String(x || "").match(/\d+/);
    return m ? parseInt(m[0], 10) : 999;
  };

  const targets = targets0.slice().sort((a,b) => {
    const ra = raceKey(a.rno);
    const rb = raceKey(b.rno);
    if (ra !== rb) return ra - rb;
    return String(a.track).localeCompare(String(b.track), "ja");
  });

  const first = targets[0];

  // ★ option.value と一致させるため、rno は数値化せず「キー文字列のまま」渡す
  gotoRaceBySelect(d, first.track, String(first.rno));
}

// ★ 枠番 → 枠色（waku-1..8 と同じ）
//   ※ viewer 側の .waku-* 定義に合わせる
function wakuHex(w) {
  const n = parseInt(w || "", 10);
  if (!n || n < 1 || n > 8) return "";
  const mp = {
    1: "#ffffff",
    2: "#2b2b2b",
    3: "#c65a5a",
    4: "#4f7db8",

function hexToRgb(hex) {
  const s = String(hex || "").trim().replace("#", "");
  if (s.length !== 6) return null;
  const r = parseInt(s.slice(0, 2), 16);
  const g = parseInt(s.slice(2, 4), 16);
  const b = parseInt(s.slice(4, 6), 16);
  if ([r,g,b].some(v => Number.isNaN(v))) return null;
  return { r, g, b };
}

// ★ バナー（凄馬/乗替）に “枠色shine” を注入
function applyWakuGlowToBanner(box, wakuNo) {
  if (!box) return;

  const hex = wakuHex(wakuNo);
  const rgb = hex ? hexToRgb(hex) : null;

  if (!rgb) {
    // 前レースの色が残るのを防ぐ
    box.style.removeProperty("--shine-rgb");
    box.style.removeProperty("border-color");
    box.style.removeProperty("background");
    box.style.removeProperty("text-shadow");
    box.style.removeProperty("box-shadow");
    return;
  }

  const r = rgb.r, g = rgb.g, b = rgb.b;

  // Shine（::before）用
  box.style.setProperty("--shine-rgb", r + "," + g + "," + b);

  // バナー枠/背景/発光も同じ色へ寄せる
  box.style.borderColor = "rgba(" + r + "," + g + "," + b + ",0.78)";
  box.style.background = "rgba(" + r + "," + g + "," + b + ",0.18)";
  box.style.textShadow = "0 0 14px rgba(" + r + "," + g + "," + b + ",0.65)";
  box.style.boxShadow =
    "0 0 0 1px rgba(" + r + "," + g + "," + b + ",0.22) inset, " +
    "0 0 26px rgba(" + r + "," + g + "," + b + ",0.46), var(--shadow2)";
}

function markClass(mark) {
  const m = String(mark || "").trim();
  if (m.includes("◎") || m.includes("◉")) return "hmark-ss";
  if (m.includes("○")) return "hmark-s";
  if (m.includes("▲")) return "hmark-m";
  return "hmark-w";
}

function markRank(mark) {
  const m = String(mark || "").trim();
  const getNum = () => {
    const mm = m.match(/\d+/);
    return mm ? parseInt(mm[0], 10) : 0;
  };

  if (m.includes("◉")) return [1, 0];
  if (m.includes("◎")) return [1, 1];
  if (m.includes("○")) return [2, 0];
  if (m.includes("▲")) return [3, 0];
  if (m.includes("△")) return [4, getNum()];
  if (m.includes("☆")) return [5, getNum()];
  if (m.includes("注")) return [6, getNum()];
  return [99, 0];
}

// ★ ABC予測（A,B,C...）を順位化：A=1, B=2 ... / 無効は 999
function abcRank(v) {
  const s = String(v || "").trim().toUpperCase();
  if (!s) return 999;
  const m = s.match(/[A-Z]/);
  if (!m) return 999;
  return (m[0].charCodeAt(0) - "A".charCodeAt(0)) + 1;
}


function numOrBig(x) {
  const n = (x === null || x === undefined || x === "") ? null : Number(x);
  if (n === null || Number.isNaN(n)) return 999999;
  return n;
}

function numOrNegBig(x) {
  const n = (x === null || x === undefined || x === "") ? null : Number(x);
  if (n === null || Number.isNaN(n)) return -999999;
  return n;
}

function sortRows(rows, mode) {
  const arr = (rows || []).slice();

  if (mode === "score") {
    arr.sort((a,b) => {
      const sa = numOrNegBig(a.__score_n);
      const sb = numOrNegBig(b.__score_n);
      if (sa !== sb) return sb - sa;

      const [ra, xa] = markRank(a["予想印"]);
      const [rb, xb] = markRank(b["予想印"]);
      if (ra !== rb) return ra - rb;
      if (xa !== xb) return xa - xb;

      const na = numOrBig(a.__ninki_n);
      const nb = numOrBig(b.__ninki_n);
      if (na !== nb) return na - nb;

      return numOrBig(a.__umaban_n) - numOrBig(b.__umaban_n);
    });
    return arr;
  }

  if (mode === "mark") {
    arr.sort((a,b) => {
      // ★ 最優先：ABC予測のアルファベット順（A,B,C...）
      const aa = abcRank(a["ABC予測"]);
      const ab = abcRank(b["ABC予測"]);
      if (aa !== ab) return aa - ab;

      // ★ 次点：印（互換・ABC予測が無いデータでも安定させる）
      const [ra, sa] = markRank(a["予想印"]);
      const [rb, sb] = markRank(b["予想印"]);
      if (ra !== rb) return ra - rb;
      if (sa !== sb) return sa - sb;

      // ★ 以降は従来どおり
      const sca = numOrNegBig(a.__score_n);
      const scb = numOrNegBig(b.__score_n);
      if (sca !== scb) return scb - sca;

      const na = numOrBig(a.__ninki_n);
      const nb = numOrBig(b.__ninki_n);
      if (na !== nb) return na - nb;

      return numOrBig(a.__umaban_n) - numOrBig(b.__umaban_n);
    });
    return arr;
  }

  if (mode === "shisu") {
    arr.sort((a,b) => {
      const [ra, sa] = markRank(a["指数印"]);
      const [rb, sb] = markRank(b["指数印"]);
      if (ra !== rb) return ra - rb;
      if (sa !== sb) return sa - sb;
      const na = numOrBig(a.__ninki_n);
      const nb = numOrBig(b.__ninki_n);
      if (na !== nb) return na - nb;
      return numOrBig(a.__umaban_n) - numOrBig(b.__umaban_n);
    });
    return arr;
  }

  if (mode === "ml") {
    arr.sort((a,b) => {
      const [ra, sa] = markRank(a["ML印"]);
      const [rb, sb] = markRank(b["ML印"]);
      if (ra !== rb) return ra - rb;
      if (sa !== sb) return sa - sb;
      const na = numOrBig(a.__ninki_n);
      const nb = numOrBig(b.__ninki_n);
      if (na !== nb) return na - nb;
      return numOrBig(a.__umaban_n) - numOrBig(b.__umaban_n);
    });
    return arr;
  }

  if (mode === "ninki") {
    arr.sort((a,b) => {
      const da = numOrBig(a.__ninki_n);
      const db = numOrBig(b.__ninki_n);
      if (da !== db) return da - db;
      const [ra, sa] = markRank(a["予想印"]);
      const [rb, sb] = markRank(b["予想印"]);
      if (ra !== rb) return ra - rb;
      if (sa !== sb) return sa - sb;
      return numOrBig(a.__umaban_n) - numOrBig(b.__umaban_n);
    });
    return arr;
  }

  if (mode === "umaban") {
    arr.sort((a,b) => numOrBig(a.__umaban_n) - numOrBig(b.__umaban_n));
    return arr;
  }

  if (mode === "result") {
    arr.sort((a,b) => {
      const da = numOrBig(a.__result_n);
      const db = numOrBig(b.__result_n);
      if (da !== db) return da - db;
      const na = numOrBig(a.__ninki_n);
      const nb = numOrBig(b.__ninki_n);
      if (na !== nb) return na - nb;
      return numOrBig(a.__umaban_n) - numOrBig(b.__umaban_n);
    });
    return arr;
  }

  if (mode === "uindex") {
    arr.sort((a,b) => {
      const da = numOrNegBig(a.__uindex_n);
      const db = numOrNegBig(b.__uindex_n);
      if (da !== db) return db - da;
      const na = numOrBig(a.__ninki_n);
      const nb = numOrBig(b.__ninki_n);
      if (na !== nb) return na - nb;
      return numOrBig(a.__umaban_n) - numOrBig(b.__umaban_n);
    });
    return arr;
  }

  return arr;
}

    box.appendChild(line);
    if (wind.relative_degrees !== null && wind.relative_degrees !== undefined && Number.isFinite(Number(wind.relative_degrees))) {
      const angle = (Number(wind.relative_degrees) + (isRight && !isStraight ? 180 : 0)) * Math.PI / 180;
      const dx = Math.cos(angle) * 31;
      const dy = Math.sin(angle) * 31;
      const from = isRight && !isStraight ? 252 : 40;
      const to = isRight && !isStraight ? 40 : 252;
      const courseLabel = track + " · " + (isStraight ? "直線コース" : (isRight ? "右回り ↷" : "左回り ↶"));
      const diagram = document.createElement("div");
      diagram.className = "meta-wind-diagram";
      diagram.innerHTML = '<svg viewBox="0 0 292 98" role="img" aria-label="' + escapeHtml(courseLabel + '。青は直線の進行、緑は風。' + (wind.home_stretch || '')) + '">' +
        '<defs><marker id="straightArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="wind-straight-head" d="M0,0 L7,3.5 L0,7 Z"/></marker>' +
        '<marker id="windArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="wind-flow-head" d="M0,0 L7,3.5 L0,7 Z"/></marker></defs>' +
        '<text x="10" y="15" class="wind-course-label">' + escapeHtml(courseLabel) + '</text>' +
        '<line x1="' + from + '" y1="55" x2="' + to + '" y2="55" class="wind-straight-vector" marker-end="url(#straightArrow)"/>' +
        '<line x1="' + (146-dx).toFixed(1) + '" y1="' + (55-dy).toFixed(1) + '" x2="' + (146+dx).toFixed(1) + '" y2="' + (55+dy).toFixed(1) + '" class="wind-flow-vector" marker-end="url(#windArrow)"/>' +
        '<text x="10" y="94" class="wind-legend">青：直線の進行　緑：風</text></svg>';
      box.appendChild(diagram);
    } else if (wind.arrow) {
      const compass = document.createElement("div");
      compass.className = "meta-wind-segments";
      compass.textContent = wind.arrow + "（北が上）";
      box.appendChild(compass);
    }
    const segments = document.createElement("div");
    segments.className = "meta-wind-segments";
    segments.textContent = [wind.fourth_corner && "4角：" + wind.fourth_corner,
      wind.home_stretch && "直線：" + wind.home_stretch].filter(Boolean).join(" · ");
    if (segments.textContent) box.appendChild(segments);
    meta.appendChild(box);
  }
}

function openRecommendModal() {
  ensureRecModal();

  const m = el("recModal");
  const titleEl = el("recModalTitle");
  const bodyEl = el("recModalBody");
  if (!m || !titleEl || !bodyEl) return;

  const obj = currentRaceObj;
  const pats = (obj && obj.recommend_patterns) ? (obj.recommend_patterns || []) : [];

  const raceName = (obj && obj.race_name) ? String(obj.race_name) : "";
  titleEl.textContent = "推奨買い目" + (raceName ? ("  " + raceName) : "");

  bodyEl.innerHTML = "";

  if (obj && obj.native_bets && obj.native_bets.length) {
    bodyEl.innerHTML = TicketDisplay.render(obj.native_bets,{formations:!!obj.native_bet_formations});
    m.style.display = "block";
    return;
  }

  if (!pats || pats.length === 0) {
    const msg = document.createElement("div");
    msg.style.cssText =
      "border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.06);" +
      "border-radius:14px; padding:12px; color:rgba(233,237,245,0.92); font-weight:800; line-height:1.5;";
    msg.textContent = "このレースの推奨買い目が見つかりませんでした（3連単12点/優先プランCSVに該当 _race_id が無い可能性があります）";
    bodyEl.appendChild(msg);
    m.style.display = "block";
    return;
  }

  // --- A,B,C... を「スコア順の馬番」に変換する ---
  const buildLetterMapFromScoreOrder = (raceObj) => {
    const mp = {};
    if (!raceObj || !raceObj.rows) return mp;

    // 常に「スコア順」を基準にする（画面のソート設定には依存しない）
    const sorted = sortRows((raceObj.rows || []).slice(), "score");
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    for (let i = 0; i < sorted.length && i < letters.length; i++) {
      const key = letters[i];
      const umaban = String(sorted[i]["馬番"] || "").trim();
      if (umaban) mp[key] = umaban;
    }
    return mp;
  };

  const fmtPercentInt = (x) => {
    const s = String(x || "").replace("%", "").trim();
    if (!s) return "";
    const v = Number(s);
    if (Number.isNaN(v)) return String(x || "");
    return String(Math.round(v)); // 小数点以下なし
  };

  const lettersToUmaban = (s, mp) => {
    const raw = String(s || "").trim();
    if (!raw) return "";

    // 例: "CDEFGHIJ" / "AB" / "A" を想定（区切りがあっても対応）
    const tokens = raw.replace(/\s+/g, "").split(/[,、/]+/).filter(Boolean);
    const outParts = [];

    for (const tk of tokens) {
      const nums = [];
      for (const ch of tk.split("")) {
        if (mp && mp[ch]) {
          nums.push(mp[ch]);
        }
      }
      if (nums.length > 0) {
        outParts.push(nums.join(","));
      } else {
        // 想定外の形式はそのまま出す
        outParts.push(tk);
      }
    }

    return outParts.join(" / ");
  };

  const letterMap = buildLetterMapFromScoreOrder(obj);

  for (const p of pats) {
    const card = document.createElement("div");
    card.style.cssText =
      "border:1px solid rgba(255,255,255,0.12); background:rgba(16,19,27,0.88);" +
      "border-radius:16px; padding:14px; box-shadow:0 10px 24px rgba(0,0,0,0.28);" +
      "margin-bottom:12px;";

    const h = document.createElement("div");
    h.style.cssText = "display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; margin-bottom:10px;";

    const name = document.createElement("div");
    name.style.cssText = "font-weight:1000; font-size:16px; line-height:1.2;";
    const kind = String(p["種別"] || "");
    const recText = String(p["推奨"] || "");
    const pname = String(p["パターン名称"] || "（名称なし）");
    name.textContent = (kind ? (kind + " ") : "") + (recText ? (recText + " / ") : "") + pname;

    const meta = document.createElement("div");
    meta.style.cssText = "font-size:14px; color:rgba(170,179,197,0.95); font-weight:900; line-height:1.35;";
    const baken = String(p["馬券"] || "");
    const roi = fmtPercentInt(p["期待回収率(%)"]);
    const hit = fmtPercentInt(p["的中率(%)"]);
    const pts = String(p["点数"] || "");
    const unit = String(p["単価"] || "");
    const cost = String(p["投資"] || p["費用"] || "");
    const aRank = String(p["Aランク"] || "");
    const fragile = String(p["A飛び1人気"] || "");
    const value5 = String(p["Top5妙味"] || "");
    meta.textContent =
      (baken ? ("[" + baken + "] ") : "") +
      (roi ? ("期待回収率 " + roi + "%  ") : "") +
      (hit ? ("的中率 " + hit + "%  ") : "") +
      (pts ? ("点数 " + pts + "  ") : "") +
      (unit ? ("単価 " + unit + "  ") : "") +
      (cost ? ("投資 " + cost + "  ") : "") +
      (aRank ? ("上位構造 " + aRank + "  ") : "") +
      (fragile ? ("飛び1人気 " + fragile + "  ") : "") +
      (value5 ? ("Top5妙味 " + value5) : "");

    h.appendChild(name);
    h.appendChild(meta);

    const picks = document.createElement("div");
    picks.style.cssText =
      "display:grid; grid-template-columns:84px 1fr; gap:8px 12px; font-size:16px; font-weight:900;";

    const addRow = (k, v) => {
      const kk = document.createElement("div");
      kk.style.cssText = "color:rgba(170,179,197,0.95); font-weight:900; font-size:14px;";
      kk.textContent = k;

      const vv = document.createElement("div");
      vv.style.cssText = "white-space:pre-wrap; line-height:1.45; font-size:17px;";
      vv.textContent = v || "—";

      picks.appendChild(kk);
      picks.appendChild(vv);
    };

    const tickets = String(p["買い目"] || "").trim();
    const form = String(p["フォーメーション"] || "").trim();
    if (form) addRow("形", form);
    if (tickets) {
      addRow("買い目", tickets.replace(/\s*\/\s*/g, " / "));
    } else {
      // AB表記 → スコア順の馬番へ変換して表示
      addRow("1着", lettersToUmaban(p["1着"], letterMap));
      addRow("2着", lettersToUmaban(p["2着"], letterMap));
      addRow("3着", lettersToUmaban(p["3着"], letterMap));
    }

    // 条件表示は不要なので出さない

    card.appendChild(h);
    card.appendChild(picks);
    bodyEl.appendChild(card);
  }

  m.style.display = "block";
}

    if (rowCls) {
      tr.classList.add("sg-row");
      tr.classList.add(rowCls);
    }

    const rn = Number(r.__result_n);
    if (!Number.isNaN(rn) && rn >= 1 && rn <= 3) {
      tr.classList.add("in3");
      if (rn === 1) tr.classList.add("pos1");
      if (rn === 2) tr.classList.add("pos2");
      if (rn === 3) tr.classList.add("pos3");
    }

    for (const c of DISPLAY_COLS) {
      const td = document.createElement("td");
      const v = (r[c] === null || r[c] === undefined) ? "" : r[c];

      if (c === "勝率予測" || c === "複勝率予測") {
        td.classList.add("probability-cell");
        td.innerHTML = probabilityBarHtml(r[c === "勝率予測" ? "__p_win" : "__p_top3"], c === "勝率予測" ? "win" : "top3");
      }
      if (c === "オッズ") td.textContent = v ? String(v) + "倍" : "未取得";
      if (c === "脚質(推定)") td.innerHTML=sectionStyleHtml(r);
      if (c === "4C予想/実績") td.innerHTML=sectionCornerHtml(r);
      if (c === "上がり3F予想/実績") td.innerHTML=sectionKickHtml(r);

      if (c === "予測/着順" || c === "騎手/調教師") {
        td.classList.add("vstack");
      }

      if (c === "馬名") {
        td.classList.add("horse");
        td.classList.add("sticky-left-2");
        td.style.left = "72px";
        td.style.minWidth = "160px";
        td.style.width = "160px";
        td.style.color = "inherit";

        // ★ 乗替推奨は出馬表の印/馬名には表示しない
        const nm = escapeHtml(v);
        td.innerHTML = nm;
      }

      if (c === "馬番") {
        td.classList.add("umaban");
        td.classList.add("sticky-left-1");
        td.style.minWidth = "72px";
        td.style.width = "72px";
        const wc = wakuClass(r["__枠番"]);
        if (wc) td.classList.add(wc);
      }

      if (["予想印","人気","スコア","U指数","脚質(推定)","指数印","ML印"].includes(c)) {
        td.classList.add("bigcell");
      }
      if (c === "脚質(推定)" && r.__native_style_reason) td.title = r.__native_style_reason;

      if (c === "予想印") {
        td.classList.add(markClass(v));
        td.title = [r["◉判定根拠"], r["飛判定根拠"]].filter(Boolean).join(" / ");
        if (String(v).includes("◉") && r["◉判定根拠"]) {
          const details = document.createElement("details");
          const summary = document.createElement("summary");
          summary.textContent = "◉の定義";
          const reason = document.createElement("div");
          reason.textContent = r["◉判定根拠"];
          reason.style.cssText = "font-size:12px;white-space:normal;max-width:260px;font-weight:normal";
          details.append(summary, reason);td.appendChild(details);
        }
        const consensus = String(r.__mark_consensus || "").trim();
        const baseMark = String(v || "").replace(/[爆飛]/g, "").trim();
        if (consensus && baseMark === consensus) {
          td.classList.add("mark-consensus");
          td.title = "補正印とML印が一致";

      tr.appendChild(td);

    tbody.appendChild(tr);

//   ※必要なら後で「距離/コース別」に拡張できます
function turnInfoForTrack(track) {
  const t = normalizePlaceName(track || "");
  const mp = {
    "札幌":"右","函館":"右","福島":"右","新潟":"左","東京":"左",
    "中山":"右","中京":"左","京都":"右","阪神":"右","小倉":"右",
  };
  const dir = mp[t] || "";
  if (!dir) return { dir:"", mark:"", text:"" };
  const mark = (dir === "左") ? "↺" : "↻";
  const text = (dir === "左") ? "左回り" : "右回り";
  return { dir, mark, text };
}

function _num(x) {

function renderPack4C() {
  ensurePack4CGlowStyles();

  const wrap = el("pack4cWrap");
  const grid = el("pack4cGrid");
  const dirEl = el("pack4cDir");
  if (!wrap || !grid || !dirEl) return;

  // ★ 表示/非表示を尊重（閉じていたら何もしない）
  const btn = el("pack4cBtn");
  if (!pack4cVisible) {
    if (wrap) wrap.style.display = "none";
    if (btn) {
      btn.style.display = "inline-flex";
      btn.textContent = "表示";
    }
    return;
  }
  if (wrap) wrap.style.display = "block";
  if (btn) {
    btn.style.display = "inline-flex";
    btn.textContent = "閉じる";
  }

  const obj = currentRaceObj;
  if (!obj || !obj.rows) {
    grid.innerHTML = "";
    dirEl.textContent = "—";
    return;
  }

  const track = el("trackSel") ? el("trackSel").value : "";
  const ti = turnInfoForTrack(track);
  dirEl.textContent =
    (ti && ti.dir === "左") ? "進行方向→" :
    (ti && ti.dir === "右") ? "←進行方向" :
    "進行方向—";

  // ★ 重要：CSSが必ず当たるようにクラスを付与（位置は変更しない）
  dirEl.classList.add("pack4c-legend-chip");

  // ★ 馬場で色分け（芝=緑 / ダート=茶 / 障害=水色）
  dirEl.classList.remove("pack4c-surf-turf", "pack4c-surf-dirt", "pack4c-surf-jump");
  const surfRaw =
    (obj && obj.race_info && (obj.race_info["馬場"] || obj.race_info["コース"] || obj.race_info["種別"])) ? (obj.race_info["馬場"] || obj.race_info["コース"] || obj.race_info["種別"]) : "";
  const surf = String(surfRaw || "").trim();

  if (surf.includes("障")) {
    dirEl.classList.add("pack4c-surf-jump");
  } else if (surf.includes("ダ")) {
    dirEl.classList.add("pack4c-surf-dirt");
  } else {
    dirEl.classList.add("pack4c-surf-turf");
  }

  // ★ 凡例（進行方向）は「散布図の一番下の行」へ出す（raceMeta には入れない）

  renderPack4CScatter(obj);
}

let raceOrderMode = "time"; // "time" | "race"

// ★ "HH:MM" を分に変換（無効なら大きい値）
function _timeToMin(s) {
  const t = String(s || "").trim();
  const m = t.match(/(\d(1, 2))\s*[:：]\s*(\d2)/);
  if (!m) return 99999;
  const hh = parseInt(m[1], 10);
  const mm = parseInt(m[2], 10);
  if (Number.isNaN(hh) || Number.isNaN(mm)) return 99999;
  return (hh * 60) + mm;
}

function _numKey(x) {
  const m = String(x || "").match(/\d+/);
  return m ? parseInt(m[0], 10) : 999;
}

function raceNoLabel(r) {
  const m = String(r || "").match(/\d+/);
  if (!m) return String(r || "");
  return String(parseInt(m[0], 10)) + "レース";
}

function parseHash() {
  const h = (location.hash || "").replace(/^#/, "");
  const obj = {};
  if (!h) return obj;
  for (const part of h.split("&")) {
    const [k,v] = part.split("=");
    if (!k) continue;
    obj[decodeURIComponent(k)] = decodeURIComponent(v || "");
  }
  return obj;
}

function setHash(date, track, race) {
  const p = [];
  if (date) p.push("date=" + encodeURIComponent(date));
  if (track) p.push("track=" + encodeURIComponent(track));
  if (race) p.push("race=" + encodeURIComponent(race));
  location.hash = "#" + p.join("&");
}

function setPrevNextButtons() {
  const prevBtn = el("prevRaceBtn");
  const nextBtn = el("nextRaceBtn");
  if (!prevBtn || !nextBtn) return;

  const raceSel = el("raceSel");
  const opts = Array.from(raceSel.options || []);
  const idx = opts.findIndex(o => o.value === raceSel.value);

  prevBtn.disabled = (idx <= 0);
  nextBtn.disabled = (idx < 0 || idx >= opts.length - 1);
}

function moveRace(delta) {
  const raceSel = el("raceSel");
  const opts = Array.from(raceSel.options || []);
  const idx = opts.findIndex(o => o.value === raceSel.value);
  const nextIdx = idx + delta;

  if (idx < 0) return;
  if (nextIdx < 0 || nextIdx >= opts.length) return;

  const d2 = el("dateSel").value;
  const t2 = el("trackSel").value;
  const r2 = opts[nextIdx].value;

  raceSel.value = r2;
  setHash(d2, t2, r2);
  render(d2, t2, r2);

  try {
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (e) {
    window.scrollTo(0, 0);
  }
}

let curDate = "";
let lastRenderedKey = "";
let lastRaceKeyForSort = "";

function loadDates() {
  const dateSel = el("dateSel");
  dateSel.innerHTML = "";
  const dates = (DATA.dates || []);
  for (const d of dates) {
    const op = document.createElement("option");
    op.value = d;
    op.textContent = d.slice(4,6) + "/" + d.slice(6,8);
    dateSel.appendChild(op);
  }

  const now = new Date();
  const ymd = (dt) => String(dt.getFullYear()) + String(dt.getMonth() + 1).padStart(2, "0") + String(dt.getDate()).padStart(2, "0");
  const today = ymd(now);
  const tomorrowDt = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const tomorrow = ymd(tomorrowDt);
  const def = (now.getHours() >= 17 && dates.includes(tomorrow))
    ? tomorrow
    : (dates.includes(today) ? today : (DATA.default_date || ""));
  if (def && dates.includes(def)) {
    dateSel.value = def;
    return def;
  }

  if (dates.length > 0) {
    dateSel.value = dates[0];
    return dates[0];
  }

  return "";
}

function loadTracks(date) {
  const trackSel = el("trackSel");
  trackSel.innerHTML = "";
  const obj = (DATA.races[date] || {});
  const tracks = Object.keys(obj).sort();
  for (const t of tracks) {
    const op = document.createElement("option");
    op.value = t;
    op.textContent = t;
    trackSel.appendChild(op);
  }
  if (tracks.length > 0) trackSel.value = tracks[0];
  return tracks.length > 0 ? tracks[0] : "";
}

function loadRaces(date, track, preferRaceNo) {
  const raceSel = el("raceSel");
  raceSel.innerHTML = "";
  const obj = (((DATA.races[date] || {})[track]) || {});

  const races = Object.keys(obj).sort((a,b) => {
    const ia = (obj[a] && obj[a].race_info) ? obj[a].race_info : {};
    const ib = (obj[b] && obj[b].race_info) ? obj[b].race_info : {};

    // ★ キー名ゆれに強く（発走時刻 / 発走 / 発走時間）
    const ta = ia["発走時刻"] || ia["発走"] || ia["発走時間"] || "";
    const tb = ib["発走時刻"] || ib["発走"] || ib["発走時間"] || "";

    const ma = _timeToMin(ta);
    const mb = _timeToMin(tb);

    if (ma !== mb) return ma - mb;
    // 同時刻/不明はレース番号で安定化
    return _numKey(a) - _numKey(b);
  });

  for (const r of races) {
    const op = document.createElement("option");
    op.value = r;
    op.textContent = raceNoLabel(r);
    raceSel.appendChild(op);
  }

  if (races.length === 0) return "";

  if (preferRaceNo && races.includes(preferRaceNo)) {
    raceSel.value = preferRaceNo;
    return preferRaceNo;
  }

  raceSel.value = races[0];
  return races[0];
}

function normalizePlaceName(placeName) {
  let s = String(placeName || "").trim();
  if (!s) return "";
  s = s.replace(/　/g, " ").replace(/\s+/g, "");
  s = s.replace(/競馬場/g, "");
  s = s.replace(/[（(]外[）)]/g, "");
  s = s.replace(/外$/g, "");
  const keys = ["札幌","函館","福島","新潟","東京","中山","中京","京都","阪神","小倉"];
  for (const k of keys) {
    if (s.includes(k)) return k;
  }
  return s;
}

function placeNameToCode(placeName) {
  const mp = {
    "札幌": "01","函館": "02","福島": "03","新潟": "04","東京": "05",
    "中山": "06","中京": "07","京都": "08","阪神": "09","小倉": "10",
  };
  const n = normalizePlaceName(placeName);
  return mp[n] || "";
}

function buildPredictionUrl(date, info, track, race) {
  const rid = (info && info.race_id) ? String(info.race_id) : "";
  const parts = [];

  if (date) parts.push("date=" + encodeURIComponent(date));
  if (rid) parts.push("race_id=" + encodeURIComponent(rid));

  const tRaw = String(track || "").trim();
  const t = normalizePlaceName(tRaw);
  const placeCode = placeNameToCode(t);

  const rno = (() => {
    const m = String(race || "").match(/\d+/);
    return m ? String(parseInt(m[0], 10)) : "";
  })();

  if (t) {
    parts.push("track=" + encodeURIComponent(t));
    parts.push("track_name=" + encodeURIComponent(t));
    parts.push("place_name=" + encodeURIComponent(t));
    parts.push("place=" + encodeURIComponent(t));
  }
  if (placeCode) {
    parts.push("place_code=" + encodeURIComponent(placeCode));
    parts.push("track_code=" + encodeURIComponent(placeCode));
    parts.push("place_cd=" + encodeURIComponent(placeCode));
  }
  if (rno) {
    parts.push("race=" + encodeURIComponent(rno));
    parts.push("r=" + encodeURIComponent(rno));
    parts.push("race_no=" + encodeURIComponent(rno));
  }

  const qs = parts.join("&");
  return "yosouka_prediction_results.html?" + qs + "#" + qs;
}

function render(date, track, raceNo) {
  const obj = ((((DATA.races[date] || {})[track] || {})[raceNo]) || null);
