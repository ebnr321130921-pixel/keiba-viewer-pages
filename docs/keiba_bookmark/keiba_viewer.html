    for (const c of DISPLAY_COLS) {
      const td = document.createElement("td");
      const v = (r[c] === null || r[c] === undefined) ? "" : r[c];
      td.textContent = v;
      if (c === "スコア") td.textContent = probabilityText(r);

      if (c === "予測/着順" || c === "騎手/調教師") {
        td.classList.add("vstack");
      }

      if (c === "馬名") {
        td.classList.add("horse");
        td.classList.add("sticky-left-2");
        td.style.left = "72px";
        td.style.minWidth = "160px";
        td.style.width = "160px";
        td.style.color = "inherit";

        // ★ 乗替推奨は出馬表の印/馬名には表示しない
        const nm = escapeHtml(v);
        td.innerHTML = nm;
      }

      if (c === "馬番") {
        td.classList.add("umaban");
        td.classList.add("sticky-left-1");
        td.style.minWidth = "72px";
        td.style.width = "72px";
        const wc = wakuClass(r["__枠番"]);
        if (wc) td.classList.add(wc);
      }

      if (["予想印","人気","スコア","U指数","脚質(推定)","指数印","ML印"].includes(c)) {
        td.classList.add("bigcell");
      }
      if (c === "脚質(推定)" && r.__native_style_reason) td.title = r.__native_style_reason;

      if (c === "予想印") {
        td.classList.add(markClass(v));
        td.title = [r["◉判定根拠"], r["爆判定根拠"], r["飛判定根拠"]].filter(Boolean).join(" / ");
        if (String(v).includes("◉") && r["◉判定根拠"]) {
          const details = document.createElement("details");
          const summary = document.createElement("summary");
          summary.textContent = "◉の定義";
          const reason = document.createElement("div");
          reason.textContent = r["◉判定根拠"];
          reason.style.cssText = "font-size:12px;white-space:normal;max-width:260px;font-weight:normal";
          details.append(summary, reason);td.appendChild(details);
        }
        const consensus = String(r.__mark_consensus || "").trim();
        const baseMark = String(v || "").replace(/[爆飛]/g, "").trim();
        if (consensus && baseMark === consensus) {
          td.classList.add("mark-consensus");
          td.title = "補正印とML印が一致";
        }
      }

      tr.appendChild(td);
    }

    tbody.appendChild(tr);
  }
}

// ★ 左回り/右回り（JRA主要10場の目安）

function turnInfoForTrack(track) {
  const t = normalizePlaceName(track || "");
  const mp = {
    "札幌":"右","函館":"右","福島":"右","新潟":"左","東京":"左",
    "中山":"右","中京":"左","京都":"右","阪神":"右","小倉":"右",
  };
  const dir = mp[t] || "";
  if (!dir) return { dir:"", mark:"", text:"" };
  const mark = (dir === "左") ? "↺" : "↻";
  const text = (dir === "左") ? "左回り" : "右回り";
  return { dir, mark, text };
}

function renderPack4C() {
  ensurePack4CGlowStyles();

  const wrap = el("pack4cWrap");
  const grid = el("pack4cGrid");
  const dirEl = el("pack4cDir");
  if (!wrap || !grid || !dirEl) return;

  // ★ 表示/非表示を尊重（閉じていたら何もしない）
  const btn = el("pack4cBtn");
  if (!pack4cVisible) {
    if (wrap) wrap.style.display = "none";
    if (btn) {
      btn.style.display = "inline-flex";
      btn.textContent = "表示";
    }
    return;
  }
  if (wrap) wrap.style.display = "block";
  if (btn) {
    btn.style.display = "inline-flex";
    btn.textContent = "閉じる";
  }

  const obj = currentRaceObj;
  if (!obj || !obj.rows) {
    grid.innerHTML = "";
    dirEl.textContent = "—";
    return;
  }

  const track = el("trackSel") ? el("trackSel").value : "";
  const ti = turnInfoForTrack(track);
  dirEl.textContent =
    (ti && ti.dir === "左") ? "進行方向→" :
    (ti && ti.dir === "右") ? "←進行方向" :
    "進行方向—";

  // ★ 重要：CSSが必ず当たるようにクラスを付与（位置は変更しない）
  dirEl.classList.add("pack4c-legend-chip");

  // ★ 馬場で色分け（芝=緑 / ダート=茶 / 障害=水色）
  dirEl.classList.remove("pack4c-surf-turf", "pack4c-surf-dirt", "pack4c-surf-jump");
  const surfRaw =
    (obj && obj.race_info && (obj.race_info["馬場"] || obj.race_info["コース"] || obj.race_info["種別"])) ? (obj.race_info["馬場"] || obj.race_info["コース"] || obj.race_info["種別"]) : "";
  const surf = String(surfRaw || "").trim();

  if (surf.includes("障")) {
    dirEl.classList.add("pack4c-surf-jump");
  } else if (surf.includes("ダ")) {
    dirEl.classList.add("pack4c-surf-dirt");
  } else {
    dirEl.classList.add("pack4c-surf-turf");
  }

  // ★ 凡例（進行方向）は「散布図の一番下の行」へ出す（raceMeta には入れない）

  // ★ 分割馬群は使わず、グラフ（散布図）表示へ
  //   ※ 画面ソートではなく「位置予測キー」で安定ソートして、位置関係がブレないようにする
  const stablePackRows = (rows) => {
    const a = (Array.isArray(rows) ? rows : []).slice();

    const getPos = (r) => {
      return _num(
        (r && (r["c4_pos_pred"] ?? r["4C位置予測"] ?? r["4C位置(予測)"] ?? r["c4_pos"] ?? r["4C位置"])) ?? null
      );
    };

    const getLane = (r) => {
      return _num(
        (r && (r["c4_lane_pred"] ?? r["4C内外予測"] ?? r["c4_lane"])) ?? null
      );
    };

    const getUma = (r) => {
      const v = (r && (r["馬番"] ?? r["horse_no"])) ?? "";
      const n = Number(String(v || "").trim());
      return Number.isNaN(n) ? 9999 : n;
    };

    const getScore = (r) => {
      const v = (r && (r["スコア"] ?? r["score"])) ?? "";
      const n = Number(String(v || "").replace(/,/g, "").trim());
      return Number.isNaN(n) ? -999999 : n;
    };

    a.sort((x, y) => {
      const px = getPos(x), py = getPos(y);
      if (px !== null || py !== null) {
        const ax = (px === null) ? 9999 : px;
        const ay = (py === null) ? 9999 : py;
        if (ax !== ay) return ax - ay;
      }

      const lx = getLane(x), ly = getLane(y);
      if (lx !== null || ly !== null) {
        const bx = (lx === null) ? 9999 : lx;
        const by = (ly === null) ? 9999 : ly;
        if (bx !== by) return bx - by;
      }

      const ux = getUma(x), uy = getUma(y);
      if (ux !== uy) return ux - uy;

      // 最後はスコア（高い順）で安定化
      return getScore(y) - getScore(x);
    });

    return a;
  };

  const rowsForPack = stablePackRows(obj.rows || []);

  const _bakRows = obj.rows;
  obj.rows = rowsForPack;
  renderPack4CScatter(obj);
  obj.rows = _bakRows;
  return;

  // ★（以下：旧 分割馬群ロジックは温存。必要なら後で削除）
  // ★ 縦：内→外（3段階）
  const LANES = 3;
  const LANE_LABELS = ["内", "中", "外"];

  // ★ 横：脚質（4列固定：逃げ/先行/差し/追込）
  const packKey = (style) => {
    const s = String(style || "").trim();
    if (s.includes("逃")) return "nige";
    if (s.includes("先")) return "senko";
    if (s.includes("差")) return "sashi";
    if (s.includes("追")) return "oikomi";
    return "senko";
  };

  // ★ 色ルール：
  //   凄馬/乗替推奨=赤（最優先）
  //   ◎(◉含む)=金 / ○=銀 / ▲=銅 / △(△*)=青
  const ballTheme = (row) => {
    const r = row || {};

    // 最優先：凄馬 or 乗替推奨
    const isSugo = !!String(r.__sugouma || "").trim();
    const isNori = !!r.__norikae;
    if (isSugo || isNori) {
      return { key: "red", rgb: "255,95,95" };
    }

    const m = String(r["予想印"] || "").trim();
    if (m.includes("◉") || m.includes("◎")) return { key: "gold",   rgb: "255,211,77" };
    if (m.includes("○"))                 return { key: "silver", rgb: "210,220,235" };
    if (m.includes("▲"))                 return { key: "bronze", rgb: "205,140,70" };
    if (m.includes("△"))                 return { key: "blue",   rgb: "120,170,255" };

    return { key: "", rgb: "" };
  };

  // ★ 回り方向で「逃げの位置」を反転
  //   右回り：左が逃げ（先頭→中段(前)→中段(後)→後方）
  //   左回り：右が逃げ（後方→中段(後)→中段(前)→先頭）
  const PACKS = (ti && ti.dir === "左")
    ? [
        { k:"oikomi", label:"後方" },
        { k:"sashi",  label:"中段(後)" },
        { k:"senko",  label:"中段(前)" },
        { k:"nige",   label:"先頭" },
      ]
    : [
        { k:"nige",   label:"先頭" },
        { k:"senko",  label:"中段(前)" },
        { k:"sashi",  label:"中段(後)" },
        { k:"oikomi", label:"後方" },
      ];

  const rows = (obj.rows || []).slice();

  // ★ 枠番で「内側/中段/外側」を割当
  //   内側：1〜3枠 / 中段：4〜6枠 / 外側：7〜8枠
  const laneFromWaku = (wakuNo) => {
    const w = Number(String(wakuNo || "").trim());
    if (Number.isNaN(w)) return 1; // 不明は中段
    if (w >= 1 && w <= 3) return 0;
    if (w >= 4 && w <= 6) return 1;
    return 2; // 7,8
  };

  // ★ 外（7〜8枠）が1頭もいない日は「外」行を作らない
  const showOuterLane = rows.some((r) => laneFromWaku(r && r["__枠番"]) === 2);
  const laneIndices = showOuterLane ? [0, 1, 2] : [0, 1];

  // --- gridを作る（ヘッダ + 2〜3段） ---
  grid.innerHTML = "";

  // ★ ギリギリまで詰める（左ラベル細く / gap最小）
  grid.style.display = "grid";
  grid.style.gridTemplateColumns = "40px repeat(4, minmax(0, 1fr))";
  grid.style.gap = "6px 6px";
  grid.style.alignItems = "stretch";

  const addHdr = (txt) => {
    const d = document.createElement("div");
    d.className = "pack4c-lbl pack4c-hdr";
    d.style.cssText =
      "display:flex; align-items:center; justify-content:center;" +
      "padding:8px 6px; border-radius:12px;" +
      "background: rgba(0,0,0,0.70); border: 1px solid rgba(255,255,255,0.12);" +
      "color:#e9edf5; font-weight:1000; font-size:13px; white-space:nowrap;";
    d.textContent = txt;
    grid.appendChild(d);
  };

  const addLbl = (txt) => {
    const d = document.createElement("div");
    d.className = "pack4c-lbl";
    d.style.cssText =
      "display:flex; align-items:center; justify-content:center;" +
      "padding:8px 4px; border-radius:12px;" +
      "background: rgba(0,0,0,0.70); border: 1px solid rgba(255,255,255,0.12);" +
      "color:#e9edf5; font-weight:1000; font-size:12px; white-space:nowrap;";
    d.textContent = txt;
    grid.appendChild(d);
  };

  const addCell = () => {
    const d = document.createElement("div");
    d.className = "pack4c-cell";
    d.style.cssText =
      /* ★ 2行分は確保（丸22px×2行 + gap） */
      "min-height:58px; padding:8px 8px; border-radius:12px;" +
      "background: rgba(0,0,0,0.62); border: 1px solid rgba(255,255,255,0.12);" +
      /* ★ 横スクロール禁止：折り返しで全部表示（最大2行想定） */
      "display:flex; flex-wrap:wrap; gap:6px; align-content:flex-start;" +
      "overflow:hidden;";
    grid.appendChild(d);
    return d;
  };

  // ヘッダ行（左上＝進行方向矢印：右回り← / 左回り⇨）
  const arrow = (ti && ti.dir === "左") ? "→" : ((ti && ti.dir === "右") ? "←" : "");
  addHdr(arrow);
  for (const p of PACKS) {
    addHdr(p.label);
  }

  // セル参照（lane -> packKey -> element）
  const cell = [];
  for (const li of laneIndices) {
    addLbl(LANE_LABELS[li]);
    cell[li] = {};
    for (const p of PACKS) {
      cell[li][p.k] = addCell();
    }
  }

  const MAX_PER_CELL = 6;

  // --- 1) まず「枠番→仮レーン」へ入れる（後で列ごとに詰める） ---
  const buckets = {};
  for (const p of PACKS) {
    buckets[p.k] = [[], [], []]; // [内側, 中段, 外側]
  }

  const scoreKey = (r) => {
    const v = (r && r.__score_n !== undefined) ? Number(r.__score_n) : Number.NaN;
    return Number.isNaN(v) ? -999999 : v;
  };

  const umaKey = (r) => {
    const v = (r && r.__umaban_n !== undefined) ? Number(r.__umaban_n) : Number.NaN;
    return Number.isNaN(v) ? 999999 : v;
  };

  for (const r of rows) {
    const um = String(r["馬番"] || "").trim();
    if (!um) continue;

    const style = String(r["脚質(推定)"] || "").trim();
    const pk = packKey(style);

    // 想定外のpkは中段(前)に寄せておく（落ちないように）
    if (!buckets[pk]) {
      buckets[pk] = [[], [], []];
    }

    const lanePref = laneFromWaku(r["__枠番"]);
    buckets[pk][lanePref].push({ r, um, style, sc: scoreKey(r), uk: umaKey(r) });
  }

  // --- 2) 各列（脚質）ごとに「内側→中段→外側」へ詰める ---
  for (const pk of Object.keys(buckets)) {
    // スコア上位→馬番で安定化（詰め替え時の順序がブレない）
    for (let li = 0; li < 3; li++) {
      buckets[pk][li].sort((a,b) => {
        if (a.sc !== b.sc) return b.sc - a.sc;
        return a.uk - b.uk;
      });
    }

    const src0 = buckets[pk][0];
    const src1 = buckets[pk][1];
    const src2 = buckets[pk][2];

    const out0 = [];
    const out1 = [];
    const out2 = [];

    // ★ 内側：空きがあれば中段→外側から吸い上げ（＝内側にスライド）
    while (out0.length < MAX_PER_CELL && (src0.length || src1.length || src2.length)) {
      if (src0.length) out0.push(src0.shift());
      else if (src1.length) out0.push(src1.shift());
      else out0.push(src2.shift());
    }

    // ★ 中段：空きがあれば外側から吸い上げ
    while (out1.length < MAX_PER_CELL && (src1.length || src2.length)) {
      if (src1.length) out1.push(src1.shift());
      else out1.push(src2.shift());
    }

    // ★ 外側：残りを最大6頭
    while (out2.length < MAX_PER_CELL && src2.length) {
      out2.push(src2.shift());
    }

    const outputs = [out0, out1, out2];

    // ★ 表示順だけ「馬番の若い順（昇順）」に揃える（抽出ロジックは維持）
    for (const arr of outputs) {
      arr.sort((a,b) => a.uk - b.uk);
    }

    // --- DOMへ反映（各マス最大6頭） ---
    for (const li of laneIndices) {
      const target = (cell[li] && cell[li][pk]) ? cell[li][pk] : null;
      if (!target) continue;

      // 念のためクリア（再描画時の残りを防ぐ）
      target.innerHTML = "";

      for (const it of outputs[li]) {
        const r = it.r;
        const um = it.um;
        const style = it.style;

        const sp = document.createElement("span");
        sp.className = "pack4c-horse pack4c-ball";

        // ★ 数字丸：ベース形状（サイズは維持）
        sp.style.display = "inline-flex";
        sp.style.alignItems = "center";
        sp.style.justifyContent = "center";
        sp.style.width = "24px";
        sp.style.height = "24px";
        sp.style.borderRadius = "999px";
        sp.style.fontWeight = "1000";
        sp.style.lineHeight = "1";
        sp.style.color = "#fff";

        // ★ 黒リング（影/縁）の残りを完全排除：CSSが強くてもここで勝つ
        sp.style.border = "none";
        sp.style.outline = "none";
        sp.style.boxShadow = "none";
        sp.style.backgroundImage = "none";

        // ★ 発光テーマ（凄馬/乗替=赤 → ◎金/○銀/▲銅/△青）
        const th = ballTheme(r);

        // ★ 中身（枠色）は固定：枠番色を必ず使う（発光テーマでは塗らない）
        const wno = String(r["__枠番"] || "").trim();
        const hx = wakuHex(wno);
        if (hx) {
          sp.style.backgroundColor = hx;              // ← 中身は枠番色のまま
          sp.style.color = (wno === "1") ? "#111" : "#fff";
        } else {
          sp.style.backgroundColor = "rgba(255,255,255,0.10)";
          sp.style.color = "#fff";
        }

        // ★ 外側だけ“ボワっ”発光（リングも指定色）
        if (th && th.key && th.rgb) {
          sp.classList.add("pack4c-pulse");
          sp.style.setProperty("--glow-rgb", th.rgb); // ← 発光/リング色は指定色
          sp.style.textShadow = "0 0 12px rgba(" + th.rgb + ",0.28), 0 1px 0 rgba(0,0,0,0.35)";
        }

        sp.textContent = um;

        if (target.childElementCount < MAX_PER_CELL) {
          target.appendChild(sp);
        }
      }
    }
  }
}

let cardsCollapsed = isMobile();

// ★ レース一覧の並び順（デフォルトは発走時刻順）
let raceOrderMode = "time"; // "time" | "race"

// ★ "HH:MM" を分に変換（無効なら大きい値）
function _timeToMin(s) {
  const t = String(s || "").trim();
  const m = t.match(/(\d(1, 2))\s*[:：]\s*(\d2)/);
  if (!m) return 99999;
  const hh = parseInt(m[1], 10);
  const mm = parseInt(m[2], 10);
  if (Number.isNaN(hh) || Number.isNaN(mm)) return 99999;
  return (hh * 60) + mm;
}

function updateTimeSortBtn() {
  const b = el("timeSortBtn");
  if (!b) return;
  b.textContent = (raceOrderMode === "time") ? "発走時刻: ON" : "発走時刻: OFF";
}

function updateCardToggleBtn() {
  const btn = el("cardToggleBtn");
  if (!btn) return;
  if (!isMobile()) {
    btn.style.display = "none";
    return;
  }
  btn.style.display = "inline-flex";
  btn.textContent = cardsCollapsed ? "詳細を開く" : "詳細を閉じる";
}

function applyCollapsedStateToCards() {
  const nodes = document.querySelectorAll("#cards .card");
  for (const c of nodes) {
    if (cardsCollapsed) c.classList.add("collapsed");
    else c.classList.remove("collapsed");
  }
}

function refreshCollapsedFlagFromCards() {
  const nodes = Array.from(document.querySelectorAll("#cards .card"));
  if (nodes.length === 0) return;
  const allCollapsed = nodes.every(c => c.classList.contains("collapsed"));
  cardsCollapsed = allCollapsed;
  updateCardToggleBtn();
}

function toggleOneCard(card) {
  if (!card) return;
  card.classList.toggle("collapsed");
  refreshCollapsedFlagFromCards();
}

function toggleAllCards() {
  cardsCollapsed = !cardsCollapsed;
  applyCollapsedStateToCards();
  updateCardToggleBtn();
}

function _numKey(x) {
  const m = String(x || "").match(/\d+/);
  return m ? parseInt(m[0], 10) : 999;
}

function raceNoLabel(r) {
  const m = String(r || "").match(/\d+/);
  if (!m) return String(r || "");
  return String(parseInt(m[0], 10)) + "レース";
}

function parseHash() {
  const h = (location.hash || "").replace(/^#/, "");
  const obj = {};
  if (!h) return obj;
  for (const part of h.split("&")) {
    const [k,v] = part.split("=");
    if (!k) continue;
    obj[decodeURIComponent(k)] = decodeURIComponent(v || "");
  }
  return obj;
}

function setHash(date, track, race) {
  const p = [];
  if (date) p.push("date=" + encodeURIComponent(date));
  if (track) p.push("track=" + encodeURIComponent(track));
  if (race) p.push("race=" + encodeURIComponent(race));
  location.hash = "#" + p.join("&");
}

function setPrevNextButtons() {
  const prevBtn = el("prevRaceBtn");
  const nextBtn = el("nextRaceBtn");
  if (!prevBtn || !nextBtn) return;

  const raceSel = el("raceSel");
  const opts = Array.from(raceSel.options || []);
  const idx = opts.findIndex(o => o.value === raceSel.value);

  prevBtn.disabled = (idx <= 0);
  nextBtn.disabled = (idx < 0 || idx >= opts.length - 1);
}

function moveRace(delta) {
  const raceSel = el("raceSel");
  const opts = Array.from(raceSel.options || []);
  const idx = opts.findIndex(o => o.value === raceSel.value);
  const nextIdx = idx + delta;

  if (idx < 0) return;
  if (nextIdx < 0 || nextIdx >= opts.length) return;

  const d2 = el("dateSel").value;
  const t2 = el("trackSel").value;
  const r2 = opts[nextIdx].value;

  raceSel.value = r2;
  setHash(d2, t2, r2);
  render(d2, t2, r2);

  try {
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (e) {
    window.scrollTo(0, 0);
  }
}

let curDate = "";
let lastRenderedKey = "";
let lastRaceKeyForSort = "";

function loadDates() {
  const dateSel = el("dateSel");
  dateSel.innerHTML = "";
  const dates = (DATA.dates || []);
  for (const d of dates) {
    const op = document.createElement("option");
    op.value = d;
    op.textContent = d.slice(4,6) + "/" + d.slice(6,8);
    dateSel.appendChild(op);
  }

  const now = new Date();
  const ymd = (dt) => String(dt.getFullYear()) + String(dt.getMonth() + 1).padStart(2, "0") + String(dt.getDate()).padStart(2, "0");
  const today = ymd(now);
  const tomorrowDt = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const tomorrow = ymd(tomorrowDt);
  const def = (now.getHours() >= 17 && dates.includes(tomorrow))
    ? tomorrow
    : (dates.includes(today) ? today : (DATA.default_date || ""));
  if (def && dates.includes(def)) {
    dateSel.value = def;
    return def;
  }

  if (dates.length > 0) {
    dateSel.value = dates[0];
    return dates[0];
  }

  return "";
}

function loadTracks(date) {
  const trackSel = el("trackSel");
  trackSel.innerHTML = "";
  const obj = (DATA.races[date] || {});
  const tracks = Object.keys(obj).sort();
  for (const t of tracks) {
    const op = document.createElement("option");
    op.value = t;
    op.textContent = t;
    trackSel.appendChild(op);
  }
  if (tracks.length > 0) trackSel.value = tracks[0];
  return tracks.length > 0 ? tracks[0] : "";
}

function loadRaces(date, track, preferRaceNo) {
  const raceSel = el("raceSel");
  raceSel.innerHTML = "";
  const obj = (((DATA.races[date] || {})[track]) || {});

  const races = Object.keys(obj).sort((a,b) => {
    const ia = (obj[a] && obj[a].race_info) ? obj[a].race_info : {};
    const ib = (obj[b] && obj[b].race_info) ? obj[b].race_info : {};

    // ★ キー名ゆれに強く（発走時刻 / 発走 / 発走時間）
    const ta = ia["発走時刻"] || ia["発走"] || ia["発走時間"] || "";
    const tb = ib["発走時刻"] || ib["発走"] || ib["発走時間"] || "";

    const ma = _timeToMin(ta);
    const mb = _timeToMin(tb);

    if (ma !== mb) return ma - mb;
    // 同時刻/不明はレース番号で安定化
    return _numKey(a) - _numKey(b);
  });

  for (const r of races) {
    const op = document.createElement("option");
    op.value = r;
    op.textContent = raceNoLabel(r);
    raceSel.appendChild(op);
  }

  if (races.length === 0) return "";

  if (preferRaceNo && races.includes(preferRaceNo)) {
    raceSel.value = preferRaceNo;
    return preferRaceNo;
  }

  raceSel.value = races[0];
  return races[0];
}

function setUpdateBadge(date) {
  const up = (DATA.files && DATA.files[date] && DATA.files[date].updated_at) ? DATA.files[date].updated_at : "";
  el("updateBadge").textContent = up ? ("更新: " + up) : "";
}

function setHotHit(pattern) {
  const p = String(pattern || "");
  document.body.classList.toggle("hot-hit-gold", p === "A");
  document.body.classList.toggle("hot-hit-silver", p === "B");
}

function normalizePlaceName(placeName) {
  let s = String(placeName || "").trim();
  if (!s) return "";
  s = s.replace(/　/g, " ").replace(/\s+/g, "");
  s = s.replace(/競馬場/g, "");
  s = s.replace(/[（(]外[）)]/g, "");
  s = s.replace(/外$/g, "");
  const keys = ["札幌","函館","福島","新潟","東京","中山","中京","京都","阪神","小倉"];
  for (const k of keys) {
    if (s.includes(k)) return k;
  }
  return s;
}

function placeNameToCode(placeName) {
  const mp = {
    "札幌": "01","函館": "02","福島": "03","新潟": "04","東京": "05",
    "中山": "06","中京": "07","京都": "08","阪神": "09","小倉": "10",
  };
  const n = normalizePlaceName(placeName);
  return mp[n] || "";
}

function buildPredictionUrl(date, info, track, race) {
  const rid = (info && info.race_id) ? String(info.race_id) : "";
  const parts = [];

  if (date) parts.push("date=" + encodeURIComponent(date));
  if (rid) parts.push("race_id=" + encodeURIComponent(rid));

  const tRaw = String(track || "").trim();
  const t = normalizePlaceName(tRaw);
  const placeCode = placeNameToCode(t);

  const rno = (() => {
    const m = String(race || "").match(/\d+/);
    return m ? String(parseInt(m[0], 10)) : "";
  })();

  if (t) {
    parts.push("track=" + encodeURIComponent(t));
    parts.push("track_name=" + encodeURIComponent(t));
    parts.push("place_name=" + encodeURIComponent(t));
    parts.push("place=" + encodeURIComponent(t));
  }
  if (placeCode) {
    parts.push("place_code=" + encodeURIComponent(placeCode));
    parts.push("track_code=" + encodeURIComponent(placeCode));
    parts.push("place_cd=" + encodeURIComponent(placeCode));
  }
  if (rno) {
    parts.push("race=" + encodeURIComponent(rno));
    parts.push("r=" + encodeURIComponent(rno));
    parts.push("race_no=" + encodeURIComponent(rno));
  }

  const qs = parts.join("&");
  return "yosouka_prediction_results.html?" + qs + "#" + qs;
}

function render(date, track, raceNo) {
  const obj = ((((DATA.races[date] || {})[track] || {})[raceNo]) || null);
  const raceName = el("raceName");
  const raceKeyForSort = [date, track, raceNo].join("__");

  // ★ いま見ているレースを保持（モーダルで参照）
  currentRaceObj = obj;
  const oddsHistoryBtn = el("oddsHistoryBtn");
  if (oddsHistoryBtn) oddsHistoryBtn.href = "odds_history.html?" + new URLSearchParams({date, track, race: String(raceNo)});

  if (raceName) {
    raceName.classList.remove("battle-gold", "battle-silver");
  }

  // ★ 予想へボタン（有効化/遷移先）を毎回更新
  const pbtn = el("predictBtn");
  if (pbtn) {
    pbtn.disabled = !(obj && obj.predict_available);
    pbtn.onclick = null;
    if (obj && obj.predict_available) {
      pbtn.onclick = () => {
        const d2 = el("dateSel").value;
        const t2 = el("trackSel").value;
        const r2 = el("raceSel").value;
        location.href = buildPredictionUrl(d2, obj, t2, r2);
      };
    }
  }

  if (!obj) {
    lastRaceKeyForSort = raceKeyForSort;
    raceName.textContent = "—";
    setHotHit("");
    renderSugoumaFlag(null);
    renderMeta(null);
    renderRows([]);
    updateCardToggleBtn();
    setPrevNextButtons();
    return;
  }

  raceName.textContent = obj.race_name || "（レース名なし）";

  const battleJudge = String((obj.race_info && obj.race_info["勝負判定(採用)"]) ? obj.race_info["勝負判定(採用)"] : "").trim();
  if (raceName) {
    if (battleJudge === "勝負") {
      raceName.classList.add("battle-gold");
    } else if (battleJudge === "順勝負") {
      raceName.classList.add("battle-silver");
    }
  }

  setHotHit(obj.hit_pattern || ((obj.hot_hit) ? "A" : ""));
  renderSugoumaFlag(obj.sugouma || null);
  renderMeta(obj.race_info || null);

  // ★ 乗換推奨は「1頭前提」なので、頭数は表示しない（0は非表示）
  const nb = el("norikaeBadge");
  if (nb) {
    const cnt = (obj.rows || []).filter(x => x && x.__norikae).length;
    nb.textContent = (cnt > 0) ? "乗換" : "";
  }


  // ★ 乗替推奨（凄馬風バナー）
  renderNorikaeFlag(obj);

  let mode = el("sortSel").value || "mark";
  if (obj.result_done && lastRaceKeyForSort !== raceKeyForSort) {
    mode = "result";
    el("sortSel").value = "result";
  } else {
    el("sortSel").value = mode;
  }
  lastRaceKeyForSort = raceKeyForSort;

  let sorted = sortRows(obj.rows || [], mode);
  if (["win","top3"].includes(mode)) sorted = sorted.slice().sort((a,b) => (probabilityValue(b) ?? -1) - (probabilityValue(a) ?? -1));
  renderRows(sorted);

  applyCollapsedStateToCards();
  updateCardToggleBtn();
  setPrevNextButtons();

  lastRenderedKey = [date, track, raceNo, mode, (isMobile() ? "m" : "d")].join("__");
}

function rerenderIfNeeded() {
  const d = el("dateSel").value;
  const t = el("trackSel").value;
  const r = el("raceSel").value;
  const mode = el("sortSel").value || "mark";
  const key = [d, t, r, mode, (isMobile() ? "m" : "d")].join("__");
  if (key !== lastRenderedKey) {
    render(d, t, r);
  }
}

function initFromHashOrDefault() {
  buildHead();
  try { displayedProbabilityMode = localStorage.getItem("keibaProbabilityMode") === "win" ? "win" : "top3"; } catch (_) {}

  const defaultDate = loadDates();
  const hs = parseHash();

  const d = (hs.date && (DATA.dates || []).includes(hs.date)) ? hs.date : defaultDate;
  curDate = d;
  el("dateSel").value = d;
  setUpdateBadge(d);

  const t0 = loadTracks(d);
  const t = (hs.track && Object.keys(DATA.races[d] || {}).includes(hs.track)) ? hs.track : t0;
  el("trackSel").value = t;

  const r0 = loadRaces(d, t, null);
  const r = (hs.race && Object.keys((DATA.races[d] || {})[t] || {}).includes(hs.race)) ? hs.race : r0;
  el("raceSel").value = r;

  render(d, t, r);

  // ★ 初期表示でもURLハッシュを現在選択に同期（＝そのレースのリンクになる）
  setHash(d, t, r);

  const btn = el("cardToggleBtn");
  if (btn) {
    btn.addEventListener("click", () => {
      toggleAllCards();
    });
  }
  updateCardToggleBtn();

  const prevBtn = el("prevRaceBtn");
  if (prevBtn) {
    prevBtn.addEventListener("click", () => {
      moveRace(-1);
    });
  }

  const nextBtn = el("nextRaceBtn");
  if (nextBtn) {
    nextBtn.addEventListener("click", () => {
      moveRace(1);
    });
  }

  const back = el("backTopBtn");
  if (back) {
    back.addEventListener("click", () => {
      const d2 = el("dateSel").value;
      const v = Date.now();
      location.href = "index.html?v=" + v + "#date=" + encodeURIComponent(d2);
    });
  }

  el("dateSel").addEventListener("change", () => {
    const d2 = el("dateSel").value;
    curDate = d2;
    setUpdateBadge(d2);

    const prevTrack = el("trackSel").value;
    const prevRace = el("raceSel").value;

    const t2 = loadTracks(d2);
    const tPick = Object.keys(DATA.races[d2] || {}).includes(prevTrack) ? prevTrack : t2;
    el("trackSel").value = tPick;

    const r2 = loadRaces(d2, tPick, prevRace);
    el("raceSel").value = r2;

    setHash(d2, tPick, r2);
    render(d2, tPick, r2);
  });

  el("trackSel").addEventListener("change", (e) => {
    const d2 = el("dateSel").value;
    const prevRace = el("raceSel").value;
    const t2 = e.target.value;
    const r2 = loadRaces(d2, t2, prevRace);
    setHash(d2, t2, r2);
    render(d2, t2, r2);
  });

  el("raceSel").addEventListener("change", (e) => {
    const d2 = el("dateSel").value;
    const t2 = el("trackSel").value;
    const r2 = e.target.value;
    setHash(d2, t2, r2);
    render(d2, t2, r2);
  });

  el("sortSel").addEventListener("change", () => {
    if (["win","top3"].includes(el("sortSel").value)) {
      displayedProbabilityMode = el("sortSel").value;
      try { localStorage.setItem("keibaProbabilityMode", displayedProbabilityMode); } catch (_) {}
    }
    const d2 = el("dateSel").value;
    const t2 = el("trackSel").value;
    const r2 = el("raceSel").value;
    setHash(d2, t2, r2);
    render(d2, t2, r2);
  });

  window.addEventListener("resize", () => {
    rerenderIfNeeded();
    updateCardToggleBtn();
    setPrevNextButtons();
  }, { passive: true });

  window.addEventListener("orientationchange", () => {
    setTimeout(() => {
      rerenderIfNeeded();
      updateCardToggleBtn();
      setPrevNextButtons();
    }, 50);
  }, { passive: true });
}

function shouldForceTopRedirect() {
  const standalone =
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
    (window.navigator && window.navigator.standalone);

  if (!standalone) return false;

  // ★ Top からの遷移フラグ（referrerが空でも判定できる）
  let fromTop = false;
  try {
    fromTop = (sessionStorage.getItem("fromTop") === "1");
  } catch (e) {
    fromTop = false;
  }

  // ★ すでにレース指定(hash)があるなら、Topへ戻さない
  const hs = parseHash();
  const hasRace = !!(hs && (hs.track || hs.race || hs.race_id));

  // referrer は standalone で空になりやすいので補助に留める
  const ref = String(document.referrer || "");
  const refOk = ref.includes("index.html");

  // Top起点 or hash指定 or referrer OK → 出馬表を許可
  if (fromTop || hasRace || refOk) return false;

  // それ以外（出馬表を直開き）だけ Top へ戻す
  return true;
}

if (shouldForceTopRedirect()) {
  const hs = parseHash();
  const d0 = (DATA && DATA.default_date) ? String(DATA.default_date) : "";
  const d = hs.date ? String(hs.date) : d0;
  const h = d ? ("#date=" + encodeURIComponent(d)) : "";
  location.replace("index.html" + h);
} else {
  // ★ フラグはここで消す（次回以降の誤判定防止）
  try { sessionStorage.removeItem("fromTop"); } catch (e) {}
  initFromHashOrDefault();
}
</script>
