<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#06080c" />
<link rel="manifest" href="manifest.json?v=20261012132836" />
<title>出馬表ビューア</title>

<style>
:root {
  --bg: #0f1115;
  --panel: #141823;
  --panel2: #10131b;
  --text: #e9edf5;
  --muted: #aab3c5;
  --line: rgba(255,255,255,0.10);
  --shadow: 0 10px 24px rgba(0,0,0,0.35);
  --shadow2: 0 6px 16px rgba(0,0,0,0.30);

  /* ★ Navy UI（共通・暗め） */
  --navy: rgba(25,40,95,0.92);
  --navy-border: rgba(105,150,245,0.50);
  --navy-text: #f2f7ff;
  --navy-focus: rgba(105,150,245,0.16);
}

* { box-sizing: border-box; }
html {
  min-height: 100%;
  background-color: #06080c;
}
body { min-height: 100%; }
body {
  margin: 0;
  background: radial-gradient(1200px 800px at 15% 10%, rgba(90,140,255,0.10), transparent 55%),
              radial-gradient(900px 700px at 85% 0%, rgba(255,220,120,0.07), transparent 60%),
              var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}

.hit-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: 0;
  mix-blend-mode: screen;
}

.hit-glow.gold {
  background:
    radial-gradient(1200px 900px at 50% 10%, rgba(255,211,77,0.22), transparent 60%),
    radial-gradient(900px 700px at 15% 80%, rgba(255,211,77,0.12), transparent 60%),
    radial-gradient(900px 700px at 85% 85%, rgba(255,211,77,0.12), transparent 60%);
}

.hit-glow.silver {
  background:
    radial-gradient(1200px 900px at 50% 10%, rgba(210,220,235,0.20), transparent 60%),
    radial-gradient(900px 700px at 15% 80%, rgba(210,220,235,0.11), transparent 60%),
    radial-gradient(900px 700px at 85% 85%, rgba(210,220,235,0.11), transparent 60%);
}

@keyframes goldGlow {
  0%   { opacity: 0.08; filter: brightness(1.00); }
  50%  { opacity: 0.26; filter: brightness(1.15); }
  100% { opacity: 0.08; filter: brightness(1.00); }
}

@keyframes silverGlow {
  0%   { opacity: 0.07; filter: brightness(1.00); }
  50%  { opacity: 0.22; filter: brightness(1.12); }
  100% { opacity: 0.07; filter: brightness(1.00); }
}

body.hot-hit-gold .hit-glow.gold {
  animation: goldGlow 1.05s ease-in-out infinite;
}

body.hot-hit-silver .hit-glow.silver {
  animation: silverGlow 1.10s ease-in-out infinite;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: linear-gradient(180deg, rgba(15,17,21,0.98), rgba(15,17,21,0.86));
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: calc(10px + env(safe-area-inset-top)) 12px 10px 12px;
}

.controls {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.controls-row {
  display: flex;
  flex-wrap: nowrap;
  gap: 8px;
  align-items: center;
  width: 100%;
}
.controls-row > * {
  min-width: 0;
}

/* ★ Top 2行目：4ボタンを均等配置 */
.controls-row.top-row2 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.controls-row.top-row2 > * {
  width: 100%;
}


.select {
  width: auto;
  min-width: 140px;
  flex: 1 1 140px;
  padding: 10px 12px;
  background: var(--navy);
  color: var(--navy-text);
  border: 1px solid var(--navy-border);
  border-radius: 12px;
  font-size: 14px;
  outline: none;
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
}

.select:focus {
  border-color: var(--navy-border);
  box-shadow: 0 0 0 3px var(--navy-focus);
}

.badge {
  padding: 10px 12px;
  background: rgba(20,24,35,0.92);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-weight: 900;
  font-size: 12px;
  white-space: nowrap;
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
}
.badge.sub {
  font-weight: 700;
  opacity: 0.95;
}

/* ★ 更新バー（3行目・黒背景） */
.updatebar {
  width: 100%;
  min-height: 40px;
  padding: 10px 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  border: 1px solid var(--navy-border);
  background: var(--navy);
  color: var(--navy-text);
  font-weight: 1000;
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
}

.btn {
  padding: 10px 12px;
  background: var(--navy);
  border: 1px solid var(--navy-border);
  border-radius: 12px;
  color: var(--navy-text);
  font-weight: 1000;
  font-size: 12px;
  white-space: nowrap;
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
  cursor: pointer;
  user-select: none;
}
.btn:active {
  transform: scale(0.99);
  filter: brightness(1.08);
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.btn.mobile-only {
  display: none;
}
.racename {
  margin-top: 0;
  margin-bottom: 8px;
  padding: 10px 12px;
  background: rgba(16,19,27,0.92);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 15px;
  font-weight: 900;
  line-height: 1.25;
  box-shadow: var(--shadow2);
}

.racename.battle-gold {
  border-color: rgba(255,211,77,0.88);
  background: rgba(255,211,77,0.18);
  color: #fff8da;
  text-shadow: 0 0 12px rgba(255,211,77,0.52);
  box-shadow: 0 0 0 1px rgba(255,211,77,0.16) inset, 0 0 18px rgba(255,211,77,0.24), var(--shadow2);
}

.racename.battle-silver {
  border-color: rgba(210,220,235,0.88);
  background: rgba(210,220,235,0.16);
  color: #f7fbff;
  text-shadow: 0 0 12px rgba(210,220,235,0.46);
  box-shadow: 0 0 0 1px rgba(210,220,235,0.14) inset, 0 0 16px rgba(210,220,235,0.20), var(--shadow2);
}
.sugouma-flag {
  margin-top: 8px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  font-weight: 1000;
  letter-spacing: 0.02em;
  display: none;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 24px rgba(0,0,0,0.35);
}
.sugouma-flag.on {
  display: block;
}
.sugouma-flag::before {
  content: "";
  position: absolute;
  inset: -55% -85%;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(var(--shine-rgb, 255,255,255), 0.00) 35%,
    rgba(var(--shine-rgb, 255,255,255), 0.46) 50%,
    rgba(var(--shine-rgb, 255,255,255), 0.00) 65%,
    transparent 100%
  );
  transform: translateX(-70%) rotate(12deg);
  animation: sgShine 1.35s linear infinite;
  pointer-events: none;
  mix-blend-mode: screen;
}
@keyframes sgShine {
  0%   { transform: translateX(-70%) rotate(12deg); opacity: 0.06; }
  40%  { opacity: 0.62; }
  100% { transform: translateX(70%) rotate(12deg); opacity: 0.06; }
}
@keyframes sgPulse {
  0%   { filter: brightness(1.00); }
  50%  { filter: brightness(1.18); }
  100% { filter: brightness(1.00); }
}
.sugouma-flag.sg-sugo {
  border-color: rgba(220,240,255,0.35);
  background: rgba(180,220,255,0.12);
  text-shadow: 0 0 10px rgba(200,240,255,0.28);
  animation: sgPulse 1.0s ease-in-out infinite;
}
.sugouma-flag.sg-cho {
  border-color: rgba(70,179,255,0.60);
  background: rgba(70,179,255,0.18);
  text-shadow: 0 0 12px rgba(70,179,255,0.45);
  box-shadow: 0 0 0 1px rgba(70,179,255,0.20) inset, 0 0 18px rgba(70,179,255,0.35), var(--shadow2);
  animation: sgPulse 0.95s ease-in-out infinite;
}
.sugouma-flag.sg-chocho {
  border-color: rgba(181,108,255,0.65);
  background: rgba(181,108,255,0.18);
  text-shadow: 0 0 14px rgba(181,108,255,0.55);
  box-shadow: 0 0 0 1px rgba(181,108,255,0.22) inset, 0 0 22px rgba(181,108,255,0.42), var(--shadow2);
  animation: sgPulse 0.90s ease-in-out infinite;
}
.sugouma-flag.sg-goku {
  border-color: rgba(255,75,75,0.70);
  background: rgba(255,75,75,0.18);
  text-shadow: 0 0 14px rgba(255,75,75,0.58);
  box-shadow: 0 0 0 1px rgba(255,75,75,0.22) inset, 0 0 24px rgba(255,75,75,0.46), var(--shadow2);
  animation: sgPulse 0.88s ease-in-out infinite;
}
.sugouma-flag.sg-zetsu {
  border-color: rgba(255,211,77,0.80);
  background: rgba(255,211,77,0.20);
  color: #fff8da;
  text-shadow: 0 0 16px rgba(255,211,77,0.70);
  box-shadow: 0 0 0 1px rgba(255,211,77,0.24) inset, 0 0 26px rgba(255,211,77,0.52), var(--shadow2);
  animation: sgPulse 0.85s ease-in-out infinite;
}

/* ★ 乗替推奨（凄馬風バナー） */
.norikae-flag {
  margin-top: 8px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  font-weight: 1000;
  letter-spacing: 0.02em;
  display: none;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 24px rgba(0,0,0,0.35);
  line-height: 1.35;
}
.norikae-flag.on {
  display: block;
}
.norikae-flag::before {
  content: "";
  position: absolute;
  inset: -55% -85%;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(var(--shine-rgb, 255,255,255), 0.00) 35%,
    rgba(var(--shine-rgb, 255,255,255), 0.46) 50%,
    rgba(var(--shine-rgb, 255,255,255), 0.00) 65%,
    transparent 100%
  );
  transform: translateX(-70%) rotate(12deg);
  animation: sgShine 1.25s linear infinite;
  pointer-events: none;
  mix-blend-mode: screen;
}
.norikae-flag.nk-on {
  border-color: rgba(90, 230, 140, 0.58);
  background: rgba(90, 230, 140, 0.14);
  text-shadow: 0 0 12px rgba(90, 230, 140, 0.38);
  box-shadow: 0 0 0 1px rgba(90, 230, 140, 0.14) inset, 0 0 18px rgba(90, 230, 140, 0.20), var(--shadow2);
  animation: sgPulse 0.95s ease-in-out infinite;
}

.racemeta {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
#raceMeta { display:block; line-height:1.55; }
.meta-reason { border-left:2px solid #779a83; padding-left:10px; font-size:13px; color:var(--text); }
.meta-reason-label { display:block; font-size:11px; color:#a6c4af; margin-bottom:2px; }
.meta-conditions { margin:8px 0 0 12px; font-size:11px; color:var(--muted); }
.meta-wind { margin:8px 0 0 12px; font-size:12px; }
.meta-wind-line { display:flex; flex-wrap:wrap; align-items:center; gap:7px; }
.meta-wind-arrow { font-size:22px; line-height:1; color:#c5dacc; }
.meta-wind-compass { font-size:10px; color:var(--muted); }
.meta-wind-segments { margin-top:3px; font-size:11px; color:var(--muted); }
.chip {
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.06);
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
  transition: transform 120ms ease, filter 120ms ease;
}
.chip b {
  color: var(--text);
  margin-right: 8px;
}
.chip:active {
  transform: scale(0.98);
  filter: brightness(1.05);
}
.chip.baba-turf { background: rgba(0, 160, 70, 0.44); color: #f3fff5; border-color: rgba(0,160,70,0.70); }
.chip.baba-dirt { background: rgba(140, 85, 55, 0.48); color: #fff5ef; border-color: rgba(140,85,55,0.72); }
.chip.baba-jump { background: rgba(0, 145, 165, 0.46); color: #effdff; border-color: rgba(0,145,165,0.72); }
.chip.rank-s  { background: rgba(220, 170, 0, 0.56); color: #1a1400; border-color: rgba(220,170,0,0.85); }
.chip.rank-a  { background: rgba(0, 95, 210, 0.56); color: #f2f7ff; border-color: rgba(0,95,210,0.85); }
.chip.rank-ng { background: rgba(210, 55, 55, 0.56); color: #fff3f3; border-color: rgba(210,55,55,0.85); }

/* ★ 表示だけ廃止：指数比較（混戦など）のバッジを出さない */
#raceMeta .chip[data-key="指数比較"] {
  display: none !important;
}

/* ★ おすすめ買い目が存在する場合（.rec-on）: 凄馬同様のエフェクト */
@keyframes recShine {
  0%   { transform: translateX(-70%) rotate(12deg); opacity: 0.06; }
  40%  { opacity: 0.62; }
  100% { transform: translateX(70%) rotate(12deg); opacity: 0.06; }
}
@keyframes recPulse {
  0%   { filter: brightness(1.00); }
  50%  { filter: brightness(1.16); }
  100% { filter: brightness(1.00); }
}
.chip.rec-on {
  position: relative;
  overflow: hidden;
  animation: recPulse 0.95s ease-in-out infinite;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.10) inset, 0 0 16px rgba(255,255,255,0.10);
}
.chip.rec-on::before {
  content: "";
  position: absolute;
  inset: -55% -85%;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(var(--shine-rgb, 255,255,255), 0.00) 35%,
    rgba(var(--shine-rgb, 255,255,255), 0.46) 50%,
    rgba(var(--shine-rgb, 255,255,255), 0.00) 65%,
    transparent 100%
  );
  transform: translateX(-70%) rotate(12deg);
  animation: recShine 1.20s linear infinite;
  pointer-events: none;
  mix-blend-mode: screen;
}

.wrapper {
  padding: 12px 12px calc(24px + env(safe-area-inset-bottom)) 12px;
}

.tablewrap {
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  background: rgba(16,19,27,0.88);
  box-shadow: var(--shadow);
}
.scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.scroll::-webkit-scrollbar {
  height: 10px;
}
.scroll::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.18);
  border-radius: 999px;
}
.scroll::-webkit-scrollbar-track {
  background: rgba(255,255,255,0.06);
}

table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  min-width: 980px;
}
th, td {
  border-bottom: 1px solid var(--line);
  padding: 8px 10px;
  font-size: 13px;
  text-align: center;
  white-space: nowrap;
  vertical-align: middle;
  line-height: 1.15;
}
th {
  position: sticky;
  top: 0;
  z-index: 5;
  background: rgba(255,255,255,0.06);
  font-weight: 900;
  font-size: 12px;
  letter-spacing: 0.02em;
}
tbody tr {
  --rowbg: rgba(16,19,27,0.96);
  transition: transform 120ms ease, filter 120ms ease;
}
tbody tr:nth-child(even) {
  --rowbg: rgba(18,22,32,0.96);
}
tbody td {
  background-color: var(--rowbg);
}
tbody tr:active {
  transform: scale(0.995);
  filter: brightness(1.06);
}

@keyframes podiumPulse {
  0%   { filter: brightness(1.00); }
  50%  { filter: brightness(1.14); }
  100% { filter: brightness(1.00); }
}
@keyframes podiumShine {
  0%   { background-position: -140% 0; opacity: 0.08; }
  40%  { opacity: 0.55; }
  100% { background-position: 140% 0; opacity: 0.08; }
}

tbody tr.in3 td {
  background-image: linear-gradient(
    90deg,
    rgba(255,255,255,0.00) 0%,
    rgba(255,255,255,0.07) 45%,
    rgba(255,255,255,0.00) 70%,
    rgba(255,255,255,0.00) 100%
  );
  background-size: 260% 100%;
  background-position: -140% 0;
  animation: podiumShine 1.20s linear infinite, podiumPulse 1.05s ease-in-out infinite;
}

tbody tr.pos1 td {
  box-shadow: 0 0 0 1px rgba(255,211,77,0.16) inset, 0 0 20px rgba(255,211,77,0.18);
}
tbody tr.pos2 td {
  box-shadow: 0 0 0 1px rgba(210,220,235,0.14) inset, 0 0 18px rgba(210,220,235,0.14);
}
tbody tr.pos3 td {
  box-shadow: 0 0 0 1px rgba(255,160,95,0.14) inset, 0 0 18px rgba(255,160,95,0.12);
}

td.vstack {
  white-space: pre-line;
  line-height: 1.20;
  font-size: 12px;
}
td.umaban {
  font-weight: 900;
  padding: 8px 10px;
  font-size: 13px;
  border-radius: 0;
}
td.horse {
  font-weight: 900;
  font-size: 13px;
  text-align: left;
}
td.bigcell {
  font-size: 13px;
  font-weight: 800;
}

.sticky-left-1 {
  position: sticky;
  left: 0;
  z-index: 6;
  background-color: var(--rowbg);
}
.sticky-left-2 {
  position: sticky;
  left: 72px;
  z-index: 6;
  background-color: var(--rowbg);
}
th.sticky-left-1, th.sticky-left-2 {
  z-index: 8;
  background: rgba(18,22,32,0.98);
}
.sticky-left-1::after, .sticky-left-2::after {
  content: "";
  position: absolute;
  top: 0;
  right: -1px;
  width: 1px;
  height: 100%;
  background: rgba(255,255,255,0.10);
}

.waku-1 { background: #ffffff; color: #111; }
.waku-2 { background: #2b2b2b; color: #fff; }
.waku-3 { background: #c65a5a; color: #fff; }
.waku-4 { background: #4f7db8; color: #fff; }
.waku-5 { background: #b99a00; color: #fff; }
.waku-6 { background: #2f8f5a; color: #fff; }
.waku-7 { background: #c97a2a; color: #fff; }
.waku-8 { background: #c46ab0; color: #fff; }

.hmark-ss { color: #ffd34d; }
.hmark-s  { color: #a8d5ff; }
.hmark-m  { color: #ff9fc9; }
.hmark-w  { color: #e9edf5; }
.mark-consensus {
  color: #ffd34d !important;
  text-shadow: 0 0 10px rgba(255,211,77,0.62);
}

@keyframes sgSpark {
  0%   { filter: brightness(1.00); }
  50%  { filter: brightness(1.22); }
  100% { filter: brightness(1.00); }
}
@keyframes sgSweep {
  0%   { background-position: -140% 0; }
  100% { background-position: 140% 0; }
}
.sg-row td {
  transition: filter 120ms ease, background 120ms ease;
}
.sg-row td.horse {
  border-radius: 0;
  background-image: linear-gradient(
    90deg,
    rgba(255,255,255,0.00) 0%,
    rgba(255,255,255,0.08) 45%,
    rgba(255,255,255,0.00) 70%,
    rgba(255,255,255,0.00) 100%
  );
  background-size: 260% 100%;
  background-position: -140% 0;
  animation: sgSweep 1.10s linear infinite, sgSpark 0.95s ease-in-out infinite;
}
.sg-row.sg-sugo td.horse {
  box-shadow: 0 0 0 1px rgba(200,240,255,0.18) inset, 0 0 16px rgba(200,240,255,0.18);
  text-shadow: 0 0 10px rgba(200,240,255,0.22);
}
.sg-row.sg-cho td.horse {
  box-shadow: 0 0 0 1px rgba(70,179,255,0.22) inset, 0 0 22px rgba(70,179,255,0.32);
  text-shadow: 0 0 12px rgba(70,179,255,0.45);
}
.sg-row.sg-chocho td.horse {
  box-shadow: 0 0 0 1px rgba(181,108,255,0.24) inset, 0 0 26px rgba(181,108,255,0.38);
  text-shadow: 0 0 12px rgba(181,108,255,0.55);
}
.sg-row.sg-goku td.horse {
  box-shadow: 0 0 0 1px rgba(255,75,75,0.24) inset, 0 0 28px rgba(255,75,75,0.40);
  text-shadow: 0 0 12px rgba(255,75,75,0.58);
}
.sg-row.sg-zetsu td.horse {
  box-shadow: 0 0 0 1px rgba(255,211,77,0.26) inset, 0 0 30px rgba(255,211,77,0.50);
  text-shadow: 0 0 14px rgba(255,211,77,0.75);
}

.cardwrap {
  display: none;
  margin-top: 12px;
}
.cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.card {
  border: 1px solid var(--line);
  background: rgba(16,19,27,0.88);
  border-radius: 16px;
  box-shadow: var(--shadow2);
  overflow: hidden;
  transform: translateY(0);
  animation: fadeUp 180ms ease both;
}

@keyframes cardPodiumPulse {
  0%   { filter: brightness(1.00); }
  50%  { filter: brightness(1.12); }
  100% { filter: brightness(1.00); }
}

.card.in3 {
  animation: fadeUp 180ms ease both, cardPodiumPulse 1.10s ease-in-out infinite;
}

.card.pos1 {
  border-color: rgba(255,211,77,0.55);
  box-shadow: 0 0 0 1px rgba(255,211,77,0.12) inset, 0 0 22px rgba(255,211,77,0.22), var(--shadow2);
}
.card.pos2 {
  border-color: rgba(210,220,235,0.55);
  box-shadow: 0 0 0 1px rgba(210,220,235,0.12) inset, 0 0 18px rgba(210,220,235,0.18), var(--shadow2);
}
.card.pos3 {
  border-color: rgba(255,160,95,0.50);
  box-shadow: 0 0 0 1px rgba(255,160,95,0.10) inset, 0 0 16px rgba(255,160,95,0.16), var(--shadow2);
}
.card.sg-card {
  position: relative;
  overflow: hidden;
}
.card.sg-card::before {
  content: "";
  position: absolute;
  inset: -40% -60%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.30), transparent);
  transform: rotate(12deg);
  animation: sgShine 1.15s linear infinite;
  pointer-events: none;
  opacity: 0.65;
}
.card.sg-card.sg-sugo {
  border-color: rgba(200,240,255,0.35);
  box-shadow: 0 0 0 1px rgba(200,240,255,0.10) inset, 0 0 16px rgba(200,240,255,0.18), var(--shadow2);
}
.card.sg-card.sg-cho {
  border-color: rgba(70,179,255,0.55);
  box-shadow: 0 0 0 1px rgba(70,179,255,0.12) inset, 0 0 22px rgba(70,179,255,0.30), var(--shadow2);
}
.card.sg-card.sg-chocho {
  border-color: rgba(181,108,255,0.60);
  box-shadow: 0 0 0 1px rgba(181,108,255,0.12) inset, 0 0 26px rgba(181,108,255,0.36), var(--shadow2);
}
.card.sg-card.sg-goku {
  border-color: rgba(255,75,75,0.65);
  box-shadow: 0 0 0 1px rgba(255,75,75,0.12) inset, 0 0 28px rgba(255,75,75,0.38), var(--shadow2);
}
.card.sg-card.sg-zetsu {
  border-color: rgba(255,211,77,0.75);
  box-shadow: 0 0 0 1px rgba(255,211,77,0.14) inset, 0 0 30px rgba(255,211,77,0.46), var(--shadow2);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card .c1 {
  display: grid;
  grid-template-columns: 68px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 12px 12px 8px 12px;
  cursor: pointer;
}
.card .umabadge {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  height: 44px;
  border-radius: 14px;
  font-weight: 1000;
  font-size: 16px;
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset;
}
.card .hname {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 1000;
  font-size: 15px;
  line-height: 1.15;
}
.card .hname .htext {
  flex: 1 1 auto;
  min-width: 0;
}
.card .hname .hscore {
  flex: 0 0 auto;
  transform: translateY(-1px);
}
.card .hname .hscore .pill {
  padding: 5px 9px;
  font-size: 11px;
}
.card .marks {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-end;
  font-size: 12px;
  color: var(--muted);
}
.card .marks .mstrong {
  font-size: 16px;
  font-weight: 1000;
  color: var(--text);
}
.card .marks .fin {
  font-size: 11px;
  font-weight: 900;
  color: #e9edf5;
  padding: 4px 8px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.06);
}
.card.pos1 .marks .fin {
  border-color: rgba(255,211,77,0.34);
  background: rgba(255,211,77,0.16);
  color: #fff8da;
}
.card.pos2 .marks .fin {
  border-color: rgba(210,220,235,0.32);
  background: rgba(210,220,235,0.14);
  color: #f7fbff;
}
.card.pos3 .marks .fin {
  border-color: rgba(255,160,95,0.30);
  background: rgba(255,160,95,0.12);
  color: #fff3ec;
}
.card .grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px 10px;
  padding: 10px 12px 12px 12px;
  border-top: 1px solid var(--line);
  align-items: start;
}

.kv {
  display: grid;
  grid-template-columns: 78px 1fr;
  gap: 8px;
  align-items: start;
}

.card.collapsed .grid {
  display: none;
}
.card .hname { flex-direction:column; align-items:flex-start; }
.card .market-line { display:inline-flex; gap:12px; font-size:13px; font-weight:normal; white-space:nowrap; }
.card .market-odds { order:0; }
.card .market-pop { order:1; }
.card.collapsed .market-pop { order:0; }
.card.collapsed .market-odds { order:1; }
.card.collapsed .marks .fin { display:none; }
.card.collapsed .c1 {
  grid-template-columns: 56px 1fr auto;
  padding: 12px 12px 12px 12px;
}
.card.collapsed .umabadge {
  height: 38px;
  border-radius: 12px;
  font-size: 14px;
}
.card.collapsed .hname {
  font-size: 14px;
}
.card.collapsed .hname .hscore .pill {
  padding: 5px 9px;
  font-size: 11px;
}
.card.collapsed .marks {
  opacity: 0.95;
  flex-direction: column;
  gap: 4px;
  align-items: flex-end;
}
.card.collapsed .marks .mstrong {
  font-size: 15px;
}

.kv {
  display: grid;
  grid-template-columns: 78px 1fr;
  gap: 8px;
  align-items: baseline;
}
.kv .k {
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.02em;
}
.kv .v {
  color: var(--text);
  font-size: 13px;
  font-weight: 900;
  white-space: pre-line;
  line-height: 1.20;
}
.kv.full {
  grid-column: 1 / -1;
}
.pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 6px 10px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  font-weight: 900;
  font-size: 12px;
  white-space: nowrap;
}
.pill.p-score { background: rgba(120,170,255,0.14); border-color: rgba(120,170,255,0.26); }
.pill.p-u    { background: rgba(255,210,120,0.12); border-color: rgba(255,210,120,0.22); }
.pill.p-n    { background: rgba(255,255,255,0.06); }
.pill.p-nk   { background: rgba(90, 230, 140, 0.16); border-color: rgba(90, 230, 140, 0.55); color: #eafff1; }

.footer {
  margin-top: 10px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}

/* =========================
 * 馬群予測(4C) パネル
 * ========================= */
.controls-row.viewer-row4 {
  display: flex;
  gap: 8px;
}
.controls-row.viewer-row4 .btn {
  width: 100%;
}

.pack4c-wrap {
  margin-top: 10px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(16,19,27,0.88);
  box-shadow: var(--shadow2);
  padding: 12px;
}

.pack4c-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}

.pack4c-title {
  font-weight: 1000;
  font-size: 14px;
  letter-spacing: 0.02em;
}

.pack4c-dir {
  font-weight: 900;
  font-size: 12px;
  color: rgba(170,179,197,0.95);
  white-space: nowrap;
}

.pack4c-grid {
  display: block;
}

.pack4c-scatter {
  display: grid;
  grid-template-columns: 44px 1fr;
  grid-template-rows: 1fr 26px;
  gap: 8px;
}

.pack4c-yaxis {
  position: relative;
  border: 1px solid rgba(255,255,255,0.10);
  background: rgba(0,0,0,0.26);
  border-radius: 12px;
  overflow: hidden;
}

.pack4c-plot {
  position: relative;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.04);
  border-radius: 12px;
  overflow: hidden;
  min-height: 260px;
}

.pack4c-xaxis {
  position: relative;
  border: 1px solid rgba(255,255,255,0.10);
  background: rgba(0,0,0,0.26);
  border-radius: 12px;
  overflow: hidden;
}

.pack4c-y-tick {
  position: absolute;
  left: 0;
  right: 0;
  height: 1px;
  background: rgba(255,255,255,0.10);
}

.pack4c-y-lbl {
  position: absolute;
  left: 8px;
  transform: translateY(-50%);
  font-size: 11px;
  font-weight: 1000;
  color: rgba(205,214,232,0.95);
  white-space: nowrap;
}

.pack4c-x-tick {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: rgba(255,255,255,0.10);
}

.pack4c-x-lbl {
  position: absolute;
  bottom: 4px;
  transform: translateX(-50%);
  font-size: 11px;
  font-weight: 1000;
  color: rgba(205,214,232,0.95);
  white-space: nowrap;
}

.pack4c-dot {
  position: absolute;
  transform: translate(-50%, -50%);
}

.pack4c-horse {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 4px 7px;
  border-radius: 999px;
  font-weight: 1000;
  font-size: 12px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  line-height: 1;

  /* ★ 発光（PC/スマホ共通） */
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.10) inset,
    0 0 10px rgba(255,255,255,0.22),
    0 0 18px rgba(120,170,255,0.18);
  text-shadow: 0 0 10px rgba(255,255,255,0.22);
  animation: pack4cBallGlow 1.15s ease-in-out infinite;
  will-change: filter;
}

@keyframes pack4cBallGlow {
  0%   { filter: brightness(1.00); }
  50%  { filter: brightness(1.18); }
  100% { filter: brightness(1.00); }
}

@media (prefers-reduced-motion: reduce) {
  .pack4c-horse { animation: none; }
}

.pack4c-horse .star {
  margin-left: 4px;
  font-size: 12px;
}

.pack4c-note {
  margin-top: 8px;
  font-size: 11px;
  color: rgba(170,179,197,0.92);
  line-height: 1.35;
}

.pack4c-mobile-board { display: none; }

@media (max-width: 560px) {
  .select { min-width: 0; flex-basis: auto; font-size: 13px; padding: 10px 10px; }
  .badge  { font-size: 11px; padding: 10px 10px; }
  .btn    { font-size: 11px; padding: 10px 10px; }
  .btn.mobile-only { display: inline-flex; }

  /* ★ スマホ：ソートと更新の高さを揃える */
  .controls-row.viewer-row3 .select,
  .controls-row.viewer-row3 .updatebar {
    min-height: 40px;
  }

  /* ★ スマホ：上部UIを3行固定（指定どおり） */

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .controls-row.viewer-row2 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .controls-row.viewer-row3 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .racename { font-size: 14px; }
  .sugouma-flag { font-size: 12px; }
  .chip { font-size: 12px; padding: 8px 12px; }
  .tablewrap { display: none; }

  /* ★ スマホ：4Cを崩さず見せる（横スクロール可） */

  .pack4c-grid {
    grid-template-columns: 44px repeat(6, minmax(120px, 1fr));
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .pack4c-cell, .pack4c-lbl { min-height: 32px; }
  .pack4c-horse { font-size: 12px; padding: 5px 8px; }
  .pack4c-mobile-board {
    display: block;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    background: #091019;
  }
  .pack4c-mobile-head,
  .pack4c-mobile-lane {
    display: grid;
    grid-template-columns: 32px repeat(4, minmax(0, 1fr));
  }
  .pack4c-mobile-head {
    background: rgba(255,255,255,.045);
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .pack4c-mobile-head > div {

  .pack4c-mobile-head > div:first-child { color: transparent; }
  .pack4c-mobile-lane + .pack4c-mobile-lane {
    border-top: 1px solid rgba(255,255,255,.06);
  }
  .pack4c-mobile-lane-label {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8e9bae;
    font-size: 10px;
    font-weight: 900;
    background: rgba(255,255,255,.025);
  }
  .pack4c-mobile-cell {
    min-height: 57px;
    padding: 6px 2px;
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    justify-content: center;
    gap: 4px;
    border-left: 1px solid rgba(255,255,255,.055);
  }
  .pack4c-mobile-ball {
    width: 27px;
    height: 27px;
    display: inline-flex;
    align-items: center;

  }
  .pack4c-mobile-ball.is-key {
    outline: 2px solid #f0c75e;
    outline-offset: 1px;
  }
  .pack4c-mobile-caption {
    padding: 7px 8px;
    border-top: 1px solid rgba(255,255,255,.06);
    color: #7f8ca0;
    font-size: 10px;
    line-height: 1.35;
    text-align: center;
  }

/* 2026 mobile refresh: information-first, quiet, compact */
:root {
  --bg: #070a0f;
  --panel: #10151d;
  --panel2: #0c1118;
  --text: #f5f7fb;
  --muted: #8490a3;
  --line: rgba(255,255,255,.075);
  --navy: rgba(19,27,40,.96);
  --navy-border: rgba(126,148,181,.22);
  --navy-focus: rgba(120,181,255,.18);
}
body {
  background: linear-gradient(180deg, #090d14 0, #070a0f 42%, #06080c 100%);
}
.hit-glow, .card.sg-card::before { display:none !important; }
.card, .card.in3, .chip.rec-on, .pack4c-horse { animation:none !important; }
.btn, .select, .updatebar { box-shadow:none; }
.footer { display:none; }

@media (max-width: 560px) {
  html, body { min-height: 100dvh; background-color: #06080c; }
  body { padding-bottom: env(safe-area-inset-bottom); }
  .topbar {
    padding: calc(7px + env(safe-area-inset-top)) 10px 9px;
    background: rgba(7,10,15,.92);
    border-bottom-color: rgba(255,255,255,.06);
    backdrop-filter: blur(18px) saturate(135%);
  }
  .racename {
    margin:0 0 7px; padding:0 2px 7px;
    border:0; border-radius:0; background:transparent; box-shadow:none;
    font-size:17px; font-weight:800; letter-spacing:-.02em;
  }
  .controls { gap:6px; }
  .controls-row.viewer-row1 { grid-template-columns:1fr 1fr 1fr 1fr; gap:6px; }
  .controls-row.viewer-row2 { grid-template-columns:1.25fr 1fr .72fr .72fr; gap:6px; }
  .btn, .select {
    min-height:38px; padding:8px 7px; border-radius:10px;
    font-size:12px; font-weight:750; border-color:rgba(255,255,255,.08);
    background:#111824;
  }
  #predictBtn { background:#e9b949; color:#171109; border-color:#e9b949; }
  .controls-row.viewer-row3 { display:block; }
  .controls-row.viewer-row3 .select { width:100%; min-height:36px; color:var(--muted); }
  #updateBadge { display:none; }
  .controls-row.viewer-row4 { margin-top:0; }
  #pack4cBtn { min-height:34px; background:transparent; color:var(--muted); }
  .wrapper { padding:9px 10px calc(18px + env(safe-area-inset-bottom)); }
  .cardwrap { margin-top:0; }
  .cards { gap:7px; }
  .card {
    border-radius:13px; border-color:rgba(255,255,255,.07);
    background:#0e141d; box-shadow:0 5px 16px rgba(0,0,0,.22);
  }
  .card.collapsed .c1 { grid-template-columns:44px 1fr auto; min-height:54px; padding:7px 10px; }
  .card.collapsed .umabadge { width:38px; height:38px; border-radius:10px; font-size:15px; }
  .card.collapsed .hname { font-size:15px; letter-spacing:-.01em; }
  .card.collapsed .marks { flex-direction:row; align-items:center; gap:8px; }
  .card.collapsed .marks .mstrong { font-size:20px; line-height:1; }
  .card .grid { padding:9px 11px 12px; gap:7px; }
  .kv { grid-template-columns:70px 1fr; }
  .pill { padding:5px 8px; }
  .sugouma-flag { margin:0 0 6px; padding:7px 10px; border-radius:10px; box-shadow:none; }
  .pack4c-wrap { margin-top:7px; border-radius:12px; background:#0d131c; box-shadow:none; }
}

/* Shared control sizes in both collapsed and expanded horse views. */
.controls .btn, .controls .select {
  box-sizing:border-box; width:100%; height:40px; min-height:40px; max-height:40px;
  margin:0; padding:0 10px; border-radius:10px;
  font-size:12px; font-weight:700; line-height:normal;
}
.controls .btn { align-items:center; justify-content:center; text-decoration:none; }
.controls .btn:not(.mobile-only) { display:inline-flex; }
.controls-row.viewer-row1 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
.controls-row.viewer-row2 { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
.controls-row.viewer-row3 { display:block; }
.controls-row.viewer-row4 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }
.controls #pack4cBtn { min-height:40px; }
#updateBadge { display:none; }
@media (max-width: 560px) {
  .controls-row.viewer-row1 { grid-template-columns:repeat(4,minmax(0,1fr)); }
}
/* Purchase-panel palette, with the original prediction HTML font family. */
:root {
  color-scheme:dark;
  --viewer-font:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --ink:#e5e9ef; --paper:#080b10; --purchase-card:#121922;
  --bg:#080b10; --panel:#121922; --panel2:#1b2430;
  --text:#e5e9ef; --muted:#9aa6b6; --line:#2d3948;
  --navy:#172f55; --navy-text:#e5e9ef; --navy-border:#2d3948;
  --navy-focus:rgba(99,145,185,.16);
}
:root[data-display-theme="day"] {
  color-scheme:light;
  --ink:#263244; --paper:#aeb5bf; --purchase-card:#c5cbd3;
  --bg:#aeb5bf; --panel:#c5cbd3; --panel2:#b8c0cb;
  --text:#263244; --muted:#526074; --line:#969faa;
  --navy-text:#263244; --navy-border:#969faa;
}
body {font-family:var(--viewer-font);background:var(--bg);color:var(--ink)}
button,select,input,textarea {font-family:var(--viewer-font)}
.topbar {background:var(--panel);border-color:var(--line);box-shadow:0 4px 20px rgba(23,34,56,.04)}
.racename {background:var(--purchase-card);border-color:var(--line);color:var(--ink);box-shadow:none}
.btn,.select,.controls .btn,.controls .select {background:var(--panel);color:var(--ink);border-color:var(--line);box-shadow:none}
#predictBtn {background:#172f55;color:white;border-color:#172f55}
#pack4cBtn {background:var(--panel);color:var(--ink)}
.wrapper,.section,.rlist,.rrow,.rmain {color:var(--ink)}
.section,.card,.card .c1,.card .grid,.tablewrap {background:var(--purchase-card);border-color:var(--line)}
.section,.card {box-shadow:0 8px 26px rgba(23,34,56,.07)}
.secthead {background:var(--panel2);border-color:var(--line)}
.track {background:var(--panel);color:var(--ink);border-color:var(--line);box-shadow:none}
.rrow {border-color:var(--line)}
.rno.pending,.rno.done {background:var(--panel2);color:var(--text);border-color:var(--line);box-shadow:none}
.rno.recommended {
  background:linear-gradient(145deg,#214a39,#142d26);
  color:#e4f3e8;border-color:#7db696;text-shadow:0 0 8px rgba(191,225,201,.15);
  box-shadow:0 0 0 1px rgba(82,143,108,.18),0 0 16px rgba(54,138,88,.36),inset 0 1px 0 rgba(215,240,221,.17);
  animation:recommendGlow 3s ease-in-out infinite;
}

<script>(() => {
  const key='keibaDisplayTheme';
  let theme='night';
  try {if(localStorage.getItem(key)==='day') theme='day'} catch (_) {}
  const apply=()=>{
    document.documentElement.dataset.displayTheme=theme;
    document.querySelectorAll('.theme-toggle').forEach(b=>{
      b.textContent=theme==='night'?'昼モード':'夜モード';
      b.setAttribute('aria-label',theme==='night'?'昼モードへ切替':'夜モードへ切替');
    });
  };
  apply();
  document.addEventListener('DOMContentLoaded',()=>{
    if(!document.querySelector('.theme-toggle')) {
      const parent=document.querySelector('.view-switch')||document.querySelector('.topbar');
      if(parent){const b=document.createElement('button');b.type='button';b.className='theme-toggle';parent.appendChild(b)}
    }
    document.querySelectorAll('.theme-toggle').forEach(b=>b.addEventListener('click',()=>{
      theme=theme==='night'?'day':'night';
      try{localStorage.setItem(key,theme)}catch(_){}
      apply();
    }));
    apply();
  });
})();
</script>
<script>// Display-only pull-to-refresh. Preserve the current page, date and race.
(() => {
  document.addEventListener('DOMContentLoaded', () => {
    const area = document.querySelector('.topbar');
    if (!area) return;
    let start = null, refreshing = false;
    function begin(x, y, target) {
      start = null;
      if (refreshing || window.scrollY > 8 || target.closest('button,a,select,input,label,summary')) return;
      start = {x, y, at: Date.now()};
    }
    function end(x, y) {
      const origin = start;
      start = null;
      if (!origin || refreshing) return;
      const dx = Math.abs(x - origin.x), dy = y - origin.y;
      if (dy < 90 || dy < dx * 1.5 || Date.now() - origin.at > 1800) return;
      refreshing = true;
      const hint = area.querySelector('.swipe-hint');
      if (hint) hint.textContent = '更新中…';
      const url = new URL(location.href);
      url.searchParams.set('v', Date.now());
      location.href = url.href;
    }
    area.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) { start = null; return; }
      const t = e.touches[0]; begin(t.clientX, t.clientY, e.target);
    }, {passive:true});
    document.addEventListener('touchend', e => {
      if (e.touches.length) { start = null; return; }
      const t = e.changedTouches[0]; if (t) end(t.clientX, t.clientY);
    }, {passive:true});
    document.addEventListener('touchcancel', () => {start = null;}, {passive:true});
    area.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'touch' && e.button === 0) begin(e.clientX, e.clientY, e.target);
    });
    document.addEventListener('pointerup', e => {
      if (e.pointerType !== 'touch') end(e.clientX, e.clientY);
    });
    document.addEventListener('pointercancel', () => {start = null;});
  }, {once:true});
})();
</script>

<script>
// Presentation only: aggregate the exact tickets, never create purchase tickets.
const TicketDisplay = (() => {
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const yen = value => `${Number(value).toLocaleString('ja-JP')}円`;
  const key = ns => ns.join('-');
  const canonical = (kind, ns) => ['3連複','馬連','ワイド'].includes(kind) ? [...ns].sort((a,b)=>a-b) : [...ns];
  const priority = (marks,n) => ({'◎':0,'◉':0,'○':1,'▲':2,'△1':3,'△2':4,'△3':5,'△4':6,'△5':7})[(String(marks[n]||'').match(/^(◎|◉|○|▲|△[1-5])/)||[])[1]] ?? 99;
  function expand(kind,groups) {
    const found=new Map();
    function visit(ns,col) {
      if(col===groups.length) {const result=canonical(kind,ns);found.set(key(result),result);return;}
      for(const n of groups[col]) if(!ns.includes(n)) visit([...ns,n],col+1);
    }
    visit([],0);
    return [...found.values()];
  }
  function groupFormation(kind,groups,marks) {
    const sorted=groups.map(g=>[...g].sort((a,b)=>priority(marks,a)-priority(marks,b)||a-b));
    const equal=(a,b)=>a.length===b.length && a.every(n=>b.includes(n));
    const fixed=sorted.map((g,i)=>g.length===1?i:-1).filter(i=>i>=0);
    if(kind==='3連複') {
      if(equal(sorted[0],sorted[1]) && equal(sorted[1],sorted[2]))
        return {label:`${sorted[0].length}頭BOX`,rows:[['対象',sorted[0]]]};
      if(fixed.length===1) {
        const others=sorted.filter((_,i)=>i!==fixed[0]);
        if(equal(others[0],others[1])) return {label:'1頭軸固定',rows:[['軸',sorted[fixed[0]]],['相手',others[0]]]};
      }
      if(fixed.length===2) {
        const axes=fixed.map(i=>sorted[i][0]).sort((a,b)=>priority(marks,a)-priority(marks,b)||a-b);
        return {label:'2頭軸固定',rows:[['軸',axes],['相手',sorted.find((_,i)=>!fixed.includes(i))]]};
      }
    }
    let label='フォーメーション';
    if(kind==='3連単' && fixed.length===2) label=fixed.map(i=>i+1).join('・')+'着固定';
    if(kind==='3連単' && sorted[0].length===2 && equal(sorted[0],sorted[2])) label='1・3着入替';
    return {label,rows:sorted.map((g,i)=>[['3連単','馬単'].includes(kind)?`${i+1}着`:`${i+1}列目`,g])};
  }

  // Keep the broad purchase formations. Pack supplements only when expansion
  // exactly fits the remaining tickets; this never changes the wager ledger.
  function formationSections(bets) {
    const result=[];
    for(const part of summarize(bets)) {
      const remaining=new Map(part.tickets.map(t=>[key(t.numbers),{numbers:t.numbers,stake:t.stake}]));
      const seen=new Set();
      function add(groups,unit,topup) {
        const numbers=expand(part.kind,groups);
        for(const ns of numbers) {
          const entry=remaining.get(key(ns));
          if(!entry || entry.stake<unit) throw Error('表示フォーメーションと購入金額が不一致です');
          entry.stake-=unit;seen.add(key(ns));
        }
        result.push({...part,groups:groups.map(g=>[...g]),tickets:numbers.map(ns=>({numbers:ns,stake:unit})),
          formation:groupFormation(part.kind,groups,part.marks),points:numbers.length,
          amount:numbers.length*unit,stakeText:`各${yen(unit)}`,topup,section:result.length});
      }
      for(const bet of bets.filter(b=>b.bet_type===part.kind)) {
        if(![2,3].includes(bet.groups?.length) || bet.groups.filter(g=>g.length>1).length<2) continue;
        const generated=expand(part.kind,bet.groups),original=new Set(bet.tickets.map(ns=>key(canonical(part.kind,ns))));
        if(generated.length!==original.size || !generated.every(ns=>original.has(key(ns)))) continue;
        if(!generated.every(ns=>remaining.get(key(ns))?.stake>=bet.unit_yen)) continue;
        // A partially overlapping row must be split so all duplicates are visible.
        if(generated.some(ns=>seen.has(key(ns))) && !generated.every(ns=>seen.has(key(ns)))) continue;
        add(bet.groups,Number(bet.unit_yen),generated.every(ns=>seen.has(key(ns))));
      }
      while([...remaining.values()].some(t=>t.stake>0)) {
        const positive=[...remaining.values()].filter(t=>t.stake>0);
        const unit=Math.min(...positive.map(t=>t.stake));
        for(const topup of [false,true]) {
          const available=new Set(positive.filter(t=>t.stake>=unit && seen.has(key(t.numbers))===topup).map(t=>key(t.numbers)));
          while(available.size) {
            const tuples=[...available].map(id=>remaining.get(id).numbers);
            const horses=[...new Set(tuples.flat())].sort((a,b)=>priority(part.marks,a)-priority(part.marks,b)||a-b);
            const fits=groups=>{
              const ts=expand(part.kind,groups);
              return ts.length && ts.every(ns=>available.has(key(ns)))?ts:[];
            };
            let best=null,bestTickets=[];
            for(const seed of tuples) {
              let groups=seed.map(n=>[n]),tickets=fits(groups);
              while(true) {
                let improved=null,larger=tickets;
                for(let col=0;col<groups.length;col++) for(const n of horses) {
                  if(groups[col].includes(n)) continue;
                  const trial=groups.map((g,i)=>i===col?[...g,n]:[...g]);
                  const ts=fits(trial);
                  if(ts.length>larger.length) {improved=trial;larger=ts;}
                }
                if(!improved) break;
                groups=improved;tickets=larger;
              }
              if(tickets.length>bestTickets.length) {best=groups;bestTickets=tickets;}
            }
            add(best,unit,topup);
            bestTickets.forEach(ns=>available.delete(key(ns)));
          }
        }
      }
    }
    return result;
  }
  function summarize(bets) {
    const kinds = new Map();
    for (const bet of bets || []) {
      if (!kinds.has(bet.bet_type)) kinds.set(bet.bet_type, {kind:bet.bet_type, tickets:new Map(), marks:{}, names:{},frames:{}});
      const part = kinds.get(bet.bet_type);
      Object.assign(part.marks, bet.horse_marks || {}); Object.assign(part.names, bet.horse_names || {});
      Object.assign(part.frames,bet.horse_frames || {});
      for (const raw of bet.tickets || []) {
        const numbers = canonical(bet.bet_type, raw.map(Number));
        const id = key(numbers), old = part.tickets.get(id);
        part.tickets.set(id, {numbers, stake:(old?.stake || 0)+Number(bet.unit_yen)});
      }
    }
    return [...kinds.values()].map(part => {
      part.tickets = [...part.tickets.values()];
      part.points = part.tickets.length;
      part.amount = part.tickets.reduce((sum,t)=>sum+t.stake,0);
      part.formation = formation(part.kind, part.tickets.map(t=>t.numbers));
      const stakes = [...new Set(part.tickets.map(t=>t.stake))].sort((a,b)=>a-b);
      part.stakes = stakes;
      part.stakeText = stakes.length === 1 ? `各${yen(stakes[0])}` :
        `基本${yen(stakes[0])}・` + stakes.slice(1).map(stake=>`重点${part.tickets.filter(t=>t.stake===stake).length}組は${yen(stake)}`).join('・');
      return part;
    });
  }
  function formation(kind, tickets) {
    const all = [...new Set(tickets.flat())].sort((a,b)=>a-b);
    const actual = new Set(tickets.map(ns=>key(canonical(kind,ns))));
    const matches = groups => {
      const found = new Set(expand(kind,groups).map(key));
      return found.size===actual.size && [...found].every(id=>actual.has(id));
    };
    if (kind === '3連複') {
      if (matches([all,all,all])) return {label:`${all.length}頭BOX`, rows:[['対象',all]]};
      const axes = all.filter(n=>tickets.every(ns=>ns.includes(n)));
      const rest = all.filter(n=>!axes.includes(n));

// ★ WIN5対象レースを日付から抽出（payloadの win5_target を参照）
function getWin5TargetsForDate(dateStr) {
  const out = [];
  const d = String(dateStr || "").trim();

  // ★ payload構造に合わせる：DATA.races[date]
  const day = (DATA && DATA.races && DATA.races[d]) ? DATA.races[d] : null;
  if (!day) return out;

  const raceKey = (x) => {
    const m = String(x || "").match(/\d+/);
    return m ? parseInt(m[0], 10) : 999;
  };

  for (const track of Object.keys(day)) {
    const races = day[track] || {};
    for (const rno of Object.keys(races)) {
      const obj = races[rno] || {};
      if (obj && obj.win5_target) {
        out.push({ track, rno, race_name: obj.race_name || "" });
      }
    }
  }

  // 走る順：競馬場名→R番号（"11R" なども数値化して安定化）
  out.sort((a,b) => {
    if (a.track !== b.track) return String(a.track).localeCompare(String(b.track), "ja");
    return raceKey(a.rno) - raceKey(b.rno);
  });
  return out;
}

// ★ date/track/race を指定して移動（selectのoption生成待ちを含む）
function gotoRaceBySelect(dateStr, trackStr, rnoStr) {
  const ds = el("dateSel");
  const ts = el("trackSel");
  const rs = el("raceSel");
  if (!ds || !ts || !rs) return;

  const d = String(dateStr || "").trim();
  const t = String(trackStr || "").trim();
  const r = String(rnoStr || "").trim();

  if (d) {
    ds.value = d;
    ds.dispatchEvent(new Event("change"));
  }

  let tries = 0;
  const timer = setInterval(() => {
    tries++;

    if (t && ts.options && ts.options.length > 0) {
      ts.value = t;
      ts.dispatchEvent(new Event("change"));
    }

    if (r && rs.options && rs.options.length > 0) {
      rs.value = r;
      rs.dispatchEvent(new Event("change"));
      clearInterval(timer);
    }

    if (tries > 40) {
      clearInterval(timer);
    }
  }, 120);
}

// ★ 同日付のWIN5先頭へジャンプ（R番号優先でソート）
function jumpToWin5FirstForDate(dateStr) {
  const d = String(dateStr || "").trim();
  const targets0 = getWin5TargetsForDate(d);

  if (!targets0 || targets0.length === 0) {
    alert("WIN5が開催されていません");
    return;
  }

  const raceKey = (x) => {
    const m = String(x || "").match(/\d+/);
    return m ? parseInt(m[0], 10) : 999;
  };

  const targets = targets0.slice().sort((a,b) => {
    const ra = raceKey(a.rno);
    const rb = raceKey(b.rno);
    if (ra !== rb) return ra - rb;
    return String(a.track).localeCompare(String(b.track), "ja");
  });

  const first = targets[0];

  // ★ option.value と一致させるため、rno は数値化せず「キー文字列のまま」渡す
  gotoRaceBySelect(d, first.track, String(first.rno));
}

window.addEventListener("DOMContentLoaded", () => {
  // ★ Topから「同日付WIN5へ」(localStorage.keiba_nav) 指定があれば自動ジャンプ
  let navRaw = "";
  try {
    navRaw = localStorage.getItem("keiba_nav") || "";
  } catch (e) {
    navRaw = "";
  }

  if (navRaw) {
    let nav = null;
    try {
      nav = JSON.parse(navRaw);
    } catch (e) {
      nav = null;
    }

    try {
      localStorage.removeItem("keiba_nav");
    } catch (e) {}

    if (nav) {
      const mode = String(nav.mode || "").trim().toLowerCase();
      const d = String(nav.date || "").trim();
      if (mode === "win5" && d) {
        // dateSel の option が入るまで待ってから移動
        let tries = 0;
        const t = setInterval(() => {
          tries++;
          const ds = el("dateSel");
          if (ds && ds.options && ds.options.length > 0) {
            clearInterval(t);
            jumpToWin5FirstForDate(d);
          }
          if (tries > 40) clearInterval(t);
        }, 120);
      }
    }
  }

  // ★ 馬群ボタン文言：表示/非表示へ同期（既存toggleの中身は維持）
  const syncPack4CBtnLabel = () => {
    const btn = el("pack4cBtn");
    const wrap = el("pack4cWrap");
    if (!btn || !wrap) return;

    const isOn = (wrap.style.display !== "none");
    btn.textContent = isOn ? "馬群非表示" : "馬群表示";
  };

  // 初期ラベル
  syncPack4CBtnLabel();

  // togglePack4CScatter が定義された後にフックして、押下後もラベル追従
  let hookTries = 0;
  const hookTimer = setInterval(() => {
    hookTries++;
    if (window.__pack4c_hooked) {
      clearInterval(hookTimer);
      return;
    }
    if (typeof window.togglePack4CScatter === "function") {
      const orig = window.togglePack4CScatter;
      window.togglePack4CScatter = function() {
        orig();
        syncPack4CBtnLabel();
      };
      window.__pack4c_hooked = true;
      clearInterval(hookTimer);
    }
    if (hookTries > 40) clearInterval(hookTimer);
  }, 120);
});

function wakuClass(w) {
  const n = parseInt(w || "", 10);
  if (!n || n < 1 || n > 8) return "";
  return "waku-" + n;
}

// ★ 枠番 → 枠色（waku-1..8 と同じ）
//   ※ viewer 側の .waku-* 定義に合わせる
function wakuHex(w) {
  const n = parseInt(w || "", 10);
  if (!n || n < 1 || n > 8) return "";
  const mp = {
    1: "#ffffff",
    2: "#2b2b2b",
    3: "#c65a5a",
    4: "#4f7db8",
    5: "#b99a00",
    6: "#2f8f5a",
    7: "#c97a2a",
    8: "#c46ab0",
  };
  return mp[n] || "";
}

function hexToRgb(hex) {
  const s = String(hex || "").trim().replace("#", "");
  if (s.length !== 6) return null;
  const r = parseInt(s.slice(0, 2), 16);
  const g = parseInt(s.slice(2, 4), 16);
  const b = parseInt(s.slice(4, 6), 16);
  if ([r,g,b].some(v => Number.isNaN(v))) return null;
  return { r, g, b };
}

// ★ バナー（凄馬/乗替）に “枠色shine” を注入
function applyWakuGlowToBanner(box, wakuNo) {
  if (!box) return;

  const hex = wakuHex(wakuNo);
  const rgb = hex ? hexToRgb(hex) : null;

  if (!rgb) {
    // 前レースの色が残るのを防ぐ
    box.style.removeProperty("--shine-rgb");
    box.style.removeProperty("border-color");
    box.style.removeProperty("background");
    box.style.removeProperty("text-shadow");
    box.style.removeProperty("box-shadow");
    return;
  }

  const r = rgb.r, g = rgb.g, b = rgb.b;

  // Shine（::before）用
  box.style.setProperty("--shine-rgb", r + "," + g + "," + b);

  // バナー枠/背景/発光も同じ色へ寄せる
  box.style.borderColor = "rgba(" + r + "," + g + "," + b + ",0.78)";
  box.style.background = "rgba(" + r + "," + g + "," + b + ",0.18)";
  box.style.textShadow = "0 0 14px rgba(" + r + "," + g + "," + b + ",0.65)";
  box.style.boxShadow =
    "0 0 0 1px rgba(" + r + "," + g + "," + b + ",0.22) inset, " +
    "0 0 26px rgba(" + r + "," + g + "," + b + ",0.46), var(--shadow2)";
}

function markClass(mark) {
  const m = String(mark || "").trim();
  if (m.includes("◎") || m.includes("◉")) return "hmark-ss";
  if (m.includes("○")) return "hmark-s";
  if (m.includes("▲")) return "hmark-m";
  return "hmark-w";
}

function markRank(mark) {
  const m = String(mark || "").trim();
  const getNum = () => {
    const mm = m.match(/\d+/);
    return mm ? parseInt(mm[0], 10) : 0;
  };

  if (m.includes("◉")) return [1, 0];
  if (m.includes("◎")) return [1, 1];
  if (m.includes("○")) return [2, 0];
  if (m.includes("▲")) return [3, 0];
  if (m.includes("△")) return [4, getNum()];
  if (m.includes("☆")) return [5, getNum()];
  if (m.includes("注")) return [6, getNum()];
  return [99, 0];
}

// ★ ABC予測（A,B,C...）を順位化：A=1, B=2 ... / 無効は 999
function abcRank(v) {
  const s = String(v || "").trim().toUpperCase();
  if (!s) return 999;
  const m = s.match(/[A-Z]/);
  if (!m) return 999;
  return (m[0].charCodeAt(0) - "A".charCodeAt(0)) + 1;
}


function numOrBig(x) {
  const n = (x === null || x === undefined || x === "") ? null : Number(x);
  if (n === null || Number.isNaN(n)) return 999999;
  return n;
}

function numOrNegBig(x) {
  const n = (x === null || x === undefined || x === "") ? null : Number(x);
  if (n === null || Number.isNaN(n)) return -999999;
  return n;
}

function sortRows(rows, mode) {
  const arr = (rows || []).slice();

  if (mode === "score") {
    arr.sort((a,b) => {
      const sa = numOrNegBig(a.__score_n);
      const sb = numOrNegBig(b.__score_n);
      if (sa !== sb) return sb - sa;

      const [ra, xa] = markRank(a["予想印"]);
      const [rb, xb] = markRank(b["予想印"]);
      if (ra !== rb) return ra - rb;
      if (xa !== xb) return xa - xb;

      const na = numOrBig(a.__ninki_n);
      const nb = numOrBig(b.__ninki_n);
      if (na !== nb) return na - nb;

      return numOrBig(a.__umaban_n) - numOrBig(b.__umaban_n);
    });
    return arr;
  }

  if (mode === "mark") {
    arr.sort((a,b) => {
      // ★ 最優先：ABC予測のアルファベット順（A,B,C...）
      const aa = abcRank(a["ABC予測"]);
      const ab = abcRank(b["ABC予測"]);
      if (aa !== ab) return aa - ab;

      // ★ 次点：印（互換・ABC予測が無いデータでも安定させる）
      const [ra, sa] = markRank(a["予想印"]);
      const [rb, sb] = markRank(b["予想印"]);
      if (ra !== rb) return ra - rb;
      if (sa !== sb) return sa - sb;

      // ★ 以降は従来どおり
      const sca = numOrNegBig(a.__score_n);
      const scb = numOrNegBig(b.__score_n);
      if (sca !== scb) return scb - sca;

      const na = numOrBig(a.__ninki_n);
      const nb = numOrBig(b.__ninki_n);
      if (na !== nb) return na - nb;

      return numOrBig(a.__umaban_n) - numOrBig(b.__umaban_n);
    });
    return arr;
  }

  if (mode === "shisu") {
    arr.sort((a,b) => {
      const [ra, sa] = markRank(a["指数印"]);
      const [rb, sb] = markRank(b["指数印"]);
      if (ra !== rb) return ra - rb;
      if (sa !== sb) return sa - sb;
      const na = numOrBig(a.__ninki_n);
      const nb = numOrBig(b.__ninki_n);
      if (na !== nb) return na - nb;
      return numOrBig(a.__umaban_n) - numOrBig(b.__umaban_n);
    });
    return arr;
  }

  if (mode === "ml") {
    arr.sort((a,b) => {
      const [ra, sa] = markRank(a["ML印"]);
      const [rb, sb] = markRank(b["ML印"]);
      if (ra !== rb) return ra - rb;
      if (sa !== sb) return sa - sb;
      const na = numOrBig(a.__ninki_n);
      const nb = numOrBig(b.__ninki_n);
      if (na !== nb) return na - nb;
      return numOrBig(a.__umaban_n) - numOrBig(b.__umaban_n);
    });
    return arr;
  }

  if (mode === "ninki") {
    arr.sort((a,b) => {
      const da = numOrBig(a.__ninki_n);
      const db = numOrBig(b.__ninki_n);
      if (da !== db) return da - db;
      const [ra, sa] = markRank(a["予想印"]);
      const [rb, sb] = markRank(b["予想印"]);
      if (ra !== rb) return ra - rb;
      if (sa !== sb) return sa - sb;
      return numOrBig(a.__umaban_n) - numOrBig(b.__umaban_n);
    });
    return arr;
  }

  if (mode === "umaban") {
    arr.sort((a,b) => numOrBig(a.__umaban_n) - numOrBig(b.__umaban_n));
    return arr;
  }

  if (mode === "result") {
    arr.sort((a,b) => {
      const da = numOrBig(a.__result_n);
      const db = numOrBig(b.__result_n);
      if (da !== db) return da - db;
      const na = numOrBig(a.__ninki_n);
      const nb = numOrBig(b.__ninki_n);
      if (na !== nb) return na - nb;
      return numOrBig(a.__umaban_n) - numOrBig(b.__umaban_n);
    });
    return arr;
  }

  if (mode === "uindex") {
    arr.sort((a,b) => {
      const da = numOrNegBig(a.__uindex_n);
      const db = numOrNegBig(b.__uindex_n);
      if (da !== db) return db - da;
      const na = numOrBig(a.__ninki_n);
      const nb = numOrBig(b.__ninki_n);
      if (na !== nb) return na - nb;
      return numOrBig(a.__umaban_n) - numOrBig(b.__umaban_n);
    });
    return arr;
  }

  return arr;
}


function escapeHtml(s) {
  const v = (s === null || s === undefined) ? "" : s;
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function babaChipClass(v) {
  const s = String(v || "");
  if (s.includes("ダ") || s.includes("ダート")) return "baba-dirt";
  if (s.includes("芝")) return "baba-turf";
  if (s.includes("障") || s.includes("障害")) return "baba-jump";
  return "";
}

function rankChipClass(v) {
  const s0 = String(v || "").trim();
  const s = s0.toUpperCase();
  if (s.startsWith("S")) return "rank-s";
  if (s.startsWith("A")) return "rank-a";
  if (s.startsWith("NG") || s.includes("NG")) return "rank-ng";
  return "";
}

function labelForMetaKey(k) {
  if (k === "抜け判定(採用)") return "指数比較";
  if (k === "おすすめランク(採用)") return "おすすめ";
  if (k === "買い判定") return "買い";
  if (k === "表示区分") return "最新判定";
  if (k === "買い理由") return "理由";
  return k;
}

function sugoumaKind(v) {
  const s0 = String(v || "").trim();
  if (!s0) return "";
  const s = s0.replace(/\s+/g, "");
  if (s.includes("絶")) return "zetsu";
  if (s.includes("極")) return "goku";
  if (s.includes("超ちょう") || (s.includes("超") && s.includes("ちょう")) || s.includes("超超")) return "chocho";
  if (s.includes("超")) return "cho";
  if (s.includes("凄馬")) return "sugo";
  return "sugo";
}

function sugoumaClass(kind) {
  if (!kind) return "";
  if (kind === "zetsu") return "sg-zetsu";
  if (kind === "goku") return "sg-goku";
  if (kind === "chocho") return "sg-chocho";
  if (kind === "cho") return "sg-cho";
  if (kind === "sugo") return "sg-sugo";
  return "sg-sugo";
}

function renderSugoumaFlag(sug) {
  const box = el("sugoumaFlag");
  if (!box) return;

  const on = !!(sug && sug.on);
  box.className = "sugouma-flag";
  box.textContent = "";
  if (!on) {
    applyWakuGlowToBanner(box, "");
    box.style.display = "none";
    return;
  }

  const kind = String(sug.kind || "");
  const cls = sugoumaClass(kind);

  // ★ 末尾の「/1頭」「／1頭」「/1とう」「／1とう」は表示しない（全角1も吸収）
  const label = String(sug.label || "凄馬").replace(/[\/／]\s*[1１]\s*(?:頭|とう)\s*$/g, "");

  // ★ 凄馬（馬番 馬名）を並べる：頭数は表示しない（乗替推奨と同じ）
  const rows = (currentRaceObj && currentRaceObj.rows) ? (currentRaceObj.rows || []) : [];
  const picks = rows.filter(x => x && String(x.__sugouma || "").trim());
  const names = picks
    .map(x => {
      const u = (x && x["馬番"]) ? String(x["馬番"]).trim() : "";
      const n = (x && x["馬名"]) ? String(x["馬名"]).trim() : "";
      return (u && n) ? (u + " " + n) : (u + n);
    })
    .filter(Boolean)
    .join(" / ");

  // ★ 先頭の凄馬馬の枠色で光らせる（無ければ解除）
  const wakuNo = (picks && picks[0]) ? (picks[0]["__枠番"] || "") : "";
  applyWakuGlowToBanner(box, wakuNo);

  box.classList.add("on");
  if (cls) box.classList.add(cls);
  box.textContent = "凄馬" + (label ? ("（" + label + "）") : "") + (names ? ("　" + names) : "");
  box.style.display = "block";
}

function renderNorikaeFlag(obj) {
  const box = el("norikaeFlag");
  if (!box) return;

  // ★ 凄馬バナーと同じ基盤に戻して「消える」問題を回避
  box.className = "sugouma-flag norikae-flag";
  box.textContent = "";

  const rows = (obj && obj.rows) ? (obj.rows || []) : [];

  }

  const names = picks
    .map(x => {
      const u = (x && x["馬番"]) ? String(x["馬番"]).trim() : "";
      const n = (x && x["馬名"]) ? String(x["馬名"]).trim() : "";
      return (u && n) ? (u + " " + n) : (u + n);
    })
    .filter(Boolean)
    .join(" / ");

  // ★ 先頭の乗替馬の枠色で光らせる
  const wakuNo = (picks && picks[0]) ? (picks[0]["__枠番"] || "") : "";
  applyWakuGlowToBanner(box, wakuNo);

  box.classList.add("on");
  box.classList.add("nk-on");
  box.textContent = "乗換" + (names ? ("　" + names) : "");

}

function renderMeta(infoObj) {

  reason.appendChild(detail);

  conditions.className = "meta-conditions";

  conditions.textContent = [course, infoObj["馬場状態"], infoObj["クラス"]].filter(Boolean).join(" · ");

    const track = el("trackSel") ? el("trackSel").value : "";

    const isRight = !!(turn && turn.dir === "右");
    const isStraight = track === "新潟" && Number(infoObj["距離(m)"]) === 1000 && String(infoObj["馬場"] || "").includes("芝");
    const line = document.createElement("div");
    line.className = "meta-wind-line";
    line.textContent = "風予報 · " + (wind.text || "");
    box.appendChild(line);
    if (wind.relative_degrees !== null && wind.relative_degrees !== undefined && Number.isFinite(Number(wind.relative_degrees))) {
      const angle = (Number(wind.relative_degrees) + (isRight && !isStraight ? 180 : 0)) * Math.PI / 180;
      const dx = Math.cos(angle) * 31;
      const dy = Math.sin(angle) * 31;
      const from = isRight && !isStraight ? 252 : 40;
      const to = isRight && !isStraight ? 40 : 252;
      const courseLabel = track + " · " + (isStraight ? "直線コース" : (isRight ? "右回り ↷" : "左回り ↶"));
      const diagram = document.createElement("div");
      diagram.className = "meta-wind-diagram";
      diagram.innerHTML = '<svg viewBox="0 0 292 98" role="img" aria-label="' + escapeHtml(courseLabel + '。青は直線の進行、緑は風。' + (wind.home_stretch || '')) + '">' +
        '<defs><marker id="straightArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="wind-straight-head" d="M0,0 L7,3.5 L0,7 Z"/></marker>' +
        '<marker id="windArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="wind-flow-head" d="M0,0 L7,3.5 L0,7 Z"/></marker></defs>' +
        '<text x="10" y="15" class="wind-course-label">' + escapeHtml(courseLabel) + '</text>' +
        '<line x1="' + from + '" y1="55" x2="' + to + '" y2="55" class="wind-straight-vector" marker-end="url(#straightArrow)"/>' +
        '<line x1="' + (146-dx).toFixed(1) + '" y1="' + (55-dy).toFixed(1) + '" x2="' + (146+dx).toFixed(1) + '" y2="' + (55+dy).toFixed(1) + '" class="wind-flow-vector" marker-end="url(#windArrow)"/>' +
        '<text x="10" y="94" class="wind-legend">青：直線の進行　緑：風</text></svg>';
      box.appendChild(diagram);
    } else if (wind.arrow) {
      const compass = document.createElement("div");
      compass.className = "meta-wind-segments";
      compass.textContent = wind.arrow + "（北が上）";
      box.appendChild(compass);
    }
    const segments = document.createElement("div");
    segments.className = "meta-wind-segments";
    segments.textContent = [wind.fourth_corner && "4角：" + wind.fourth_corner,
      wind.home_stretch && "直線：" + wind.home_stretch].filter(Boolean).join(" · ");
    if (segments.textContent) box.appendChild(segments);
    meta.appendChild(box);
  }
}

let currentRaceObj = null;

// =========================
// 馬群予測(4C) Scatter
//  - 縦: 4C位置予測（0=先頭）を 0.5刻み（表示レンジ 0..max+1）
//  - 横: 4C内外予測（1=内）を 1..max
//  - 右回りは“内=右寄り”にするため横を反転（判定は pack4cDir の文字列）
// =========================
function togglePack4CScatter() {
  const btn = el("pack4cBtn");
  const wrap = el("pack4cWrap");
  if (!btn || !wrap) return;

  const isOn = (wrap.style.display !== "none");
  if (isOn) {
    wrap.style.display = "none";
    btn.textContent = "表示";
    return;
  }

  wrap.style.display = "block";
  btn.textContent = "折り畳む";

  renderPack4CScatter(currentRaceObj);
}

function renderPack4CScatter(obj) {
  const grid = el("pack4cGrid");
  const dirEl = el("pack4cDir");
  const titleEl = el("pack4cTitle");
  if (!grid) return;

  grid.innerHTML = "";

  // スマホは専用の馬群ボードを使い、PC用散布図の縮小は行わない。
  const wrapEl = el("pack4cWrap");
  const isMobileFit =
    (window.matchMedia && window.matchMedia("(max-width: 520px)").matches) || isMobile();
  if (dirEl) dirEl.style.display = isMobileFit ? "none" : "";

  // いったん前回のtransformを解除（レース切替/再描画で残るのを防ぐ）
  grid.style.transform = "";
  grid.style.transformOrigin = "";
  grid.style.width = "";

  const rows0 = (obj && obj.rows) ? (obj.rows || []) : [];

  // ★ 画面側（renderRowsに渡した並び＝スマホで正しい方）をそのまま使う
  //   ※renderPack4C() 側で obj.rows を _currentSortedRows に差し替え済み
  const rows = rows0.slice();

  if (!rows || rows.length === 0) {
    grid.innerHTML = '<div class="pack4c-note">4C予測データがありません</div>';
    return;
  }

  const getNum = (r, key) => {
    const v = (r && (r[key] !== undefined)) ? r[key] : "";
    const n = Number(String(v || "").trim());
    return Number.isNaN(n) ? null : n;
  };

  // ★ 軸を入れ替え：
  //   横(x)=4C位置予測（0..最大+1）
  //   縦(y)=4C内外予測（1..最大）
  const pts0 = [];
  for (const r of rows) {
    // ★ 指定：X=4C位置予測 / Y=4C内外予測
    //   - 可能なら Python 側で作った数値（__4cpos_n）を優先して使う
    const x = (r && (r["__4cpos_n"] !== undefined) && (r["__4cpos_n"] !== null))
      ? Number(r["__4cpos_n"])
      : getNum(r, "4C位置予測");

    const lane3 = (yy) => {
      if (yy === null) return null;
      if (yy <= 3) return 1;
      if (yy <= 5) return 2;
      return 3;
    };
    const y = lane3(getNum(r, "4C内外予測"));

    const umaban = (r && r["馬番"] !== undefined) ? String(r["馬番"]).trim() : "";
    if (x === null || y === null || !umaban) continue;

    // ★ 表示用（枠色/発光判定）に必要な情報も保持
    const wakuNo = (r && r["__枠番"] !== undefined) ? String(r["__枠番"]).trim() : "";
    const mark = String((r && r["予想印"] !== undefined) ? r["予想印"] : "").trim();
    const isSugo = !!String(r.__sugouma || "").trim();
    const isNori = !!r.__norikae;

    pts0.push({ umaban, x, y, wakuNo, mark, isSugo, isNori });
  }

  if (pts0.length === 0) {
    grid.innerHTML = '<div class="pack4c-note">4C位置予測 / 4C内外予測 の数値が見つかりません</div>';
    return;
  }

  if (isMobileFit) {
    const board = document.createElement("div");
    board.className = "pack4c-mobile-board";

    const head = document.createElement("div");
    head.className = "pack4c-mobile-head";
    for (const label of ["・", "先頭", "好位", "中団", "後方"]) {
      const h = document.createElement("div");
      h.textContent = label;
      head.appendChild(h);
    }
    board.appendChild(head);

    const bandOf = (x) => (x <= 3 ? 0 : (x <= 6 ? 1 : (x <= 9 ? 2 : 3)));
    for (const lane of [1, 2, 3]) {
      const laneRow = document.createElement("div");
      laneRow.className = "pack4c-mobile-lane";
      const laneLabel = document.createElement("div");
      laneLabel.className = "pack4c-mobile-lane-label";
      laneLabel.textContent = ["内", "中", "外"][lane - 1];
      laneRow.appendChild(laneLabel);

      for (let band = 0; band < 4; band++) {
        const cell = document.createElement("div");
        cell.className = "pack4c-mobile-cell";
        pts0
          .filter(p => p.y === lane && bandOf(p.x) === band)
          .sort((a, b) => a.x - b.x || Number(a.umaban) - Number(b.umaban))
          .forEach(p => {
            const ball = document.createElement("span");
            ball.className = "pack4c-mobile-ball";
            if (/[◉◎○▲]/.test(String(p.mark || "")) || p.isSugo || p.isNori) ball.classList.add("is-key");
            ball.textContent = p.umaban;
            const hx = wakuHex(p.wakuNo);
            ball.style.backgroundColor = hx || "#374151";
            ball.style.color = String(p.wakuNo || "") === "1" ? "#111" : "#fff";
            cell.appendChild(ball);
          });
        laneRow.appendChild(cell);
      }
      board.appendChild(laneRow);
    }

    const caption = document.createElement("div");
    caption.className = "pack4c-mobile-caption";
    caption.textContent = "数字は馬番 · 金枠は上位印・注目馬";
    board.appendChild(caption);
    grid.appendChild(board);
    if (titleEl) titleEl.textContent = "4コーナー馬群予測";
    return;
  }
  ensurePack4CGlowStyles();

  let maxXRaw = -Infinity;
  let maxYRaw = -Infinity;
  let minYRaw = +Infinity;

  for (const p of pts0) {
    if (p.x > maxXRaw) maxXRaw = p.x;
    if (p.y > maxYRaw) maxYRaw = p.y;
    if (p.y < minYRaw) minYRaw = p.y;
  }

  if (titleEl) {
    titleEl.textContent = "4コーナー馬群予測";
  }

  // ★ 指定レンジ（固定）
  //   Y: 0..5 / X: 0..20 / 目盛りは 1 刻み（表示だけの都合で固定）
  const xMinShow = -3;
  const xMaxShow = 18;

  const yMinShow = 1;
  const yMaxShow = 3;

  const xRange = Math.max(1e-9, (xMaxShow - xMinShow));
  const yRange = Math.max(1e-9, (yMaxShow - yMinShow));

  // ★ 縦圧縮（1.0=圧縮なし、0.7前後が「詰まる」）
  const yCompress = 0.5;

  // ★ 既存CSS座標系（0=上、100=下）でのY位置（%）
  const yToPct = (yy) => {
    const base = ((yy - yMinShow) / yRange) * 100;
    const pad = (100 * (1 - yCompress)) / 2;
    return base * yCompress + pad;
  };

  // ★ 左回り（東京など）は X を左右反転（見た目の進行方向に合わせる）
  const track = el("trackSel") ? el("trackSel").value : "";
  const ti = turnInfoForTrack(track);

  const xPlot = (x) => {
    const xx0 = Math.max(xMinShow, Math.min(xMaxShow, x));

    if (ti && ti.dir === "左") {
      // ミラー：0..20 の中で左右反転
      return xMaxShow - (xx0 - xMinShow);
    }
    return xx0;
  };

  // ★ 背景（芝=薄緑 / ダ=薄茶 / 障=薄水色）
  const raceInfo = (obj && obj.race_info) ? (obj.race_info || {}) : {};
  const baba = String(raceInfo["馬場"] || "");
  const bgColor = (() => {
    if (baba.includes("ダ") || baba.includes("ダート")) return "rgba(160, 110, 60, 0.14)";
    if (baba.includes("障") || baba.includes("障害")) return "rgba(90, 190, 255, 0.14)";
    if (baba.includes("芝")) return "rgba(90, 210, 120, 0.14)";
    return "rgba(255,255,255,0.04)";
  })();

  // --- layout skeleton ---
  const wrap = document.createElement("div");
  wrap.className = "pack4c-scatter";

  const yAxis = document.createElement("div");
  yAxis.className = "pack4c-yaxis";

  const plot = document.createElement("div");
  plot.className = "pack4c-plot";
  plot.style.background = bgColor;

  // ★ 凡例（進行方向）は「ピル側」に出す（グラフ内には入れない）
  plot.style.position = "relative";

  const xAxis = document.createElement("div");
  xAxis.className = "pack4c-xaxis";

  wrap.appendChild(yAxis);
  wrap.appendChild(plot);
  wrap.appendChild(document.createElement("div")); // 左下空白
  wrap.appendChild(xAxis);

  grid.appendChild(wrap);

  // --- y ticks（整数：1.. / + 下端に0.8） ---
  const addYTick = (yy, label) => {
    // ★ 既存CSSの座標系に合わせる（0=上、100=下）＋縦圧縮
    const topPct = yToPct(yy);

    const line = document.createElement("div");
    line.className = "pack4c-y-tick";
    line.style.top = topPct + "%";
    plot.appendChild(line);

    // ★ Y軸ラベル（数値）は表示しない
  };

  addYTick(yMinShow, "0.8");
  for (let y = 1; y <= Math.ceil(yMaxShow + 1e-9); y++) {
    if (y < yMinShow - 1e-9) continue;
    if (y > yMaxShow + 1e-9) continue;
    addYTick(y, String(y));
  }

  // --- x ticks（整数：0..xMaxShow） ---
  for (let x = xMinShow; x <= xMaxShow; x++) {
    const leftPct = ((x - xMinShow) / xRange) * 100;

    const line = document.createElement("div");
    line.className = "pack4c-x-tick";
    line.style.left = leftPct + "%";
    plot.appendChild(line);

    // ★ X軸ラベル（数値）は表示しない
  }

  // --- points（重なりは少しズラす） ---
  const bucket = new Map();
  const keyOf = (xp, yp) => String(xp) + "|" + String(yp);

  const glowTheme = (p) => {
    if (p.isSugo || p.isNori) return { rgb: "255,95,95" };
    const m = String(p.mark || "").trim();
    if (m.includes("◉") || m.includes("◎")) return { rgb: "255,211,77" };
    if (m.includes("○"))                 return { rgb: "210,220,235" };
    if (m.includes("▲"))                 return { rgb: "205,140,70" };
    return null; // ★ △以下は発光しない
  };

  for (let i = 0; i < pts0.length; i++) {
    const p = pts0[i];

    const xp = xPlot(p.x);
    const yp = Math.max(yMinShow, Math.min(yMaxShow, p.y));

    const k = keyOf(xp, yp);
    const idx = bucket.has(k) ? bucket.get(k) : 0;
    bucket.set(k, idx + 1);

    const leftPct = ((xp - xMinShow) / xRange) * 100;
    // ★ 既存CSSの座標系に合わせる（0=上、100=下）＋縦圧縮
    const topPct  = yToPct(yp);

    const node = document.createElement("span");
    // ★ pack4c-dot を付けて absolute 配置（既存CSS）を復活
    node.className = "pack4c-horse pack4c-dot pack4c-ball";
    node.textContent = p.umaban;

    // ★ 安定：強い馬ほど“上”に出す（rows を score desc で作っているので i=0 が最上位）
    node.style.zIndex = String(10000 + (pts0.length - i));

    // ★ 馬番は枠色
    const hx = wakuHex(p.wakuNo);
    if (hx) {
      node.style.backgroundColor = hx;
      node.style.color = (String(p.wakuNo || "") === "1") ? "#111" : "#fff";
    } else {
      node.style.backgroundColor = "rgba(255,255,255,0.10)";
      node.style.color = "#fff";
    }

    // ★ 発光（◎○▲/凄馬/乗替推奨）
    const th = glowTheme(p);
    if (th && th.rgb) {
      node.classList.add("pack4c-pulse");
      node.style.setProperty("--glow-rgb", th.rgb);
      node.style.textShadow = "0 0 12px rgba(" + th.rgb + ",0.28), 0 1px 0 rgba(0,0,0,0.35)";
    }

    // collision offset
    const dx = (idx % 3 - 1) * 14;                 // -14,0,+14...
    const dy = (Math.floor(idx / 3)) * 12;         // 0,12,24...
    node.style.left = leftPct + "%";
    node.style.top  = topPct + "%";
    node.style.transform = "translate(-50%, -50%) translate(" + dx + "px," + dy + "px)";

    plot.appendChild(node);
  }
}

function openRecommendModal() {
  ensureRecModal();

  const m = el("recModal");
  const titleEl = el("recModalTitle");
  const bodyEl = el("recModalBody");
  if (!m || !titleEl || !bodyEl) return;

  const obj = currentRaceObj;
  const pats = (obj && obj.recommend_patterns) ? (obj.recommend_patterns || []) : [];

  const raceName = (obj && obj.race_name) ? String(obj.race_name) : "";
  titleEl.textContent = "推奨買い目" + (raceName ? ("  " + raceName) : "");

  bodyEl.innerHTML = "";

  if (obj && obj.native_bets && obj.native_bets.length) {
    bodyEl.innerHTML = TicketDisplay.render(obj.native_bets,{formations:!!obj.native_bet_formations});
    m.style.display = "block";
    return;
  }

  if (!pats || pats.length === 0) {
    const msg = document.createElement("div");
    msg.style.cssText =
      "border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.06);" +
      "border-radius:14px; padding:12px; color:rgba(233,237,245,0.92); font-weight:800; line-height:1.5;";
    msg.textContent = "このレースの推奨買い目が見つかりませんでした（3連単12点/優先プランCSVに該当 _race_id が無い可能性があります）";
    bodyEl.appendChild(msg);
    m.style.display = "block";
    return;
  }

  // --- A,B,C... を「スコア順の馬番」に変換する ---
  const buildLetterMapFromScoreOrder = (raceObj) => {
    const mp = {};
    if (!raceObj || !raceObj.rows) return mp;

    // 常に「スコア順」を基準にする（画面のソート設定には依存しない）
    const sorted = sortRows((raceObj.rows || []).slice(), "score");
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    for (let i = 0; i < sorted.length && i < letters.length; i++) {
      const key = letters[i];
      const umaban = String(sorted[i]["馬番"] || "").trim();
      if (umaban) mp[key] = umaban;
    }
    return mp;
  };

  const fmtPercentInt = (x) => {
    const s = String(x || "").replace("%", "").trim();
    if (!s) return "";
    const v = Number(s);
    if (Number.isNaN(v)) return String(x || "");
    return String(Math.round(v)); // 小数点以下なし
  };

  const lettersToUmaban = (s, mp) => {
    const raw = String(s || "").trim();
    if (!raw) return "";

    // 例: "CDEFGHIJ" / "AB" / "A" を想定（区切りがあっても対応）
    const tokens = raw.replace(/\s+/g, "").split(/[,、/]+/).filter(Boolean);
    const outParts = [];

    for (const tk of tokens) {
      const nums = [];
      for (const ch of tk.split("")) {
        if (mp && mp[ch]) {
          nums.push(mp[ch]);
        }
      }
      if (nums.length > 0) {
        outParts.push(nums.join(","));
      } else {
        // 想定外の形式はそのまま出す
        outParts.push(tk);
      }
    }

    return outParts.join(" / ");
  };

  const letterMap = buildLetterMapFromScoreOrder(obj);

  for (const p of pats) {
    const card = document.createElement("div");
    card.style.cssText =
      "border:1px solid rgba(255,255,255,0.12); background:rgba(16,19,27,0.88);" +
      "border-radius:16px; padding:14px; box-shadow:0 10px 24px rgba(0,0,0,0.28);" +
      "margin-bottom:12px;";

    const h = document.createElement("div");
    h.style.cssText = "display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; margin-bottom:10px;";

    const name = document.createElement("div");
    name.style.cssText = "font-weight:1000; font-size:16px; line-height:1.2;";
    const kind = String(p["種別"] || "");
    const recText = String(p["推奨"] || "");
    const pname = String(p["パターン名称"] || "（名称なし）");
    name.textContent = (kind ? (kind + " ") : "") + (recText ? (recText + " / ") : "") + pname;

    const meta = document.createElement("div");
    meta.style.cssText = "font-size:14px; color:rgba(170,179,197,0.95); font-weight:900; line-height:1.35;";
    const baken = String(p["馬券"] || "");
    const roi = fmtPercentInt(p["期待回収率(%)"]);
    const hit = fmtPercentInt(p["的中率(%)"]);
    const pts = String(p["点数"] || "");
    const unit = String(p["単価"] || "");
    const cost = String(p["投資"] || p["費用"] || "");
    const aRank = String(p["Aランク"] || "");
    const fragile = String(p["A飛び1人気"] || "");
    const value5 = String(p["Top5妙味"] || "");
    meta.textContent =
      (baken ? ("[" + baken + "] ") : "") +
      (roi ? ("期待回収率 " + roi + "%  ") : "") +
      (hit ? ("的中率 " + hit + "%  ") : "") +
      (pts ? ("点数 " + pts + "  ") : "") +
      (unit ? ("単価 " + unit + "  ") : "") +
      (cost ? ("投資 " + cost + "  ") : "") +
      (aRank ? ("上位構造 " + aRank + "  ") : "") +
      (fragile ? ("飛び1人気 " + fragile + "  ") : "") +
      (value5 ? ("Top5妙味 " + value5) : "");

    h.appendChild(name);
    h.appendChild(meta);

    const picks = document.createElement("div");
    picks.style.cssText =
      "display:grid; grid-template-columns:84px 1fr; gap:8px 12px; font-size:16px; font-weight:900;";

    const addRow = (k, v) => {
      const kk = document.createElement("div");
      kk.style.cssText = "color:rgba(170,179,197,0.95); font-weight:900; font-size:14px;";
      kk.textContent = k;

      const vv = document.createElement("div");
      vv.style.cssText = "white-space:pre-wrap; line-height:1.45; font-size:17px;";
      vv.textContent = v || "—";

      picks.appendChild(kk);
      picks.appendChild(vv);
    };

    const tickets = String(p["買い目"] || "").trim();
    const form = String(p["フォーメーション"] || "").trim();
    if (form) addRow("形", form);
    if (tickets) {
      addRow("買い目", tickets.replace(/\s*\/\s*/g, " / "));
    } else {
      // AB表記 → スコア順の馬番へ変換して表示
      addRow("1着", lettersToUmaban(p["1着"], letterMap));
      addRow("2着", lettersToUmaban(p["2着"], letterMap));
      addRow("3着", lettersToUmaban(p["3着"], letterMap));
    }

    // 条件表示は不要なので出さない

    card.appendChild(h);
    card.appendChild(picks);
    bodyEl.appendChild(card);
  }

  m.style.display = "block";
}

function renderRowsTable(rows) {
  const tbody = el("tbody");
  tbody.innerHTML = "";
  const scoreIndex = DISPLAY_COLS.indexOf("スコア");
  const scoreHead = el("thead").querySelectorAll("th")[scoreIndex];
  if (scoreHead) scoreHead.textContent = probabilityLabel();

  for (const r of rows) {
    const tr = document.createElement("tr");

    const kind = sugoumaKind(r.__sugouma || "");
    const rowCls = sugoumaClass(kind);
    if (rowCls) {
      tr.classList.add("sg-row");
      tr.classList.add(rowCls);
    }

    const rn = Number(r.__result_n);
    if (!Number.isNaN(rn) && rn >= 1 && rn <= 3) {
      tr.classList.add("in3");
      if (rn === 1) tr.classList.add("pos1");
      if (rn === 2) tr.classList.add("pos2");
      if (rn === 3) tr.classList.add("pos3");
