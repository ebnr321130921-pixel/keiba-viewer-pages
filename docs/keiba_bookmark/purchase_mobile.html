const TicketDisplay = (() => {
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Display-only WIN5 alternatives. No controls, requests, or voting actions. */
globalThis.Win5PreviewDisplay = (() => {
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const yen = value => Number(value || 0).toLocaleString('ja-JP') + '円';
  const colors = ['', '#fff', '#202225', '#e53935', '#2979d8', '#f4d538', '#2f984d', '#ef8a2e', '#ef9ebd'];
  function horse(h) {
    const frame = Number(h.frame);
    const color = Number.isInteger(frame) && frame >= 1 && frame <= 8
      ? ` style="background:${colors[frame]};color:${[2,3,4,6].includes(frame)?'#fff':'#111'}"` : '';
    const p = h.p_win == null ? NaN : Number(h.p_win);
    const probability = Number.isFinite(p) && p >= 0 && p <= 1 ? (p * 100).toFixed(1) + '%' : '—';
    return `<span class="win5-preview-horse"><b class="win5-preview-number"${color}>${esc(h.horse_no)}</b><span class="win5-preview-name">${esc(h.horse_name)}</span><small class="win5-preview-probability" aria-label="1着率 ${esc(probability)}">${esc(probability)}</small></span>`;
  }
  function render(preview) {
    if (!preview || !Array.isArray(preview.plans) || !preview.plans.length) return '';
    const allowed = preview.purchase_allowed === true;
    const plans = preview.plans.map(plan => {
      const label = plan.is_current ? allowed ? '残高別候補' : '最低点数・参考' : '参考案';
      const limit = Number(plan.max_points);
      return `<article class="win5-preview-plan${plan.is_current?' is-current':''}">
        <div class="win5-preview-plan-heading"><b>${Number(plan.points)}点 · ${yen(plan.amount_yen)}</b><span>${label}</span></div>
        <p class="win5-preview-pattern">上限${limit}点 · ${(plan.pattern || []).map(Number).join(' × ')}頭 <span>1着率</span></p>
        <div class="win5-preview-legs">${(plan.legs || []).map(leg => `<div class="win5-preview-leg"><b>WIN${Number(leg.leg)} · ${esc(leg.track)}${Number(leg.race_no)}R</b><div>${(leg.horses || []).map(horse).join('')}</div></div>`).join('')}</div>
      </article>`;
    }).join('');
    return `<section class="win5-plan-previews" aria-label="WIN5の点数別参考買い目"><p class="win5-preview-note">${esc(preview.note || '購入準備時に残高に応じた1案を再選定')}</p><div class="win5-preview-grid">${plans}</div></section>`;
  }
  return Object.freeze({render});
})();

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=v=>Number(v||0).toLocaleString('ja-JP')+'円';
const pending=new Set(['scheduled','due','executing','retry_scheduled','ready_dry_run','staged','waiting_odds','ready_semi','starting','opening','selecting','review_ready','manual_handoff']);
let tab='reference';const date=document.getElementById('date');
let raceTarget=null;
function raceNumber(value){const m=String(value??'').match(/\d+/);return m?Number(m[0]):0}
function readLocation(){
 const values={};
 for(const part of String(location.hash||'').replace(/^#/,'').split('&')){
  const i=part.indexOf('=');if(i<0)continue;
  try{values[decodeURIComponent(part.slice(0,i))]=decodeURIComponent(part.slice(i+1))}catch(_){/* Ignore malformed URL fields. */}
 }
 return values;
}
function applyLocation(){
 const h=readLocation();
 if(/^\d{8}$/.test(h.date||'')){
  if(!SNAPSHOT.dates.includes(h.date)){const o=document.createElement('option');o.value=h.date;o.textContent=h.date.slice(4,6)+'/'+h.date.slice(6)+' '+h.date.slice(0,4);date.appendChild(o)}
  date.value=h.date;
 }
 const n=raceNumber(h.race);
 raceTarget=/^\d{8}$/.test(h.date||'')&&h.track&&n>=1&&n<=12?{date:h.date,track:h.track,race:n,rawRace:h.race}:null;
 render();
}
for(const d of SNAPSHOT.dates){const o=document.createElement('option');o.value=d;o.textContent=d.slice(4,6)+'/'+d.slice(6)+' '+d.slice(0,4);date.appendChild(o)}
date.value=SNAPSHOT.dates.includes(SNAPSHOT.date)?SNAPSHOT.date:SNAPSHOT.dates[0];
function metric(label,value){return '<div class="metric"><small>'+esc(label)+'</small><b>'+esc(value)+'</b></div>'}
function horseBadge(n,marks,names,frames){
 const frame=Number(frames[n]);const valid=Number.isInteger(frame)&&frame>=1&&frame<=8;
 const bg=['','#fff','#202225','#e53935','#2979d8','#f4d538','#2f984d','#ef8a2e','#ef9ebd'][frame];
 const fg=[2,3,4,6].includes(frame)?'#fff':'#111';
 return '<span class="horse-dot" title="'+esc(names[n]||'')+'" aria-label="'+(valid?frame+'枠 ':'')+esc(n)+'番"><small>'+esc(marks[n]||'')+'</small><b'+(valid?' style="background:'+bg+';color:'+fg+'"':'')+'>'+esc(n)+'</b></span>';
}
function reservationRecommendationBadge(r){
 const labels={normal:'おすすめA',ultimate:'おすすめS',ultra:'おすすめSS',graded:'重賞'};
 const tier=String(r.focus_tier??'');
 if(!Object.prototype.hasOwnProperty.call(labels,tier))return '';
 return '<span class="recommendation-preview-badge tier-'+tier+'" title="'+esc(r.recommendation_basis||'保存時')+'の評価">'+(r.recommendation_basis==='購入時'?'購入時 ':'')+labels[tier]+'</span>';
}
function render(){
 const day=SNAPSHOT.days[date.value]||{races:[],summary:{}};const s=day.summary;
 const prediction=SNAPSHOT.prediction_data?.[date.value]||{};
 const versions=(prediction.versions||[]).join('・')||'版未確認';
 const screenVersion=SNAPSHOT.display_release_version?'Ver'+SNAPSHOT.display_release_version:'';
 const versionNode=document.getElementById('predictionDataVersion');
 const components=prediction.horse_versions?.length&&prediction.ticket_versions?.length?'馬予測 '+prediction.horse_versions.join('・')+' ／ 買い目 '+prediction.ticket_versions.join('・'):'';
 if(versionNode)versionNode.textContent=(screenVersion?'画面 '+screenVersion+' ／ ':'')+(components||'予測データ：'+versions)+' ／ 更新：'+(prediction.source_updated_at||'未確認');
 document.title='自動購入 · 閲覧 · '+(screenVersion||versions);
 const sim=SNAPSHOT.sim_update_status||{};
 const simState=['running','stopped','unknown'].includes(sim.state)?sim.state:'unknown';
 const simNode=document.getElementById('simUpdate');
 simNode.className='monitor monitor-'+(sim.update_health_state==='failed'?'abnormal':simState);
 simNode.textContent='予測更新：'+({running:'稼働中',stopped:'停止中',unknown:'確認できません'}[simState])+(sim.update_warning_label?' · '+sim.update_warning_label:'')+' · 最終予測更新 '+(sim.last_prediction_label||'未確認')+'（表示更新時点）';
 const monitor=document.getElementById('monitor');
 const stateLabel={running:'稼働中',stopped:'停止中',abnormal:'監視に異常・要確認',unknown:'稼働状態を確認できません'}[SNAPSHOT.monitor_state]||'稼働状態を確認できません';
 const modeLabel={full:'フルオート',semi:'セミオート',off:'OFF'}[SNAPSHOT.mode]||'未設定';
 monitor.className='monitor monitor-'+(SNAPSHOT.monitor_state||'unknown');
 monitor.textContent=modeLabel+' · '+stateLabel+' · '+(SNAPSHOT.live_purchase_enabled?'実投票ON':'実投票OFF')+(SNAPSHOT.race_selection_label?' · 残高連動：'+SNAPSHOT.race_selection_label:'')+'（表示更新時点）';
 document.getElementById('metrics').innerHTML=metric('予約 / 予定金額',(day.reserved_count||0)+'件 / '+yen(day.required_yen))+metric('購入済 / 購入金額',(s.purchased_races||0)+'件 / '+yen(s.investment_yen))+metric('払戻 / 確定分収支',yen(s.payout_yen)+' / '+yen(s.profit_yen))+metric('的中率 / 回収率',s.settled_races?s.hit_rate_percent+'% / '+s.roi_percent+'%':'未確定');
 let rows;
 if(raceTarget){
  rows=day.races.filter(r=>String(r.track)===raceTarget.track&&raceNumber(r.race_no)===raceTarget.race);
  const purchased=rows.filter(r=>r.status==='purchased');
  if(purchased.length)rows=purchased;
  tab=rows.some(r=>pending.has(r.status))?'planned':'results';
 }else rows=tab==='reference'?(SNAPSHOT.references?.[date.value]||[]):day.races.filter(r=>tab==='planned'?pending.has(r.status):!pending.has(r.status));
 rows=rows.slice().sort((a,b)=>tab==='results'
  ?(Date.parse(b.purchased_at||b.attempt_at||'')||0)-(Date.parse(a.purchased_at||a.attempt_at||'')||0)||String(b.start_time).localeCompare(String(a.start_time),'ja')
  :String(a.start_time).localeCompare(String(b.start_time),'ja')||String(a.track).localeCompare(String(b.track),'ja'));
 document.getElementById('raceFocus').hidden=!raceTarget;
 document.getElementById('filterTabs').hidden=!!raceTarget;
 document.getElementById('metrics').hidden=!!raceTarget||tab==='reference';
 monitor.hidden=tab==='reference';
 document.getElementById('raceFocusLabel').textContent=raceTarget?raceTarget.track+raceTarget.race+'Rの馬券':'';
 document.getElementById('predictionReturn').href='keiba_viewer.html#date='+encodeURIComponent(date.value)+(raceTarget?'&track='+encodeURIComponent(raceTarget.track)+'&race='+encodeURIComponent(raceTarget.rawRace):'');
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 document.getElementById('races').innerHTML=rows.length?rows.map(r=>{
  const bought=r.status==='purchased';
  const cancelled=r.status==='cancelled_romance';
  const reference=!bought&&!(r.bets||[]).length&&r.reference_only===true&&(r.reference_bets||[]).length>0;
  const bets=reference?r.reference_bets:r.bets||[];
  const amount=bought?r.total_amount_yen:reference?r.reference_amount_yen:r.planned_amount_yen??r.total_amount_yen;
  const points=bought?r.total_points:reference?r.reference_points:r.planned_points;
  const formations=r.purchase_mode==='GS'||bets.some(b=>String(b.source_name||'').startsWith('graded:'));
  const tickets=TicketDisplay.render(bets,{formations,horseBadge:(n,marks,names)=>horseBadge(n,marks,names,r.horse_frames||{})});
  const purchaseTime=bought?r.purchased_at:cancelled?r.cancelled_at:r.purchase_at;
  const when=purchaseTime?String(purchaseTime).slice(11,16):'—';
  const heading=r.is_win5?'<span class="win5-preview-badge">WIN5</span><b>対象5レース</b>':'<b>'+esc(r.track)+esc(r.race_no)+'R '+esc(r.race_name)+'</b>'+reservationRecommendationBadge(r)+(r.romance_reservation?'<span class="romance-preview-badge">ロマン砲</span>':'');
  const win5Reference=r.is_win5&&!bought&&r.win5_preview?.purchase_allowed===false?r.win5_preview.plans?.find(p=>p.is_current):null;
  const publicReference=r.status==='reference';
  const sub=publicReference?'発走 '+esc(r.start_time)+' · 3連単の気持ち・フルパワー · '+(tickets?Number(points||0)+'点・'+yen(amount):esc(r.reference_reason)):r.is_win5?'5レース · '+(win5Reference?'参考 '+Number(win5Reference.points)+'点 · '+yen(win5Reference.amount_yen):Number(points||0)+'点 · '+yen(amount))+(r.win5_max_points?' · 残高別上限'+Number(r.win5_max_points)+'点':' · 購入前に残高確認'):'発走 '+esc(r.start_time)+' · '+(bought?'購入 ':cancelled?'取消 ':'購入予定 ')+esc(when)+' · '+(reference?(cancelled?'参考 ':'予定 ')+Number(points||0)+'点・':'')+yen(amount);
  const win5Preview=r.is_win5&&!bought?Win5PreviewDisplay.render(r.win5_preview):'';
  const oddsLink=tickets&&!r.is_win5&&!publicReference?'<a class="odds-link" style="display:inline-block;margin:10px 0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;color:inherit;text-decoration:none" href="ticket_odds.html#date='+encodeURIComponent(date.value)+'&track='+encodeURIComponent(r.track)+'&race_no='+encodeURIComponent(r.race_no)+'" target="_blank" rel="noopener">オッズを見る</a>':'';
  return '<article class="purchase-race"><div class="race-heading"><div class="race-heading-title">'+heading+'</div><span class="state-label '+esc(r.status)+'">'+esc(r.status_label||'未購入')+'</span></div><div class="race-sub">'+sub+'</div>'+win5Preview+(tickets?'<details open><summary>'+ (publicReference?'全レース参考買い目／実購入と別':bought?'購入した買い目':cancelled?'参考買い目／取消済み・購入なし':reference?'予定買い目／購入時にオッズ判定':'予約時点の買い目')+'</summary>'+tickets+oddsLink+'</details>':'')+(r.result_available?'<div class="result">'+(r.hit?'的中':'不的中')+' · 払戻 '+yen(r.payout_yen)+'</div>':'')+'</article>';
 }).join(''):'<p class="empty">'+(raceTarget?'このレースの予約・購入履歴はありません。':tab==='reference'?'この日の全レース参考買い目は更新待ちです。':tab==='planned'?'この日の予約はありません。':'この日の購入結果はまだありません。')+'</p>';
 document.getElementById('updated').textContent=(tab==='reference'?'3連単の気持ち・1レース上限2,000円の参考買い目。実際の購入条件とは独立しています。\n':'')+'表示更新 '+SNAPSHOT.captured_at.slice(5,10).replace('-','/')+' '+SNAPSHOT.captured_at.slice(11,16)+' · 保存済み情報\n予約の買い目は購入前に再判定されます。';
}
date.addEventListener('change',()=>{raceTarget=null;location.hash='date='+encodeURIComponent(date.value);render()});document.getElementById('refresh').addEventListener('click',()=>location.reload());
document.getElementById('allRaces').addEventListener('click',()=>{raceTarget=null;location.hash='date='+encodeURIComponent(date.value);render()});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render();if(tab==='results')document.querySelector('#races > article')?.scrollIntoView({block:'start'})}));
if(typeof window!=='undefined')window.addEventListener('hashchange',applyLocation);
applyLocation();
</script></body></html>
