  const key='keibaDisplayTheme';
  let theme='night';
  try {if(localStorage.getItem(key)==='day') theme='day'} catch (_) {}
  const apply=()=>{
    document.documentElement.dataset.displayTheme=theme;
    document.querySelectorAll('.theme-toggle').forEach(b=>{
      b.textContent=theme==='night'?'昼モード':'夜モード';
      b.setAttribute('aria-label',theme==='night'?'昼モードへ切替':'夜モードへ切替');
    });
  };
  apply();
  document.addEventListener('DOMContentLoaded',()=>{
    if(!document.querySelector('.theme-toggle')) {
      const parent=document.querySelector('.view-switch')||document.querySelector('.topbar');
      if(parent){const b=document.createElement('button');b.type='button';b.className='theme-toggle';parent.appendChild(b)}
    }
    document.querySelectorAll('.theme-toggle').forEach(b=>b.addEventListener('click',()=>{
      theme=theme==='night'?'day':'night';
      try{localStorage.setItem(key,theme)}catch(_){}
      apply();
    }));
    apply();
  });
})();

</main><script>
// Presentation only: aggregate the exact tickets, never create purchase tickets.
const TicketDisplay = (() => {
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const yen = value => `${Number(value).toLocaleString('ja-JP')}円`;
  const key = ns => ns.join('-');
  const canonical = (kind, ns) => ['3連複','馬連','ワイド'].includes(kind) ? [...ns].sort((a,b)=>a-b) : [...ns];
  const priority = (marks,n) => ({'◎':0,'◉':0,'○':1,'▲':2,'△1':3,'△2':4,'△3':5,'△4':6,'△5':7})[(String(marks[n]||'').match(/^(◎|◉|○|▲|△[1-5])/)||[])[1]] ?? 99;
  function expand(kind,groups) {
    const found=new Map();
    function visit(ns,col) {
      if(col===groups.length) {const result=canonical(kind,ns);found.set(key(result),result);return;}
      for(const n of groups[col]) if(!ns.includes(n)) visit([...ns,n],col+1);
    }
    visit([],0);
    return [...found.values()];
  }
  function groupFormation(kind,groups,marks) {
    const sorted=groups.map(g=>[...g].sort((a,b)=>priority(marks,a)-priority(marks,b)||a-b));
    const equal=(a,b)=>a.length===b.length && a.every(n=>b.includes(n));
    const fixed=sorted.map((g,i)=>g.length===1?i:-1).filter(i=>i>=0);
    if(kind==='3連複') {
      if(equal(sorted[0],sorted[1]) && equal(sorted[1],sorted[2]))
        return {label:`${sorted[0].length}頭BOX`,rows:[['対象',sorted[0]]]};
      if(fixed.length===1) {
        const others=sorted.filter((_,i)=>i!==fixed[0]);
        if(equal(others[0],others[1])) return {label:'1頭軸固定',rows:[['軸',sorted[fixed[0]]],['相手',others[0]]]};
      }
      if(fixed.length===2) {
        const axes=fixed.map(i=>sorted[i][0]).sort((a,b)=>priority(marks,a)-priority(marks,b)||a-b);
        return {label:'2頭軸固定',rows:[['軸',axes],['相手',sorted.find((_,i)=>!fixed.includes(i))]]};
      }
    }
    if(kind==='3連単' && equal(sorted[0],sorted[1]) && equal(sorted[1],sorted[2])) return {label:sorted[0].length+'頭BOX',rows:[['対象',sorted[0]]]};
    let label='フォーメーション';
    if(kind==='3連単' && fixed.length===2) label=fixed.map(i=>i+1).join('・')+'着固定';
    if(kind==='3連単' && sorted[0].length===2 && equal(sorted[0],sorted[2])) label='1・3着入替';
    return {label,rows:sorted.map((g,i)=>[['3連単','馬単'].includes(kind)?`${i+1}着`:`${i+1}列目`,g])};
  }

  // Keep the broad purchase formations. Pack supplements only when expansion
  // exactly fits the remaining tickets; this never changes the wager ledger.
  function formationSections(bets) {
    const result=[];
    for(const part of summarize(bets)) {
      const remaining=new Map(part.tickets.map(t=>[key(t.numbers),{numbers:t.numbers,stake:t.stake}]));
      const seen=new Set();
      function add(groups,unit,topup) {
        const numbers=expand(part.kind,groups),overlapPoints=numbers.filter(ns=>seen.has(key(ns))).length;
        for(const ns of numbers) {
          const entry=remaining.get(key(ns));
          if(!entry || entry.stake<unit) throw Error('表示フォーメーションと購入金額が不一致です');
          entry.stake-=unit;seen.add(key(ns));
        }
        result.push({...part,groups:groups.map(g=>[...g]),tickets:numbers.map(ns=>({numbers:ns,stake:unit})),
          formation:groupFormation(part.kind,groups,part.marks),points:numbers.length,
          overlapPoints,amount:numbers.length*unit,stakeText:`各${yen(unit)}`,topup,section:result.length});
      }
      for(const bet of bets.filter(b=>b.bet_type===part.kind)) {
        if(![2,3].includes(bet.groups?.length) || bet.groups.filter(g=>g.length>1).length<2) continue;
        const generated=expand(part.kind,bet.groups),original=new Set(bet.tickets.map(ns=>key(canonical(part.kind,ns))));
        if(generated.length!==original.size || !generated.every(ns=>original.has(key(ns)))) continue;
        if(!generated.every(ns=>remaining.get(key(ns))?.stake>=bet.unit_yen)) continue;
        // Preserve explicit formations; overlapPoints labels the additive stakes.
        add(bet.groups,Number(bet.unit_yen),generated.every(ns=>seen.has(key(ns))));
      }
      while([...remaining.values()].some(t=>t.stake>0)) {
        const positive=[...remaining.values()].filter(t=>t.stake>0);
        const unit=Math.min(...positive.map(t=>t.stake));
        for(const topup of [false,true]) {
          const available=new Set(positive.filter(t=>t.stake>=unit && seen.has(key(t.numbers))===topup).map(t=>key(t.numbers)));
          while(available.size) {
            const tuples=[...available].map(id=>remaining.get(id).numbers);
            const horses=[...new Set(tuples.flat())].sort((a,b)=>priority(part.marks,a)-priority(part.marks,b)||a-b);
            const fits=groups=>{
              const ts=expand(part.kind,groups);
              return ts.length && ts.every(ns=>available.has(key(ns)))?ts:[];
            };
            let best=null,bestTickets=[];
            for(const seed of tuples) {
              let groups=seed.map(n=>[n]),tickets=fits(groups);
              while(true) {
                let improved=null,larger=tickets;
                for(let col=0;col<groups.length;col++) for(const n of horses) {
                  if(groups[col].includes(n)) continue;
                  const trial=groups.map((g,i)=>i===col?[...g,n]:[...g]);
                  const ts=fits(trial);
                  if(ts.length>larger.length) {improved=trial;larger=ts;}
                }
                if(!improved) break;
                groups=improved;tickets=larger;
              }
              if(tickets.length>bestTickets.length) {best=groups;bestTickets=tickets;}
            }
            add(best,unit,topup);
            bestTickets.forEach(ns=>available.delete(key(ns)));
          }
        }
      }
    }
    return result;
  }
  function summarize(bets) {
    const kinds = new Map();
    for (const bet of bets || []) {
      if (!kinds.has(bet.bet_type)) kinds.set(bet.bet_type, {kind:bet.bet_type, tickets:new Map(), marks:{}, names:{},frames:{}});
      const part = kinds.get(bet.bet_type);
      Object.assign(part.marks, bet.horse_marks || {}); Object.assign(part.names, bet.horse_names || {});
      Object.assign(part.frames,bet.horse_frames || {});
      for (const raw of bet.tickets || []) {
        const numbers = canonical(bet.bet_type, raw.map(Number));
        const id = key(numbers), old = part.tickets.get(id);
        part.tickets.set(id, {numbers, stake:(old?.stake || 0)+Number(bet.unit_yen)});
      }
    }
    return [...kinds.values()].map(part => {
      part.tickets = [...part.tickets.values()];
      part.points = part.tickets.length;
      part.amount = part.tickets.reduce((sum,t)=>sum+t.stake,0);
      part.formation = formation(part.kind, part.tickets.map(t=>t.numbers));
      const stakes = [...new Set(part.tickets.map(t=>t.stake))].sort((a,b)=>a-b);
      part.stakes = stakes;
      part.stakeText = stakes.length === 1 ? `各${yen(stakes[0])}` :
        `基本${yen(stakes[0])}・` + stakes.slice(1).map(stake=>`重点${part.tickets.filter(t=>t.stake===stake).length}組は${yen(stake)}`).join('・');
      return part;
    });
  }
  function formation(kind, tickets) {
    const all = [...new Set(tickets.flat())].sort((a,b)=>a-b);
    const actual = new Set(tickets.map(ns=>key(canonical(kind,ns))));
    const matches = groups => {
      const found = new Set(expand(kind,groups).map(key));
      return found.size===actual.size && [...found].every(id=>actual.has(id));
    };
    if (kind === '3連複') {
      if (matches([all,all,all])) return {label:`${all.length}頭BOX`, rows:[['対象',all]]};
      const axes = all.filter(n=>tickets.every(ns=>ns.includes(n)));
      const rest = all.filter(n=>!axes.includes(n));
      if (axes.length===1 && matches([axes,rest,rest])) return {label:`1頭軸・相手${rest.length}頭`,rows:[['軸',axes],['相手',rest]]};
      if (axes.length===2 && matches([[axes[0]],[axes[1]],rest])) return {label:`2頭軸・相手${rest.length}頭`,rows:[['軸',axes],['相手',rest]]};
    }
    if (['3連単','馬単'].includes(kind)) {
      const groups = (kind==='馬単'?[0,1]:[0,1,2]).map(i=>[...new Set(tickets.map(ns=>ns[i]))]);
      if (matches(groups)) return {label:'フォーメーション',rows:groups.map((ns,i)=>[`${i+1}着`,ns])};
    }
    return {label:'選択した組み合わせ',rows:[]};
  }
  function render(bets, options = {}) {
    const summarized=summarize(bets);
    const sections=options.formations || summarized.some(p=>!p.formation.rows.length)
      ?formationSections(bets):summarized.flatMap(displaySections);
    return sections.map((part,index) => {
      const order = n => ({'◎':0,'◉':0,'○':1,'▲':2,'△1':3,'△2':4,'△3':5,'△4':6,'△5':7})[(String(part.marks[n]||'').match(/^(◎|◉|○|▲|△[1-5])/)||[])[1]] ?? 99;
      const horse = n => options.horseBadge ? options.horseBadge(n,part.marks,part.names) : badge(n,part);
      const separator=['3連単','馬単'].includes(part.kind)?'＞':'×';
      // Align to the number badge itself, keeping the first row stable on wrap.
      const numberTop=options.horseBadge?14:15,numberSize=options.horseBadge?25:28;
      const columns=part.formation.rows.map(([label,ns])=>`<div class="ticket-column" aria-label="${esc(label)}" style="min-width:34px;display:inline-flex;align-items:flex-start;gap:4px;flex:0 1 auto">${['軸','相手'].includes(label)?`<span style="opacity:.7;font-size:12px;line-height:12px;white-space:nowrap;margin-top:${numberTop+(numberSize-12)/2}px">${esc(label)}</span>`:''}<span class="bet-formation" style="min-width:0;display:flex;align-items:flex-start;flex-wrap:wrap;gap:6px">${[...ns].sort((a,b)=>order(a)-order(b)||a-b).map(horse).join('')}</span></div>`);
      const rows=`<div class="ticket-columns" style="margin-top:8px;display:inline-flex;align-items:flex-start;gap:6px;max-width:100%">${columns.join(`<span class="ticket-separator" style="display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;height:${numberSize}px;margin-top:${numberTop}px;font-size:20px;line-height:1;font-weight:700;opacity:.65">${separator}</span>`)}</div>`;
      const title=part.overlapPoints>0 && part.overlapPoints<part.points ? part.formation.label+'（'+part.overlapPoints+'組重ね買い）' : part.topup?'重ね買い・'+(options.formations?part.formation.label:'フォーメーション'):part.formation.label;
      return `<div class="compact-ticket" style="padding:12px 0;border-bottom:1px solid #8884"><b>${options.formations?`${index+1}. `:''}${esc(part.kind)}　${esc(title)}</b><div style="margin-top:4px">${part.points}点・${yen(part.amount)}（${esc(part.stakeText)}）</div>${rows}</div>`;
    }).join('');
  }
  function displaySections(part) {
    const base=part.stakes[0];
    const levels=[base,...part.stakes.slice(1).map((stake,i)=>stake-part.stakes[i])];
    return levels.map((unit,i)=>{
      const included=part.tickets.filter(t=>i===0 || t.stake>=part.stakes[i]);
      const tickets=included.map(t=>({numbers:[...t.numbers],stake:unit}));
      const form=formation(part.kind,tickets.map(t=>t.numbers));
      // Even an irregular top-up lists its exact few combinations up front.
      if(i>0 && (!form.rows.length || form.label.endsWith('頭BOX')))
        form.rows=tickets.map((t,j)=>[`組${j+1}`,t.numbers]);
      if(i>0 && part.kind==='3連複' && form.label.startsWith('2頭軸')) {
        const [axes,rest]=form.rows.map(r=>r[1]);
        form.rows=[['1列目',[axes[0]]],['2列目',[axes[1]]],['3列目',rest]];
      }
      return {...part,tickets,formation:form,points:tickets.length,amount:tickets.length*unit,
        stakeText:`各${yen(unit)}`,topup:i>0,section:i};
    });
  }
  function badge(n,part) {
    const frame=Number(part.frames[n]) || 1;
    const bg=['','#fff','#202225','#e53935','#2979d8','#f4d538','#2f984d','#ef8a2e','#ef9ebd'][frame];
    const fg=[2,3,4,6].includes(frame)?'#fff':'#111';
    const mark=String(part.marks[n]||'');
    const name=Array.from(String(part.names[n]||'')).slice(0,3).join('');
    return `<span style="display:inline-flex;flex-direction:column;align-items:center;gap:3px;min-width:32px" title="${esc(part.names[n]||'')}" aria-label="${frame}枠 ${n}番 ${esc(mark)} ${esc(part.names[n]||'')}"><small style="display:block;height:12px;line-height:12px;font-size:11px;font-weight:900">${esc(mark)||'&nbsp;'}</small><b style="display:inline-grid;box-sizing:border-box;place-items:center;background:${bg};color:${fg};width:28px;height:28px;border:1px solid #8888;border-radius:7px;font-size:14px">${n}</b><small style="height:10px;line-height:10px;font-size:8px;white-space:nowrap">${esc(name)||'&nbsp;'}</small></span>`;
  }
  return {summarize, formation, displaySections, formationSections, expand, render};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pending=new Set(['scheduled','due','executing','retry_scheduled','ready_dry_run','staged','waiting_odds']);
let tab='planned';const date=document.getElementById('date');
let raceTarget=null;
function raceNumber(value){const m=String(value??'').match(/\d+/);return m?Number(m[0]):0}
function readLocation(){
 const values={};
 for(const part of String(location.hash||'').replace(/^#/,'').split('&')){
  const i=part.indexOf('=');if(i<0)continue;
  try{values[decodeURIComponent(part.slice(0,i))]=decodeURIComponent(part.slice(i+1))}catch(_){/* Ignore malformed URL fields. */}
 }
 return values;
}
function applyLocation(){
 const h=readLocation();
 if(/^\d{8}$/.test(h.date||'')){
  if(!SNAPSHOT.dates.includes(h.date)){const o=document.createElement('option');o.value=h.date;o.textContent=h.date.slice(4,6)+'/'+h.date.slice(6)+' '+h.date.slice(0,4);date.appendChild(o)}
  date.value=h.date;
 }
 const n=raceNumber(h.race);
 raceTarget=/^\d{8}$/.test(h.date||'')&&h.track&&n>=1&&n<=12?{date:h.date,track:h.track,race:n,rawRace:h.race}:null;
 render();
}
for(const d of SNAPSHOT.dates){const o=document.createElement('option');o.value=d;o.textContent=d.slice(4,6)+'/'+d.slice(6)+' '+d.slice(0,4);date.appendChild(o)}

function horseBadge(n,marks,names,frames){

 const bg=['','#fff','#202225','#e53935','#2979d8','#f4d538','#2f984d','#ef8a2e','#ef9ebd'][frame];
 const fg=[2,3,4,6].includes(frame)?'#fff':'#111';
 return '<span class="horse-dot" title="'+esc(names[n]||'')+'" aria-label="'+(valid?frame+'枠 ':'')+esc(n)+'番"><small>'+esc(marks[n]||'')+'</small><b'+(valid?' style="background:'+bg+';color:'+fg+'"':'')+'>'+esc(n)+'</b></span>';
}
function reservationRecommendationBadge(r){
 const labels={normal:'おすすめA',ultimate:'おすすめS',ultra:'おすすめSS',graded:'重賞'};
 const tier=String(r.focus_tier??'');
 if(!Object.prototype.hasOwnProperty.call(labels,tier))return '';

}

  const cancelled=r.status==='cancelled_romance';

  const amount=bought?r.total_amount_yen:reference?r.reference_amount_yen:r.planned_amount_yen??r.total_amount_yen;
