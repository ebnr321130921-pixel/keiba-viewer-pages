const TicketDisplay = (() => {
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const key = ns => ns.join('-');

        return {label:`${sorted[0].length}頭BOX`,rows:[['対象',sorted[0]]]};

        const others=sorted.filter((_,i)=>i!==fixed[0]);
        if(equal(others[0],others[1])) return {label:'1頭軸固定',rows:[['軸',sorted[fixed[0]]],['相手',others[0]]]};

/* Display-only WIN5 alternatives. No controls, requests, or voting actions. */
globalThis.Win5PreviewDisplay = (() => {
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const yen = value => Number(value || 0).toLocaleString('ja-JP') + '円';
  const colors = ['', '#fff', '#202225', '#e53935', '#2979d8', '#f4d538', '#2f984d', '#ef8a2e', '#ef9ebd'];
  function horse(h) {
    const frame = Number(h.frame);
    const color = Number.isInteger(frame) && frame >= 1 && frame <= 8
      ? ` style="background:${colors[frame]};color:${[2,3,4,6].includes(frame)?'#fff':'#111'}"` : '';
    const p = h.p_win == null ? NaN : Number(h.p_win);
    const probability = Number.isFinite(p) && p >= 0 && p <= 1 ? (p * 100).toFixed(1) + '%' : '—';
    return `<span class="win5-preview-horse"><b class="win5-preview-number"${color}>${esc(h.horse_no)}</b><span class="win5-preview-name">${esc(h.horse_name)}</span><small class="win5-preview-probability" aria-label="1着率 ${esc(probability)}">${esc(probability)}</small></span>`;
  }
  function render(preview) {
    if (!preview || !Array.isArray(preview.plans) || !preview.plans.length) return '';
    const allowed = preview.purchase_allowed === true;
    const plans = preview.plans.map(plan => {
      const label = plan.is_current ? allowed ? '残高別候補' : '最低点数・参考' : '参考案';
      const limit = Number(plan.max_points);
      return `<article class="win5-preview-plan${plan.is_current?' is-current':''}">
        <div class="win5-preview-plan-heading"><b>${Number(plan.points)}点 · ${yen(plan.amount_yen)}</b><span>${label}</span></div>
        <p class="win5-preview-pattern">上限${limit}点 · ${(plan.pattern || []).map(Number).join(' × ')}頭 <span>1着率</span></p>
        <div class="win5-preview-legs">${(plan.legs || []).map(leg => `<div class="win5-preview-leg"><b>WIN${Number(leg.leg)} · ${esc(leg.track)}${Number(leg.race_no)}R</b><div>${(leg.horses || []).map(horse).join('')}</div></div>`).join('')}</div>
      </article>`;
    }).join('');
    return `<section class="win5-plan-previews" aria-label="WIN5の点数別参考買い目"><p class="win5-preview-note">${esc(preview.note || '購入準備時に残高に応じた1案を再選定')}</p><div class="win5-preview-grid">${plans}</div></section>`;
  }
  return Object.freeze({render});
})();

  const reference=!bought&&!(r.bets||[]).length&&r.reference_only===true&&(r.reference_bets||[]).length>0;
  const bets=reference?r.reference_bets:r.bets||[];
  const amount=bought?r.total_amount_yen:reference?r.reference_amount_yen:r.planned_amount_yen??r.total_amount_yen;
  const points=bought?r.total_points:reference?r.reference_points:r.planned_points;
  const formations=r.purchase_mode==='GS'||bets.some(b=>String(b.source_name||'').startsWith('graded:'));
  const tickets=TicketDisplay.render(bets,{formations,horseBadge:(n,marks,names)=>horseBadge(n,marks,names,r.horse_frames||{})});
  const purchaseTime=bought?r.purchased_at:cancelled?r.cancelled_at:r.purchase_at;
  const when=purchaseTime?String(purchaseTime).slice(11,16):'—';
  const heading=r.is_win5?'<span class="win5-preview-badge">WIN5</span><b>対象5レース</b>':'<b>'+esc(r.track)+esc(r.race_no)+'R '+esc(r.race_name)+'</b>'+reservationRecommendationBadge(r)+(r.romance_reservation?'<span class="romance-preview-badge">ロマン砲</span>':'');
  const win5Reference=r.is_win5&&!bought&&r.win5_preview?.purchase_allowed===false?r.win5_preview.plans?.find(p=>p.is_current):null;
  const publicReference=r.status==='reference';
  const sub=publicReference?'発走 '+esc(r.start_time)+' · 3連単の気持ち・フルパワー · '+(tickets?Number(points||0)+'点・'+yen(amount):esc(r.reference_reason)):r.is_win5?'5レース · '+(win5Reference?'参考 '+Number(win5Reference.points)+'点 · '+yen(win5Reference.amount_yen):Number(points||0)+'点 · '+yen(amount))+(r.win5_max_points?' · 残高別上限'+Number(r.win5_max_points)+'点':' · 購入前に残高確認'):'発走 '+esc(r.start_time)+' · '+(bought?'購入 ':cancelled?'取消 ':'購入予定 ')+esc(when)+' · '+(reference?(cancelled?'参考 ':'予定 ')+Number(points||0)+'点・':'')+yen(amount);
  const win5Preview=r.is_win5&&!bought?Win5PreviewDisplay.render(r.win5_preview):'';
  const oddsLink=tickets&&!r.is_win5&&!publicReference?'<a class="odds-link" style="display:inline-block;margin:10px 0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;color:inherit;text-decoration:none" href="ticket_odds.html#date='+encodeURIComponent(date.value)+'&track='+encodeURIComponent(r.track)+'&race_no='+encodeURIComponent(r.race_no)+'" target="_blank" rel="noopener">オッズを見る</a>':'';
  return '<article class="purchase-race"><div class="race-heading"><div class="race-heading-title">'+heading+'</div><span class="state-label '+esc(r.status)+'">'+esc(r.status_label||'未購入')+'</span></div><div class="race-sub">'+sub+'</div>'+win5Preview+(tickets?'<details open><summary>'+ (publicReference?'全レース参考買い目／実購入と別':bought?'購入した買い目':cancelled?'参考買い目／取消済み・購入なし':reference?'予定買い目／購入時にオッズ判定':'予約時点の買い目')+'</summary>'+tickets+oddsLink+'</details>':'')+(r.result_available?'<div class="result">'+(r.hit?'的中':'不的中')+' · 払戻 '+yen(r.payout_yen)+'</div>':'')+'</article>';
 }).join(''):'<p class="empty">'+(raceTarget?'このレースの予約・購入履歴はありません。':tab==='reference'?'この日の全レース参考買い目は更新待ちです。':tab==='planned'?'この日の予約はありません。':'この日の購入結果はまだありません。')+'</p>';
 document.getElementById('updated').textContent=(tab==='reference'?'3連単の気持ち・1レース上限2,000円の参考買い目。実際の購入条件とは独立しています。\n':'')+'表示更新 '+SNAPSHOT.captured_at.slice(5,10).replace('-','/')+' '+SNAPSHOT.captured_at.slice(11,16)+' · 保存済み情報\n予約の買い目は購入前に再判定されます。';
}
date.addEventListener('change',()=>{raceTarget=null;location.hash='date='+encodeURIComponent(date.value);render()});document.getElementById('refresh').addEventListener('click',()=>location.reload());
document.getElementById('allRaces').addEventListener('click',()=>{raceTarget=null;location.hash='date='+encodeURIComponent(date.value);render()});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render();if(tab==='results')document.querySelector('#races > article')?.scrollIntoView({block:'start'})}));
if(typeof window!=='undefined')window.addEventListener('hashchange',applyLocation);
applyLocation();
</script></body></html>
