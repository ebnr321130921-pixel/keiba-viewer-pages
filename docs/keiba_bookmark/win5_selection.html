</style><script>(() => {
  const key='keibaDisplayTheme';
  if(window.keibaThemeController){window.keibaThemeController.refresh();return}
  let theme='night';
  const valid=v=>v==='day'||v==='night';
  const stored=()=>{try{return localStorage.getItem(key)}catch(_){return null}};
  if(valid(stored()))theme=stored();
  try{const requested=new URLSearchParams(location.search).get('theme');if(valid(requested)){theme=requested;localStorage.setItem(key,theme)}}catch(_){}
  const apply=()=>{
    document.documentElement.dataset.displayTheme=theme;
    try{const url=new URL(location.href);url.searchParams.set('theme',theme);history.replaceState(history.state,'',url.href)}catch(_){}
    document.querySelectorAll('.theme-toggle').forEach(b=>{
      b.textContent=theme==='night'?'昼モード':'夜モード';
      b.setAttribute('aria-label',theme==='night'?'昼モードへ切替':'夜モードへ切替');
      b.setAttribute('aria-pressed',String(theme==='day'));
    });
    document.querySelectorAll('iframe').forEach(frame=>{
      try{frame.contentWindow?.postMessage({type:'keiba-display-theme',theme},location.origin)}catch(_){}
    });
  };
  const refresh=()=>{const saved=stored();if(valid(saved))theme=saved;apply()};
  window.keibaThemeController={refresh};
  window.addEventListener('storage',event=>{
    if(event.key===key||event.key===null){if(valid(event.newValue))theme=event.newValue;else refresh();apply()}
  });
  window.addEventListener('pageshow',refresh);
  window.addEventListener('message',event=>{
    if(event.source===window.parent&&event.origin===location.origin&&event.data?.type==='keiba-display-theme'&&valid(event.data.theme)){
      theme=event.data.theme;apply();
    }
  });
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
  document.addEventListener('click',event=>{
    const link=event.target.closest?.('a[href]');if(!link)return;
    try{
      const url=new URL(link.href,location.href),file=url.pathname.split('/').pop();
      if(['index.html','keiba_viewer.html','purchase_mobile.html','odds.html','ticket_odds.html','odds_history.html','clock_correlation.html','win5.html','win5_selection.html','win5-selection.html','yosouka_prediction_results.html','yosouka_tipster_performance.html'].includes(file)||url.origin===location.origin&&url.pathname==='/'){
        url.searchParams.set('theme',theme);link.href=url.href;
      }
    }catch(_){}
  },true);
  apply();
  document.addEventListener('DOMContentLoaded',()=>{
    if(!document.querySelector('.theme-toggle')) {
      const parent=document.querySelector('.view-switch')||document.querySelector('.topbar');
      if(parent){const b=document.createElement('button');b.type='button';b.className='theme-toggle';parent.appendChild(b)}
    }
    document.querySelectorAll('.theme-toggle').forEach(b=>b.addEventListener('click',()=>{
      theme=theme==='night'?'day':'night';
      try{localStorage.setItem(key,theme)}catch(_){}
      apply();
    }));
    apply();
  });
})();

/* Front-to-rear positions follow the same direction as the course board. */
function styleIndicatorHtml(value, compact=false, frontOnRight=false) {
  const outline=frontOnRight?'▷':'◁',filled=frontOnRight?'▶︎':'◀︎';
  if(String(value??'').includes('対象外'))return compact?'':'<span class="style-label">対象外</span>';
  if(String(value??'').includes('後方'))return '<span class="style-indicator'+(compact?' compact':'')+'" role="img" aria-label="後方待機" title="後方待機・追込候補と区別"><span class="style-symbols" aria-hidden="true">'+outline.repeat(4)+'</span>'+(compact?'':'<span class="style-label">後方待機</span>')+'</span>';
  const candidates=String(value??'').match(/逃げ|先行|差し|追い込み|追込み|追込|逃|先|差|追/g)||[];
  const names=candidates.map(s=>s.startsWith('逃')?'逃げ':s.startsWith('先')?'先行':s.startsWith('差')?'差し':'追込');
  const order=frontOnRight?['追込','差し','先行','逃げ']:['逃げ','先行','差し','追込'],label=names[0]||'不明';
  const symbols=order.map(name=>name===label?filled:outline).join('');
  return '<span class="style-indicator'+(compact?' compact':'')+'" role="img" aria-label="脚質 '+label+'" title="'+(frontOnRight?'右':'左')+'から逃げ・先行・差し・追込"><span class="style-symbols" aria-hidden="true">'+symbols+'</span>'+(compact?'':'<span class="style-label">'+label+'</span>')+'</span>';
}

/* Display-only WIN5 alternatives. No controls, requests, or voting actions. */
globalThis.Win5PreviewDisplay = (() => {
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const yen = value => Number(value || 0).toLocaleString('ja-JP') + '円';
  const colors = ['', '#fff', '#202225', '#e53935', '#2979d8', '#f4d538', '#2f984d', '#ef8a2e', '#ef9ebd'];
  function horse(h) {
    const frame = Number(h.frame);
    const color = Number.isInteger(frame) && frame >= 1 && frame <= 8
      ? ` style="background:${colors[frame]};color:${[2,3,4,6].includes(frame)?'#fff':'#111'}"` : '';
    const p = h.p_win == null ? NaN : Number(h.p_win);
    const probability = Number.isFinite(p) && p >= 0 && p <= 1 ? (p * 100).toFixed(1) + '%' : '—';
    return `<span class="win5-preview-horse"><b class="win5-preview-number"${color}>${esc(h.horse_no)}</b><span class="win5-preview-name">${esc(h.horse_name)}</span><small class="win5-preview-probability" aria-label="1着率 ${esc(probability)}">${esc(probability)}</small></span>`;
  }
  function render(preview) {
    if (!preview || !Array.isArray(preview.plans) || !preview.plans.length) return '';
    const allowed = preview.purchase_allowed === true;
    const plans = preview.plans.map(plan => {
      const label = plan.is_current ? allowed ? '残高別候補' : '最低点数・参考' : '参考案';
      const limit = Number(plan.max_points);
      return `<article class="win5-preview-plan${plan.is_current?' is-current':''}">
        <div class="win5-preview-plan-heading"><b>${Number(plan.points)}点 · ${yen(plan.amount_yen)}</b><span>${label}</span></div>
        <p class="win5-preview-pattern">上限${limit}点 · ${(plan.pattern || []).map(Number).join(' × ')}頭 <span>1着率</span></p>
        <div class="win5-preview-legs">${(plan.legs || []).map(leg => `<div class="win5-preview-leg"><b>WIN${Number(leg.leg)} · ${esc(leg.track)}${Number(leg.race_no)}R</b><div>${(leg.horses || []).map(horse).join('')}</div></div>`).join('')}</div>
      </article>`;
    }).join('');
    return `<section class="win5-plan-previews" aria-label="WIN5の点数別参考買い目"><p class="win5-preview-note">${esc(preview.note || '購入準備時に残高に応じた1案を再選定')}</p><div class="win5-preview-grid">${plans}</div></section>`;
  }
  return Object.freeze({render});
})();

 W('win5Legs').innerHTML=d.legs.map((l,i)=>'<article class="win5-leg"><h2>WIN'+l.leg+' '+esc(l.track)+l.race_no+'R</h2><p>'+esc(l.race_name)+' · '+esc(l.start_time)+'発走</p><div class="win5-horses">'+orderedHorses(l.horses).map(h=>{
  const bg=colors[h.frame]||'#d2d7df',fg=[2,3,4,6].includes(h.frame)?'#fff':'#111';
  return '<button type="button" class="win5-horse'+(h.is_winner?' is-winner':'')+'" data-leg="'+i+'" data-horse="'+h.horse_no+'" aria-pressed="'+selected[i].includes(h.horse_no)+'"'+(h.withdrawn?' disabled':'')+'><span class="num" style="background:'+bg+';color:'+fg+'">'+h.horse_no+'</span><span class="mark">'+esc(h.mark)+'</span><span class="name">'+esc(h.horse_name)+horseBadges(h)+'</span><span class="horse-style">'+styleIndicatorHtml(h.running_style)+'</span><span class="market" title="'+esc(h.market_status==='final'?'確定オッズ・確定人気':h.odds_observed_at||'')+'">'+(h.jockey?esc(h.jockey)+' · ':'')+(h.popularity==null?'—人気':h.popularity+'人気')+' · '+(h.win_odds==null?'—倍':Number(h.win_odds).toFixed(1)+'倍')+(h.market_status==='final'?' · 確定':'')+'</span><span class="horse-probabilities">'+(h.withdrawn?'取消':probabilityBar(h.p_win,'win','勝率')+probabilityBar(h.p_top2,'top2','連対率')+probabilityBar(h.p_top3,'top3','複勝率'))+'</span></button>';
 }).join('')+'</div></article>').join('');
 document.querySelectorAll('[data-horse]').forEach(b=>b.addEventListener('click',()=>{
  const i=Number(b.dataset.leg),n=Number(b.dataset.horse);selected[i]=selected[i].includes(n)?selected[i].filter(x=>x!==n):selected[i].concat(n);
  localStorage.setItem(key(),JSON.stringify(selectionSnapshot()));tell('');draw();
 }));updateSummary();
}
function restore(){
 selected=[[],[],[],[],[]];tell('');
 try{
  const saved=JSON.parse(localStorage.getItem(key())||'null');
  if(saved){
   if(saved.source_identity!==day().source_identity&&(!Array.isArray(saved.legs)||saved.legs.some((l,i)=>!l.runner_identity||l.runner_identity!==day().legs[i]?.runner_identity))){tell('出走馬が更新されています。選び直してください。',true)}
   else if(saved.date===day().date&&Array.isArray(saved.legs)&&saved.legs.length===5){
    selected=saved.legs.map((l,i)=>{
     const live=day().legs[i];if(l.track!==live.track||l.race_no!==live.race_no)throw Error('対象レースが変わりました');return l.horse_nos;
    });
    selected.forEach((ns,i)=>{const allowed=new Set(day().legs[i].horses.filter(h=>!h.withdrawn).map(h=>h.horse_no));if(!Array.isArray(ns)||new Set(ns).size!==ns.length||ns.some(n=>!allowed.has(n)))throw Error('出走馬が変更されました');});
    tell('');
   }
  }
 }catch(_){selected=[[],[],[],[],[]];tell('保存下書きを確認できません。選び直してください。',true)}
 draw();
}
W('win5Date').addEventListener('change',restore);
W('win5Refresh').addEventListener('click',()=>{try{localStorage.setItem(key(),JSON.stringify(selectionSnapshot()))}catch(_){}location.reload()});
W('win5Auto').addEventListener('click',async()=>{
 try{
  const response=await fetch('/api/win5/auto-draft?date='+encodeURIComponent(W('win5Date').value),{cache:'no-store'});
  const value=await response.json();if(!response.ok)throw Error(value.error||'自動選定を確認できません');
  unitYen=value.draft.unit_yen;selected=value.draft.legs.map(l=>l.horse_nos.slice());
  localStorage.setItem(key(),JSON.stringify(selectionSnapshot()));draw();
  tell('最新の1着確率順で '+value.draft.points+'点・'+yen(value.draft.amount_yen)+' に自動選定しました。'+(value.balance_decision?.reason?' '+value.balance_decision.reason:'購入前に残高を再確認します。'));
 }catch(e){tell(e.message,true)}
});
W('win5Clear').addEventListener('click',()=>{selected=[[],[],[],[],[]];localStorage.removeItem(key());tell('選択を解除しました。');draw()});
async function loadAutoDraft(initial=false){
 try{
  const response=await fetch('/api/win5/auto-draft?date='+encodeURIComponent(W('win5Date').value),{cache:'no-store'});
  const value=await response.json();if(!response.ok)throw Error(value.error||'自動選定を確認できません');autoInfo=value;
  if([100,200,300].includes(value.draft?.unit_yen)){unitYen=value.draft.unit_yen;updateSummary()}
  W('win5AutoPreviews').innerHTML=Win5PreviewDisplay.render(value.preview);
  W('win5ModeLabel').textContent=value.enabled?(value.mode==='full'?'WIN5 予約＋本人投票':'WIN5 セミオート'):'WIN5 手動選択';
  if(value.enabled&&initial&&selected.every(ns=>!ns.length)){
   selected=value.draft.legs.map(l=>l.horse_nos.slice());localStorage.setItem(key(),JSON.stringify(selectionSnapshot()));draw();
   tell('自動購入設定から '+value.draft.points+'点・'+yen(value.draft.amount_yen)+' を復元しました。');
  }
 }catch(_){autoInfo=null}
}
async function transferRequest(path,payload){
 const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
 const result=await response.json();if(!response.ok||!result.ok)throw Error(result.error||'入力画面を確認できません');return result.job;
}
function showTransfer(job){
 const previous=transferJob;transferJob=job;W('win5Transfer').hidden=!job||job.state==='idle';
 if(!job)return;
 const active=['starting','opening','selecting','review_ready','manual_handoff','cancelling','needs_review','submitting'].includes(job.state);
 if(active&&job.draft&&Array.isArray(job.draft.legs)&&job.draft.legs.length===5&&(!previous||previous.fingerprint!==job.fingerprint)){
  selected=job.draft.legs.map(l=>l.horse_nos.slice());localStorage.setItem(key(),JSON.stringify(selectionSnapshot()));draw();
 }
 W('win5TransferMessage').textContent=job.message||'';
 W('win5Handoff').hidden=job.state!=='review_ready';
 W('win5Cancel').hidden=!['starting','opening','selecting','review_ready','manual_handoff','needs_review'].includes(job.state);
}
W('win5Stage').addEventListener('click',async()=>{
 if(transferPending)return;transferPending=true;W('win5Stage').disabled=true;
 try{const value=draft();localStorage.setItem(key(),JSON.stringify(value));showTransfer(await transferRequest('/api/win5/review',value));tell('選択した馬をそのまま転記します。投票は確定しません。')}
 catch(e){tell(e.message,true)}finally{transferPending=false;updateSummary()}
});
W('win5Cancel').addEventListener('click',async()=>{try{showTransfer(await transferRequest('/api/win5/review-control',{job_id:transferJob.job_id,action:'cancel'}))}catch(e){tell(e.message,true)}});
W('win5Handoff').addEventListener('click',async()=>{try{showTransfer(await transferRequest('/api/win5/review-control',{job_id:transferJob.job_id,action:'handoff',draft:draft()}))}catch(e){tell(e.message,true)}});
if(location.pathname==='/win5-selection.html'){
 setInterval(()=>loadAutoDraft(false),10000);
 setInterval(async()=>{try{const r=await fetch('/api/win5/review-status',{cache:'no-store'});if(r.ok)showTransfer(await r.json())}catch(_){}},2000);
 setInterval(async()=>{
  const current=day(),date=current.date;if(current.status!=='ready')return;
  try{
   const r=await fetch('/api/win5/catalog?date='+encodeURIComponent(date),{cache:'no-store'});if(!r.ok)return;
   const latest=await r.json();if(day()!==current||latest.status!=='ready'||latest.legs.length!==5)return;
   if(latest.legs.some((l,i)=>l.track!==current.legs[i].track||l.race_no!==current.legs[i].race_no||l.runner_identity!==current.legs[i].runner_identity))return;
   for(let i=0;i<5;i++)for(const h of current.legs[i].horses){
    const value=latest.legs[i].horses.find(x=>x.horse_no===h.horse_no&&x.horse_name===h.horse_name);
    if(value){h.is_winner=value.is_winner===true;h.purchased=value.purchased===true;h.finish_position=value.finish_position??null;h.popularity=value.popularity??null;h.win_odds=value.win_odds??null;h.odds_observed_at=value.odds_observed_at||'';h.market_status=value.market_status||''}
   }
   draw();
  }catch(_){}
 },15000);
}
restore();loadAutoDraft(true);
</script></body></html>
