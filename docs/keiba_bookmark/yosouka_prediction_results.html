:root {
  --bg0:#0b0f14;

  --silver2: rgba(192, 192, 192, .22);

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin:0;
  padding: calc(12px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom)) 12px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;

  font-size: 12px;

  font-weight: 900;

/* ★ 予想家成績/トップ3カード等も含め、全テキストを同一に寄せる */

  font-weight: inherit !important;
  letter-spacing: inherit !important;
}

.topbar,
.card {
  max-width: 760px;
  margin-left:auto;
  margin-right:auto;
}

/* ===== WIN5寄せ: sticky topbar ===== */

  position: sticky;

  z-index: 20;
  background: linear-gradient(180deg, rgba(11,15,20,.98), rgba(11,15,20,.86));

  margin-bottom: 12px;
}

}

h1 {

}

.meta {

}

.card {

.controls {
  display:flex;

/* pill は“非操作(黒)”をデフォルトにする */
.pill {
  background: rgba(0,0,0,0.32);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(232,238,246,0.86);
  border-radius: 999px;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1;
  font-weight: 900;
}

.muted {
  color: var(--muted);
  font-size: inherit;
  margin-top: 8px;
  line-height: 1;
}


/* 操作できるもの（select/btn）はネイビーに統一 */
select.pill,
.btn {
  background: linear-gradient(180deg, rgba(34,56,130,0.78), rgba(20,34,88,0.72));
  border: 1px solid rgba(105,150,245,0.45);
  color: rgba(242,247,255,0.96);
  box-shadow: 0 10px 26px rgba(0,0,0,.22);
  transition: filter .15s ease, transform .08s ease, border-color .15s ease;
}

select.pill {
  -webkit-appearance: none;

  border-radius: 12px; /* ★ WIN5寄せ（少し丸め） */

  /* 右側に矢印スペースを確保 */
  padding: 10px 38px 10px 14px;

  /* ★ WIN5の見た目に近いサイズ感 */
  min-width: 120px;

  background-repeat: no-repeat, no-repeat;
  background-position: 0 0, right 12px center;
  background-size: 100% 100%, 18px 18px;
}

select.pill:focus-visible {

}

/* ★ プルダウン候補（ブラウザ対応範囲で）を他UIのダーク寄せ */
select.pill option {

  background: rgba(34,56,130,0.92);
  color: rgba(242,247,255,0.96);

.btn.active {

.muted {

</style><script id="keiba-shared-theme-js">(() => {
  const key='keibaDisplayTheme';
  let theme='night';
  try {if(localStorage.getItem(key)==='day') theme='day'} catch (_) {}
  const apply=()=>{
    document.documentElement.dataset.displayTheme=theme;
    document.querySelectorAll('.theme-toggle').forEach(b=>{
      b.textContent=theme==='night'?'昼モード':'夜モード';
      b.setAttribute('aria-label',theme==='night'?'昼モードへ切替':'夜モードへ切替');
    });
  };
  apply();
  document.addEventListener('DOMContentLoaded',()=>{
    if(!document.querySelector('.theme-toggle')) {
      const parent=document.querySelector('.view-switch')||document.querySelector('.topbar');
      if(parent){const b=document.createElement('button');b.type='button';b.className='theme-toggle';parent.appendChild(b)}
    }
    document.querySelectorAll('.theme-toggle').forEach(b=>b.addEventListener('click',()=>{
      theme=theme==='night'?'day':'night';
      try{localStorage.setItem(key,theme)}catch(_){}
      apply();
    }));
    apply();
  });
})();

function uniq(arr) {
  return Array.from(new Set(arr));
}
function byId(id) {
  return document.getElementById(id);
}

function normPlace(placeName) {
  let s = String(placeName || "").trim();
  if (!s) return "";
  s = s.replace(/　/g, " ").replace(/\s+/g, "");
  s = s.replace(/競馬場/g, "");
  s = s.replace(/[（(]外[）)]/g, "");
  s = s.replace(/外$/g, "");
  const keys = ["札幌","函館","福島","新潟","東京","中山","中京","京都","阪神","小倉"];
  for (const k of keys) {
    if (s.includes(k)) return k;
  }
  return s;
}

function makeViewerLink(date, track, r) {
  const t = normPlace(track);
  const rr = String(r || "").match(/\d+/);
  const rno = rr ? String(parseInt(rr[0], 10)) : "";
  const parts = [];
  if (date) parts.push("date=" + encodeURIComponent(date));
  if (t) parts.push("track=" + encodeURIComponent(t));
  if (rno) parts.push("race=" + encodeURIComponent(rno));
  return "keiba_viewer.html#" + parts.join("&");
}

const dateSelect = byId("dateSelect");
const raceSelect = byId("raceSelect");
const out = byId("out");
const backBtn = byId("backBtn");

let sortKey = "予想家印";
let sortDesc = true;

function buildDateOptions() {
  const dates = uniq(RACES.map(r => r.yyyymmdd)).sort().reverse();
  // ALLは作らない（最新が初期）
  dateSelect.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join("");
}

function filteredRacesByDate() {
  const d = dateSelect.value;
  return RACES.filter(r => r.yyyymmdd === d);
}

function buildRaceOptions() {
  const filtered = filteredRacesByDate();
  raceSelect.innerHTML = filtered.map(r => `<option value="${r.id}">${r.label}</option>`).join("");

  // 初期選択は先頭
  if (raceSelect.options.length > 0) {
    raceSelect.selectedIndex = 0;
  }
}

function tipsterMarkRank(v) {
  const s = String(v || "").trim();

  if (s === "◎" || s === "◉") return 1;
  if (s === "○") return 2;
  if (s === "▲") return 3;

  const m = s.match(/^△(\d+)$/);
  if (m) return 10 + parseInt(m[1], 10);

  // 無印・不明は最後
  return 999;
}

function sortRows(rows) {
  const key = sortKey;
  const mul = sortDesc ? -1 : 1;

  return rows.slice().sort((a,b) => {
    if (key === "予想家印") {
      const ar = tipsterMarkRank(a["予想家印"]);
      const br = tipsterMarkRank(b["予想家印"]);

      if (ar !== br) return ar - br;

      // 同じ印なら総票が多い順
      const at = Number(a["総票"] || 0);
      const bt = Number(b["総票"] || 0);
      if (at !== bt) return bt - at;

      // 最後は馬番昇順
      return Number(a["馬番"] || 0) - Number(b["馬番"] || 0);
    }

    const av = (a[key] === undefined || a[key] === null) ? 0 : a[key];
    const bv = (b[key] === undefined || b[key] === null) ? 0 : b[key];

    if (typeof av === "number" && typeof bv === "number") {
      if (av < bv) return -1 * mul;
      if (av > bv) return  1 * mul;
      // tie-break: 馬番 asc
      return (a["馬番"] - b["馬番"]);
    }

    const as = String(av);
    const bs = String(bv);
    if (as < bs) return -1 * mul;
    if (as > bs) return  1 * mul;
    return 0;
  });
}

function pctClamp(v) {
  if (isNaN(v)) return 0;
  return Math.max(0, Math.min(100, v));
}

function parseRankInt(v) {
  const s = String(v || "").trim();
  if (!s) return null;
  const n = parseInt(s, 10);
  return isNaN(n) ? null : n;
}
function renderOneRace(race) {
  const rows = sortRows(race.rows || []);

  const collected = Array.isArray(race.collected_tipsters) ? race.collected_tipsters : [];
  const collectedCount = Number(race.tipster_collected_count || collected.length || 0);
  const tipsterList = collected.length
    ? collected.map(name => `<span class="horse-modal-chip">${name}</span>`).join("")
    : `<span class="muted">まだ収集できていません</span>`;
  const head = `
    <details class="t3details" style="margin-bottom:10px;">
      <summary>予想家の収集件数：${collectedCount}人</summary>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">${tipsterList}</div>
    </details>`;

  if (!rows || rows.length === 0) {
    return "<div class='muted'>表示できる馬がありません。</div>";
  }

  const maxUmaban = Math.max(1, ...rows.map(r => (r["馬番"] || 0)));

  // 馬番最大値から枠割当（基本：各枠2頭・最後枠に残り）
  function buildWakuMap(n) {
    const sizes = [];
    let remaining = n;

    for (let frame = 1; frame <= 8; frame++) {
      const minNeeded = 8 - frame;
      let size = remaining - minNeeded;

      if (size <= 0) size = 1;
      if (frame < 8) size = Math.min(2, size);
      if (frame === 8) size = remaining;

      sizes.push(size);
      remaining -= size;
    }

    const map = {};
    let ub = 1;
    sizes.forEach((sz, idx) => {
      const waku = idx + 1;
      for (let i = 0; i < sz; i++) {
        map[ub] = waku;
        ub++;
      }
    });
    return map;
  }

  const wakuMap = buildWakuMap(maxUmaban);

  const body = rows.map(r => {
    const rankText = r["着順"] ? r["着順"] : "";
    const rankInt = parseRankInt(rankText);

    let rankCls = "";
    if (rankInt === 1) rankCls = "rank-1";
    else if (rankInt === 2) rankCls = "rank-2";
    else if (rankInt === 3) rankCls = "rank-3";

    const total = (r["総票"] || 0);
    const honmei = (r["本命票"] || 0);
    const otakara = (r["お宝票"] || 0);

    const umaban = (r["馬番"] || 0);
    const wakuFromData = parseInt(r["枠番"] || 0, 10);
    const waku = (wakuFromData >= 1 && wakuFromData <= 8) ? wakuFromData : (wakuMap[umaban] || 1);

    const chips = [];

    // チップは最小限（予想家印 + Top5ラベル + 総票/投票なし）
    const tipsterMark = String(r["予想家印"] || "").trim();
    if (tipsterMark) chips.push(`<span class="mkr top5">予想家 ${tipsterMark}</span>`);

    const top5 = String(r["Top5_Label"] || "").trim();
    if (top5) chips.push(`<span class="mkr top5">${top5}</span>`);

    if (total > 0) chips.push(`<span class="mkr total">総票 ${total}</span>`);
    else chips.push(`<span class="mkr none">投票なし</span>`);

    // バー：総票の相対（レース内最大を100%）
    // ※ total=0 は幅0%（枠だけ見せる）
    const maxTotal = Math.max(1, ...rows.map(x => (x["総票"] || 0)));
    const wTotalRaw = pctClamp((total / maxTotal) * 100);
    const wTotal = (total > 0) ? Math.max(2, wTotalRaw) : 0;

    // バー内：本命/お宝の内訳
    const segHonmei = (total > 0) ? pctClamp((honmei / total) * 100) : 0;
    const segOtakara = (total > 0) ? pctClamp((otakara / total) * 100) : 0;

    const metaRight = rankText ? `着順: ${rankText}` : "着順: -";
    const honmeiVoters = Array.isArray(r["honmei_voters"]) ? r["honmei_voters"] : [];
    const otakaraVoters = Array.isArray(r["otakara_voters"]) ? r["otakara_voters"] : [];
    const totalVoters = Array.isArray(r["total_voters"]) ? r["total_voters"] : [];

    return `<div class="horse clickable ${rankCls}"
      data-horse-name="${String(r["馬名"] || "").replace(/"/g, "&quot;")}"
      data-umaban="${String(r["馬番"] || "").replace(/"/g, "&quot;")}"
      data-honmei='${JSON.stringify(honmeiVoters).replace(/'/g, "&#39;")}'
      data-otakara='${JSON.stringify(otakaraVoters).replace(/'/g, "&#39;")}'
      data-total='${JSON.stringify(totalVoters).replace(/'/g, "&#39;")}'
    >
      <div class="hrow">
        <div class="hleft">
          <div class="badge waku-${waku}">${r["馬番"]}</div>
          <div class="hname">${tipsterMark ? `<span class="tipster-main-mark">${tipsterMark}</span>` : ""}${r["馬名"]}</div>
        </div>
        <div class="hright">
          ${chips.join("")}
        </div>
      </div>

      <div class="vbarwrap">
        <div class="vbar" style="width:${wTotal}%">
          <div class="vseg honmei" style="width:${segHonmei}%"></div>
          <div class="vseg otakara" style="width:${segOtakara}%"></div>
        </div>
      </div>

      <div class="hmeta">
        <div>${race.place}${race.race_no}R</div>
        <div>${metaRight}</div>
      </div>
    </div>`;
  }).join("");

  return head + body;
}

function escHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function parseJsonArrayAttr(v) {
  try {
    const a = JSON.parse(String(v || "[]"));
    return Array.isArray(a) ? a : [];
  } catch (e) {
    return [];
  }
}

function renderVoterSection(title, arr, top3Names, worst3Names) {
  const list = Array.isArray(arr) ? arr : [];
  const top3Set = new Set(Array.isArray(top3Names) ? top3Names : []);
  const worst3Set = new Set(Array.isArray(worst3Names) ? worst3Names : []);

  if (list.length === 0) {
    return `<div class="horse-modal-sec">
      <div class="horse-modal-sec-title">${escHtml(title)}</div>
      <div class="horse-modal-empty">該当なし</div>
    </div>`;
  }

  return `<div class="horse-modal-sec">
    <div class="horse-modal-sec-title">${escHtml(title)}（${list.length}名）</div>
    <div class="horse-modal-list">
      ${
        list.map(x => {
          const name = String(x || "").trim();
          let cls = "horse-modal-chip";
          if (top3Set.has(name)) {
            cls = "horse-modal-chip top3";
          } else if (worst3Set.has(name)) {
            cls = "horse-modal-chip worst3";
          }
          return `<span class="${cls}">${escHtml(name)}</span>`;
        }).join("")
      }
    </div>
  </div>`;
}

function openHorseModal(el) {
  const modal = byId("horseModal");
  const title = byId("horseModalTitle");
  const body = byId("horseModalBody");
  if (!modal || !title || !body || !el) return;

  const horseName = el.getAttribute("data-horse-name") || "";
  const umaban = el.getAttribute("data-umaban") || "";
  const honmei = parseJsonArrayAttr(el.getAttribute("data-honmei"));
  const otakara = parseJsonArrayAttr(el.getAttribute("data-otakara"));
  const total = parseJsonArrayAttr(el.getAttribute("data-total"));
  const top3Names = Array.isArray(window.__currentRaceTop3Names) ? window.__currentRaceTop3Names : [];
  const worst3Names = Array.isArray(window.__currentRaceWorst3Names) ? window.__currentRaceWorst3Names : [];

  title.innerHTML = `馬番 ${escHtml(umaban)} ${escHtml(horseName)} の投票者`;
  body.innerHTML =
    renderVoterSection("合計", total, top3Names, worst3Names) +
    renderVoterSection("本命", honmei, top3Names, worst3Names) +
    renderVoterSection("お宝", otakara, top3Names, worst3Names);

  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
}

function closeHorseModal() {
  const modal = byId("horseModal");
  if (!modal) return;
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
}

function renderTop3Picks(race) {
  const rootTop = document.getElementById("top3Picks");
  const rootW   = document.getElementById("worst3Picks");
  if (!rootTop && !rootW) return;

  // 1行目の「出馬表へ」を選択レースに追従
  const viewerBtn = document.getElementById("viewerBtn");
  if (viewerBtn && race) {
    viewerBtn.href = makeViewerLink(race.yyyymmdd, race.place, race.race_no);
  }

  function pickBadge(ub, nm, wk) {
    const u = String(ub || "").trim();
    const n = String(nm || "").trim();

    if (!u && !n) return "（なし）";

    const w = parseInt(String(wk || "0"), 10);
    const waku = (!isNaN(w) && w >= 1 && w <= 8) ? w : 0;

    const num = u ? `<span class="t3num">${u}</span>` : `<span class="t3num">-</span>`;
    const name = n ? `<span class="t3nm">${n}</span>` : `<span class="t3nm"></span>`;
    return `<span class="t3pick waku-${waku}">${num}${name}</span>`;
  }

  function pickTextHtml(p) {
    const h = (p.honmei_umaban)
      ? `本命: ${pickBadge(p.honmei_umaban, p.honmei_name, p.honmei_waku)}`
      : "本命: （なし）";

    const os = [];
    if (p.otakara1_umaban) os.push(pickBadge(p.otakara1_umaban, p.otakara1_name, p.otakara1_waku));
    if (p.otakara2_umaban) os.push(pickBadge(p.otakara2_umaban, p.otakara2_name, p.otakara2_waku));
    const o = (os.length > 0) ? `お宝: ${os.join(" / ")}` : "お宝: （なし）";

    return { h, o };
  }

  function buildCard(title, arr) {
    if (!arr || arr.length === 0) {
      return `<div class="t3card">
        <div class="t3title">${title}</div>
        <div class="muted">（投票データがありません）</div>
      </div>`;
    }

    const items = arr.map(p => {
      const t = pickTextHtml(p);
      return `<div class="t3item">
        <div class="t3who">${p.name}</div>
        <div class="t3what">${t.h}<br>${t.o}</div>
      </div>`;
    }).join("");

    return `<div class="t3card">
      <div class="t3title">${title}</div>
      ${items}
    </div>`;
  }

  const hon = race.top3_honmei_picks || [];
  const tot = race.top3_total_picks || [];
  const wh  = race.worst3_honmei_picks || [];
  const wt  = race.worst3_total_picks || [];

  if (rootTop) {
    rootTop.innerHTML =
      buildCard("合計トップ3の投票", tot);
  }

  if (rootW) {
    rootW.innerHTML =
      buildCard("合計ワースト3の投票", wt);
  }
}

function render() {
  const id = raceSelect.value;
  if (!id) {
    out.innerHTML = "<div class='muted'>レースを選択してください。</div>";
    const root = document.getElementById("top3Picks");
    if (root) root.innerHTML = "";
    if (backBtn) backBtn.href = "index.html";
    window.__currentRaceTop3Names = [];
    window.__currentRaceWorst3Names = [];
    return;
  }
  const race = RACES.find(r => r.id === id);
  if (!race) {
    out.innerHTML = "<div class='muted'>レースが見つかりません。</div>";
    const root = document.getElementById("top3Picks");
    if (root) root.innerHTML = "";
    if (backBtn) backBtn.href = "index.html";
    window.__currentRaceTop3Names = [];
    window.__currentRaceWorst3Names = [];
    return;
  }

  if (backBtn && race.yyyymmdd) {
    backBtn.href = "index.html#date=" + encodeURIComponent(race.yyyymmdd);
  }

  const stripRankSuffix = (s) => String(s || "").replace(/（\d+位）/g, "").trim();

  window.__currentRaceTop3Names = (race.top3_total_picks || [])
    .map(p => stripRankSuffix((p && p.name) || ""))
    .filter(x => x !== "");

  window.__currentRaceWorst3Names = (race.worst3_total_picks || [])
    .map(p => stripRankSuffix((p && p.name) || ""))
    .filter(x => x !== "");

  renderTop3Picks(race);
  out.innerHTML = renderOneRace(race);
}

dateSelect.addEventListener("change", () => {
  buildRaceOptions();
  render();
});

raceSelect.addEventListener("change", render);

const sortSelect = byId("sortSelect");
if (sortSelect) {
  sortSelect.value = sortKey;

  sortSelect.addEventListener("change", () => {
    const key = sortSelect.value || "総票";
    sortKey = key;

    // 予想家印と馬番は昇順、それ以外は降順
    sortDesc = !(key === "予想家印" || key === "馬番");
    render();
  });
}


function hasOption(selectEl, value) {
  return Array.from(selectEl.options).some(o => o.value === value);
}

function findRaceByParams(params) {
  // 1) race_id 指定（最優先）
  const rid = params.get("race_id") || params.get("rid") || params.get("id");
  if (rid) {
    const hit = RACES.find(r => (r.race_id && r.race_id === rid) || (r.id && r.id === rid));
    if (hit) return hit;
  }

  // 2) date + race_no + (place_code or place) 指定
  const d = params.get("date");
  const rn = params.get("race_no");
  const pc = params.get("place_code");
  const pl = params.get("place");

  if (d && rn && (pc || pl)) {
    const raceNoInt = parseInt(rn, 10);
    const hit = RACES.find(r =>
      r.yyyymmdd === d &&
      Number(r.race_no) === Number(raceNoInt) &&
      (
        (pc && r.place_code === pc) ||
        (pl && r.place === pl)
      )
    );
    if (hit) return hit;
  }

  return null;
}

buildDateOptions();

function getParamsMerged() {
  // search（?a=b）と hash（#a=b）を両方読む。重複キーは search 優先。
  const s = (location.search || "").replace(/^\?/, "");
  const h = (location.hash || "").replace(/^#/, "");
  const p = new URLSearchParams(s);

  if (h) {
    const hp = new URLSearchParams(h);
    for (const [k, v] of hp.entries()) {
      if (!p.has(k)) p.set(k, v);
    }
  }
  return p;
}

const params = getParamsMerged();
const hitRace = findRaceByParams(params);
const qsDate = params.get("date");

// まず日付を決める（race_id があればその日付）
if (hitRace && hitRace.yyyymmdd && hasOption(dateSelect, hitRace.yyyymmdd)) {
  dateSelect.value = hitRace.yyyymmdd;
} else if (qsDate && hasOption(dateSelect, qsDate)) {
  dateSelect.value = qsDate;
} else {
  // デフォルト：最新日
  if (dateSelect.options.length > 0) {
    dateSelect.selectedIndex = 0;
  }
}

buildRaceOptions();

// 次にレースを決める（race_id があれば最優先）
if (hitRace && hitRace.id && hasOption(raceSelect, hitRace.id)) {
  raceSelect.value = hitRace.id;
}

out.addEventListener("click", (e) => {
  const card = e.target.closest(".horse.clickable");
  if (!card) return;
  openHorseModal(card);
});

const horseModal = byId("horseModal");
const horseModalClose = byId("horseModalClose");

if (horseModalClose) {
  horseModalClose.addEventListener("click", closeHorseModal);
}

if (horseModal) {
  horseModal.addEventListener("click", (e) => {
    if (e.target === horseModal) closeHorseModal();
  });
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeHorseModal();
});

render();

</script>
