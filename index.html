<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#06080c" />
<link rel="manifest" href="manifest.json?v=20260919141616" />
<title>Keiba Top</title>

<style>
:root {
  --bg: #0f1115;
  --panel: #141823;
  --panel2: #10131b;
  --text: #e9edf5;
  --muted: #aab3c5;
  --line: rgba(255,255,255,0.10);
  --shadow: 0 10px 24px rgba(0,0,0,0.35);
  --shadow2: 0 6px 16px rgba(0,0,0,0.30);

  /* ★ Navy UI（共通・暗め） */
  --navy: rgba(25,40,95,0.92);
  --navy-border: rgba(105,150,245,0.50);
  --navy-text: #f2f7ff;
  --navy-focus: rgba(105,150,245,0.16);
}

* { box-sizing: border-box; }
html {
  min-height: 100%;
  background-color: #06080c;
}
body { min-height: 100%; }
body {
  margin: 0;
  background: radial-gradient(1200px 800px at 15% 10%, rgba(90,140,255,0.10), transparent 55%),
              radial-gradient(900px 700px at 85% 0%, rgba(255,220,120,0.07), transparent 60%),
              var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}

.hit-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: 0;
  mix-blend-mode: screen;
}

.hit-glow.gold {
  background:
    radial-gradient(1200px 900px at 50% 10%, rgba(255,211,77,0.22), transparent 60%),
    radial-gradient(900px 700px at 15% 80%, rgba(255,211,77,0.12), transparent 60%),
    radial-gradient(900px 700px at 85% 85%, rgba(255,211,77,0.12), transparent 60%);
}

.hit-glow.silver {
  background:
    radial-gradient(1200px 900px at 50% 10%, rgba(210,220,235,0.20), transparent 60%),
    radial-gradient(900px 700px at 15% 80%, rgba(210,220,235,0.11), transparent 60%),
    radial-gradient(900px 700px at 85% 85%, rgba(210,220,235,0.11), transparent 60%);
}

@keyframes goldGlow {
  0%   { opacity: 0.08; filter: brightness(1.00); }
  50%  { opacity: 0.26; filter: brightness(1.15); }
  100% { opacity: 0.08; filter: brightness(1.00); }
}

@keyframes silverGlow {
  0%   { opacity: 0.07; filter: brightness(1.00); }
  50%  { opacity: 0.22; filter: brightness(1.12); }
  100% { opacity: 0.07; filter: brightness(1.00); }
}

body.hot-hit-gold .hit-glow.gold {
  animation: goldGlow 1.05s ease-in-out infinite;
}

body.hot-hit-silver .hit-glow.silver {
  animation: silverGlow 1.10s ease-in-out infinite;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: linear-gradient(180deg, rgba(15,17,21,0.98), rgba(15,17,21,0.86));
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: calc(10px + env(safe-area-inset-top)) 12px 10px 12px;
}

.controls {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.controls-row {
  display: flex;
  flex-wrap: nowrap;
  gap: 8px;
  align-items: center;
  width: 100%;
}
.controls-row > * {
  min-width: 0;
}

/* ★ Top 2行目：4ボタンを均等配置 */
.controls-row.top-row2 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.controls-row.top-row2 > * {
  width: 100%;
}


.select {
  width: auto;
  min-width: 160px;
  flex: 1 1 160px;
  padding: 10px 12px;
  background: var(--navy);
  color: var(--navy-text);
  border: 1px solid var(--navy-border);
  border-radius: 12px;
  font-size: 14px;
  outline: none;
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
}

.badge {
  padding: 10px 12px;
  background: rgba(20,24,35,0.92);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-weight: 900;
  font-size: 12px;
  white-space: nowrap;
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
}
.badge.sub {
  font-weight: 700;
  opacity: 0.95;
}

/* ★ 更新バー（3行目・黒背景） */
.updatebar {
  width: 100%;
  min-height: 40px;
  padding: 0 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(0,0,0,0.62);
  color: #e9edf5;
  font-weight: 900;
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
}

/* ★ Top 3行目：予想 / 成績 / 更新履歴 / WIN5 */
.controls-row.top-row3 {
  display: grid;
  grid-template-columns: 1fr 1fr 2fr 1fr;
  gap: 8px;
  align-items: center;
}
.controls-row.top-row3 > * {
  width: 100%;
  min-width: 0;
}
.controls-row.top-row3.no-win5 {
  grid-template-columns: 1fr 1fr 2fr;
}
#win5Btn {
  display: none; /* ★ JSで開催日にだけ表示 */
}

.wrapper {
  padding: 12px 12px calc(24px + env(safe-area-inset-bottom)) 12px;
}

.actions {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 12px;
  background: var(--navy);
  border: 1px solid var(--navy-border);
  border-radius: 12px;
  color: var(--navy-text);
  font-weight: 1000;
  font-size: 12px;
  white-space: nowrap;
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
  cursor: pointer;
  user-select: none;
  text-decoration: none;
}
.btn:active {
  transform: scale(0.99);
  filter: brightness(1.08);
}

.topfooter {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: center;
}
.topfooter .linkbtn {
  width: 100%;
  max-width: 520px;
}

.results-modal {
  position: fixed;
  inset: 0;
  z-index: 10050;
  display: none;
  background: rgba(0,0,0,0.60);
  padding: 12px;
  padding-top: calc(12px + env(safe-area-inset-top));
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
}
.results-modal.open {
  display: block;
}
.results-panel {
  max-width: 900px;
  margin: 0 auto;
  background: rgba(20,24,35,0.98);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.45);
  overflow: hidden;
}
.results-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.10);
}
.results-title {
  font-size: 18px;
  font-weight: 1000;
  line-height: 1.2;
}
.results-close {
  border: 1px solid rgba(120,170,255,0.55);
  background: rgba(35,55,120,0.92);
  color: #f2f7ff;
  border-radius: 14px;
  padding: 10px 12px;
  font-weight: 1000;
  cursor: pointer;
  font-size: 16px;
}
.results-body {
  max-height: 78vh;
  overflow: auto;
  padding: 14px;
}
.results-race {
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(16,19,27,0.88);
  border-radius: 16px;
  padding: 12px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.28);
  margin-bottom: 12px;
}
.results-racehead {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
}
.results-raceno {
  font-weight: 1000;
  font-size: 15px;
}
.results-racename {
  font-weight: 900;
  font-size: 14px;
  color: var(--text);
}
.results-racepills {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.results-racepill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  font-size: 12px;
  font-weight: 1000;
  line-height: 1;
  white-space: nowrap;
}
.results-racepill.baba-turf {
  background: rgba(0, 160, 70, 0.44);
  color: #f3fff5;
  border-color: rgba(0,160,70,0.70);
}
.results-racepill.baba-dirt {
  background: rgba(140, 85, 55, 0.48);
  color: #fff5ef;
  border-color: rgba(140,85,55,0.72);
}
.results-racepill.baba-jump {
  background: rgba(0, 145, 165, 0.46);
  color: #effdff;
  border-color: rgba(0,145,165,0.72);
}
.results-meta {
  margin-left: auto;
  font-size: 12px;
  font-weight: 900;
  color: var(--muted);
}
.results-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}
.results-table th,
.results-table td {
  padding: 8px 6px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  text-align: center;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.results-table th:nth-child(1),
.results-table td:nth-child(1) {
  width: 16%;
}
.results-table th:nth-child(2),
.results-table td:nth-child(2) {
  width: 18%;
}
.results-table th:nth-child(3),
.results-table td:nth-child(3) {
  width: 16%;
}
.results-table th:nth-child(4),
.results-table td:nth-child(4) {
  width: 36%;
}
.results-table th:nth-child(5),
.results-table td:nth-child(5) {
  width: 14%;
}
.results-table th {
  background: rgba(255,255,255,0.06);
  font-weight: 1000;
}
.results-table td.rankmark,
.results-table td.popodds {
  white-space: pre-line;
  line-height: 1.22;
}
.results-table td.name {
  text-align: left;
  font-weight: 900;
  overflow: visible;
  text-overflow: clip;
  letter-spacing: 0.01em;
}
.results-table td.umaban {
  font-weight: 1000;
}
.results-umabadge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  font-weight: 1000;
  font-size: 16px;
  line-height: 1;
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset;
}

.waku-1 { background: #ffffff; color: #111; }
.waku-2 { background: #2b2b2b; color: #fff; }
.waku-3 { background: #c65a5a; color: #fff; }
.waku-4 { background: #4f7db8; color: #fff; }
.waku-5 { background: #b99a00; color: #fff; }
.waku-6 { background: #2f8f5a; color: #fff; }
.waku-7 { background: #c97a2a; color: #fff; }
.waku-8 { background: #c46ab0; color: #fff; }

@media (max-width: 560px) {
  .results-table th,
  .results-table td {
    padding: 7px 4px;
    font-size: 11px;
  }

  .results-table th:nth-child(1),
  .results-table td:nth-child(1) {
    width: 16%;
  }
  .results-table th:nth-child(2),
  .results-table td:nth-child(2) {
    width: 18%;
  }
  .results-table th:nth-child(3),
  .results-table td:nth-child(3) {
    width: 16%;
  }
  .results-table th:nth-child(4),
  .results-table td:nth-child(4) {
    width: 36%;
  }
  .results-table th:nth-child(5),
  .results-table td:nth-child(5) {
    width: 14%;
  }

  .results-table td.name {
    font-size: 11px;
  }

  .results-umabadge {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    font-size: 14px;
  }
}
.results-empty {
  padding: 14px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  background: rgba(255,255,255,0.06);
  font-weight: 800;
  color: rgba(233,237,245,0.92);
}
.day-trio-meter {
  margin: 0 0 14px;
  padding: 14px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(31,42,65,0.96), rgba(14,18,27,0.96));
  box-shadow: 0 10px 26px rgba(0,0,0,0.24);
}
.day-trio-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.day-trio-title { font-size:13px; font-weight:1000; color:rgba(235,240,250,0.92); }
.day-trio-judge { padding:6px 10px; border-radius:999px; font-size:12px; font-weight:1000; }
.day-trio-judge.go { background:rgba(42,190,112,0.20); color:#72e7a8; border:1px solid rgba(72,220,138,0.38); }
.day-trio-judge.watch { background:rgba(230,174,50,0.18); color:#ffd878; border:1px solid rgba(255,207,92,0.34); }
.day-trio-judge.stop { background:rgba(220,75,82,0.18); color:#ff9ba0; border:1px solid rgba(255,110,116,0.34); }
.day-trio-values { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:12px; }
.day-trio-value { padding:9px 10px; border-radius:12px; background:rgba(255,255,255,0.055); }
.day-trio-value small { display:block; color:var(--muted); font-size:10px; font-weight:800; }
.day-trio-value strong { display:block; margin-top:2px; font-size:18px; font-weight:1000; }
.day-trio-note { margin-top:9px; color:var(--muted); font-size:10px; line-height:1.45; }
.day-trio-tracks { display:grid; gap:7px; margin-top:11px; }
.day-trio-track {
  display:grid;
  grid-template-columns:minmax(46px,0.8fr) repeat(3,minmax(58px,1fr));
  gap:7px;
  align-items:center;
  padding:8px 9px;
  border-radius:11px;
  background:rgba(255,255,255,0.045);
  border:1px solid rgba(255,255,255,0.07);
  font-size:11px;
}
.day-trio-track strong { font-size:12px; color:#f3f7ff; }
.day-trio-track span { color:var(--muted); text-align:right; white-space:nowrap; }

.results-summary {
  margin-bottom: 14px;
  padding: 16px;
  border: 1px solid rgba(105,150,245,0.26);
  border-radius: 18px;
  background:
    radial-gradient(120% 120% at 0% 0%, rgba(105,150,245,0.16), transparent 42%),
    linear-gradient(180deg, rgba(25,40,95,0.26), rgba(16,19,27,0.94) 34%, rgba(16,19,27,0.94)),
    rgba(16,19,27,0.90);
  box-shadow:
    0 0 0 1px rgba(105,150,245,0.08) inset,
    0 18px 36px rgba(0,0,0,0.34);
}
.results-summary-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 17px;
  font-weight: 1000;
  line-height: 1.2;
  margin-bottom: 12px;
}
.results-summary-sub {
  font-size: 11px;
  font-weight: 900;
  color: var(--muted);
  letter-spacing: 0.06em;
}
.results-summary-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.results-markcard {
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 16px;
  padding: 12px 12px 10px 12px;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03)),
    rgba(255,255,255,0.03);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.04) inset,
    0 8px 18px rgba(0,0,0,0.18);
}
.results-markcard-head {
  display: grid;
  grid-template-columns: 52px 1fr auto;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
}
.results-markbadge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 52px;
  height: 34px;
  padding: 0 10px;
  border-radius: 999px;
  font-size: 16px;
  font-weight: 1000;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.08);
}
.results-markbadge.mk-honmei {
  background: rgba(255,211,77,0.20);
  border-color: rgba(255,211,77,0.55);
  color: #fff2bf;
  box-shadow: 0 0 16px rgba(255,211,77,0.18);
}
.results-markbadge.mk-taikou {
  background: rgba(210,220,235,0.18);
  border-color: rgba(210,220,235,0.42);
  color: #f7fbff;
}
.results-markbadge.mk-tanana {
  background: rgba(255,160,95,0.16);
  border-color: rgba(255,160,95,0.42);
  color: #fff1e8;
}
.results-markbadge.mk-renka {
  background: rgba(120,170,255,0.16);
  border-color: rgba(120,170,255,0.42);
  color: #eef5ff;
}
.results-markbadge.mk-baku {
  background: rgba(255,95,95,0.16);
  border-color: rgba(255,95,95,0.44);
  color: #fff0f0;
}
.results-markbadge.mk-none {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.14);
  color: #e9edf5;
}
.results-markname {
  font-size: 14px;
  font-weight: 1000;
  line-height: 1.15;
}
.results-markmeta {
  font-size: 11px;
  color: var(--muted);
  font-weight: 900;
  margin-top: 3px;
}
.results-markpct {
  text-align: right;
}
.results-markpct .main {
  font-size: 18px;
  font-weight: 1000;
  line-height: 1;
}
.results-markpct .sub {
  font-size: 11px;
  color: var(--muted);
  font-weight: 900;
  margin-top: 4px;
}
.results-barblock {
  display: grid;
  gap: 7px;
  margin-bottom: 10px;
}
.results-barrow {
  display: grid;
  grid-template-columns: 52px 1fr 56px;
  gap: 8px;
  align-items: center;
}
.results-barlabel {
  font-size: 11px;
  color: var(--muted);
  font-weight: 1000;
  letter-spacing: 0.04em;
}
.results-bartrack {
  position: relative;
  height: 10px;
  border-radius: 999px;
  overflow: hidden;
  background: rgba(255,255,255,0.08);
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
}
.results-barfill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 0%;
  border-radius: 999px;
}
.results-barfill.win {
  background: linear-gradient(90deg, rgba(255,170,70,0.90), rgba(255,211,77,0.95));
  box-shadow: 0 0 12px rgba(255,190,70,0.28);
}
.results-barfill.top3 {
  background: linear-gradient(90deg, rgba(90,150,255,0.88), rgba(120,210,255,0.92));
  box-shadow: 0 0 12px rgba(120,190,255,0.24);
}
.results-barvalue {
  text-align: right;
  font-size: 12px;
  font-weight: 1000;
  color: #f3f7ff;
}
.results-rankdist {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.results-rankbox {
  border-radius: 12px;
  padding: 8px 6px;
  text-align: center;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
}
.results-rankbox .k {
  font-size: 10px;
  color: var(--muted);
  font-weight: 1000;
  margin-bottom: 4px;
}
.results-rankbox .v {
  font-size: 16px;
  line-height: 1;
  font-weight: 1000;
}
@media (max-width: 560px) {
  .results-summary {
    padding: 12px;
  }
  .results-markcard-head {
    grid-template-columns: 46px 1fr;
  }
  .results-markpct {
    grid-column: 1 / -1;
    text-align: left;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .results-rankdist {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

.section {
  margin-top: 16px;
  border: 1px solid rgba(105,150,245,0.26);
  border-radius: 16px;
  background:
    linear-gradient(180deg, rgba(25,40,95,0.22), rgba(16,19,27,0.92) 32%, rgba(16,19,27,0.92)),
    rgba(16,19,27,0.88);
  box-shadow: 0 0 0 1px rgba(105,150,245,0.08) inset, var(--shadow);
  overflow: hidden;
}

.secthead {
  padding: 14px 14px;
  font-weight: 1000;
  border-bottom: 1px solid rgba(105,150,245,0.24);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;

  if (!m) return String(r || "");
  return String(parseInt(m[0], 10)) + "レース";
}

function sugoumaKind(v) {
  const s0 = String(v || "").trim();
  if (!s0) return "";
  const s = s0.replace(/\s+/g, "");
  if (s.includes("絶")) return "zetsu";
  if (s.includes("極")) return "goku";
  if (s.includes("超ちょう") || (s.includes("超") && s.includes("ちょう")) || s.includes("超超")) return "chocho";
  if (s.includes("超")) return "cho";
  if (s.includes("凄馬")) return "sugo";
  return "sugo";
}

function sugoumaKind(v) {
  const s0 = String(v || "").trim();
  if (!s0) return "";
  const s = s0.replace(/\s+/g, "");
  if (s.includes("絶")) return "zetsu";
  if (s.includes("極")) return "goku";
  if (s.includes("超ちょう") || (s.includes("超") && s.includes("ちょう")) || s.includes("超超")) return "chocho";
  if (s.includes("超")) return "cho";
  if (s.includes("凄馬")) return "sugo";
  return "sugo";
}

function sugoumaClass(kind) {
  if (!kind) return "";
  if (kind === "zetsu") return "sg-zetsu";
  if (kind === "goku") return "sg-goku";
  if (kind === "chocho") return "sg-chocho";
  if (kind === "cho") return "sg-cho";
  if (kind === "sugo") return "sg-sugo";
  return "sg-sugo";
}

function wakuClass(w) {
  const n = parseInt(w || "", 10);
  if (!n || n < 1 || n > 8) return "";
  return "waku-" + n;
}

function rankClass(v) {
  const s0 = String(v || "").trim();
  const s = s0.toUpperCase();
  if (s.startsWith("S")) return "rank-s";
  if (s.startsWith("A")) return "rank-a";
  if (s.startsWith("B")) return "rank-b";
  if (s.startsWith("C")) return "rank-c";
  if (s.startsWith("NG") || s.includes("NG")) return "rank-ng";
  return "";
}

function babaChipClass(v) {
  const s = String(v || "");
  if (s.includes("ダ") || s.includes("ダート")) return "baba-dirt";
  if (s.includes("芝")) return "baba-turf";
  if (s.includes("障") || s.includes("障害")) return "baba-jump";
  return "";
}

function parseHash() {
  const h = (location.hash || "").replace(/^#/, "");
  const obj = {};
  if (!h) return obj;
  for (const part of h.split("&")) {
    const [k,v] = part.split("=");
    if (!k) continue;
    obj[decodeURIComponent(k)] = decodeURIComponent(v || "");
  }
  return obj;
}

function setUpdateBadge(date) {
  const up = (DATA.files && DATA.files[date] && DATA.files[date].updated_at) ? DATA.files[date].updated_at : "";
  el("updateBadge").textContent = up ? ("更新: " + up) : "";
}

function normalizePlaceName(placeName) {
  let s = String(placeName || "").trim();
  if (!s) return "";

  // 全角/半角スペース除去
  s = s.replace(/　/g, " ").replace(/\s+/g, "");

  // よくある揺れを除去
  s = s.replace(/競馬場/g, "");
  s = s.replace(/[（(]外[）)]/g, "");
  s = s.replace(/外$/g, "");

  // 10場に寄せる（部分一致で吸収）
  const keys = ["札幌","函館","福島","新潟","東京","中山","中京","京都","阪神","小倉"];
  for (const k of keys) {
    if (s.includes(k)) return k;
  }
  return s;
}

function placeNameToCode(placeName) {
  const mp = {
    "札幌": "01",
    "函館": "02",
    "福島": "03",
    "新潟": "04",
    "東京": "05",
    "中山": "06",
    "中京": "07",
    "京都": "08",
    "阪神": "09",
    "小倉": "10",
  };
  const n = normalizePlaceName(placeName);
  return mp[n] || "";
}

function buildPredictionUrl(date, info, track, race) {
  const rid = (info && info.race_id) ? String(info.race_id) : "";
  const parts = [];

  if (date) parts.push("date=" + encodeURIComponent(date));
  if (rid) parts.push("race_id=" + encodeURIComponent(rid));

  // ★ 競馬場名を正規化して渡す（揺れ吸収）
  const tRaw = String(track || "").trim();
  const t = normalizePlaceName(tRaw);
  const placeCode = placeNameToCode(t);

  // ★ race も数値に正規化（"11R"等を吸収）
  const rno = (() => {
    const m = String(race || "").match(/\d+/);
    return m ? String(parseInt(m[0], 10)) : "";
  })();

  // ★ 互換用：複数キーで渡す（相手側の実装差を吸収）
  if (t) {
    parts.push("track=" + encodeURIComponent(t));            // 既存キー
    parts.push("track_name=" + encodeURIComponent(t));       // 別名
    parts.push("place_name=" + encodeURIComponent(t));       // 互換キー（名前）
    parts.push("place=" + encodeURIComponent(t));            // “place=名前”派も吸収
  }
  if (placeCode) {
    parts.push("place_code=" + encodeURIComponent(placeCode)); // コード別名
    parts.push("track_code=" + encodeURIComponent(placeCode)); // 別名
    parts.push("place_cd=" + encodeURIComponent(placeCode));   // 別名
  }
  if (rno) {
    parts.push("race=" + encodeURIComponent(rno));
    parts.push("r=" + encodeURIComponent(rno));
    parts.push("race_no=" + encodeURIComponent(rno));
  }

  // ★ hash参照派/クエリ参照派どちらでも拾えるように両方へ載せる
  const qs = parts.join("&");
  return "yosouka_prediction_results.html?" + qs + "#" + qs;
}

function isJushoRace(info) {
  if (!info) return false;
  const name = String(info.race_name || "");
  const cls = String((info.race_info && info.race_info["クラス"]) ? info.race_info["クラス"] : "");
  const s = (name + " " + cls).replace(/\s+/g, "");
  return /G1|G2|G3|ＧⅠ|ＧⅡ|ＧⅢ|GⅠ|GⅡ|GⅢ|JPN1|JPN2|JPN3|重賞/.test(s.toUpperCase());
}

// ★ 予想ピルは「baken が存在するレース」だけ表示する（= predict_available）
function isPredictRace(info) {
  return !!(info && info.predict_available);
}

function updateTodayJushoBtn(date) {
  const btn = el("todayJushoBtn");
  if (!btn) return;

  // ★ その日付の「代表重賞」を自動選択（優先：京都 > 11R > 最初に見つかった重賞）
  const obj = (DATA.races && DATA.races[date]) ? DATA.races[date] : {};

  let best = null; // { track, race, info, score }
  const tracks = Object.keys(obj).sort();

  for (const t of tracks) {
    const racesObj = obj[t] || {};
    const races = Object.keys(racesObj).sort((a,b) => _numKey(a) - _numKey(b));

    for (const r of races) {
      const info = racesObj[r] || null;
      if (!info) continue;
      if (!isJushoRace(info)) continue;

      let sc = 0;
      const rno = _numKey(r);
      if (String(t || "").includes("京都")) sc += 1000;
      if (rno === 11) sc += 100;
      sc += Math.max(0, 50 - rno); // 早いレース番号を少し優遇

      if (!best || sc > best.score) {
        best = { track: t, race: r, info: info, score: sc };
      }
    }
  }

  if (best) {
    btn.href = buildPredictionUrl(date, best.info, best.track, best.race);
  } else {
    // 重賞が無い日は従来どおり（日付のみ）
    btn.href = buildPredictionUrl(date, null, "", "");
  }
}

function _resultNum(row) {
  const n = Number(row && row.__result_n);
  return Number.isNaN(n) ? 999 : n;
}

function _resultTop3Rows(info) {
  const rows = (info && info.rows) ? (info.rows || []) : [];
  return rows
    .filter(r => {
      const n = _resultNum(r);
      return n >= 1 && n <= 3;
    })
    .sort((a, b) => _resultNum(a) - _resultNum(b));
}

}

function _normalizeResultMark(mark) {
  const s = String(mark || "").replace(/\s+/g, "");

  if (s.includes("◉")) return "◉";
  if (s.includes("◎")) return "◎";
  if (s.includes("○")) return "○";
  if (s.includes("▲")) return "▲";

  const m = s.match(/△\s*([1-5])/);
  if (m) return "△" + m[1];

  if (s.includes("△")) return "△1";
  return "";
}

function _createEmptyMarkStat() {
  return {
    total: 0,
    win: 0,
    top3: 0,
    first: 0,
    second: 0,
    third: 0,
    out: 0,
  };
}

function _updateMarkStat(stat, rankNo) {
  stat.total += 1;

  if (rankNo === 1) {
    stat.win += 1;
    stat.top3 += 1;
    stat.first += 1;
    return;
  }
  if (rankNo === 2) {
    stat.top3 += 1;
    stat.second += 1;
    return;
  }
  if (rankNo === 3) {
    stat.top3 += 1;
    stat.third += 1;
    return;
  }
  stat.out += 1;
}

function _fmtPct(num, den) {
  if (!den) return "0.0";
  return (num * 100 / den).toFixed(1);
}

function _buildResultsSummary(date) {
  const day = (DATA.races && DATA.races[date]) ? DATA.races[date] : {};

  const order = ["◉","◎","○","▲","△1","△2","△3","△4","△5","爆","無印"];
  const stats = {};
  for (const k of order) {
    stats[k] = _createEmptyMarkStat();
  }

  const tracks = Object.keys(day || {});
  for (const track of tracks) {
    const racesObj = day[track] || {};
    const races = Object.keys(racesObj || {});
    for (const r of races) {
      const info = racesObj[r] || null;
      const rows = (info && info.rows) ? (info.rows || []) : [];

      for (const row of rows) {
        const rankNo = Number(row && row.__result_n);
        if (![1,2,3].includes(rankNo) && !(rankNo >= 4)) continue;

        const markRaw = String((row && row["予想印"]) || "");
        const baseMark = _normalizeResultMark(markRaw);
        const isBaku = markRaw.includes("爆");

        if (baseMark) {
          _updateMarkStat(stats[baseMark], rankNo);

          // ★ ◉は独立集計しつつ、◎集計にも含める
          if (baseMark === "◉") {
            _updateMarkStat(stats["◎"], rankNo);
          }
        } else {
          _updateMarkStat(stats["無印"], rankNo);
        }

        if (isBaku) {
          _updateMarkStat(stats["爆"], rankNo);
        }
      }
    }
  }

  const wrap = document.createElement("div");
  wrap.className = "results-summary";

  const ttl = document.createElement("div");
  ttl.className = "results-summary-title";
  ttl.innerHTML =
    '<span>各印成績まとめ</span>' +
    '<span class="results-summary-sub">WIN / TOP3 / FINISH DISTRIBUTION</span>';

  const grid = document.createElement("div");
  grid.className = "results-summary-grid";

  const markBadgeClass = (key) => {
    if (key === "◉") return "mk-honmei";
    if (key === "◎") return "mk-honmei";
    if (key === "○") return "mk-taikou";
    if (key === "▲") return "mk-tanana";
    if (key.indexOf("△") === 0) return "mk-renka";
    if (key === "爆") return "mk-baku";
    return "mk-none";
  };

  const markLabel = (key) => {
    if (key === "◉") return "最上位本命";
    if (key === "◎") return "本命";
    if (key === "○") return "対抗";
    if (key === "▲") return "単穴";
    if (key === "爆") return "爆印";
    if (key === "無印") return "無印";
    return "連下";
  };

  for (const key of order) {
    const st = stats[key];
    const total = st.total || 0;
    const firstPct = Number(_fmtPct(st.first, total));
    const secondPct = Number(_fmtPct(st.second, total));
    const thirdPct = Number(_fmtPct(st.third, total));
    const top3Pct = Number(_fmtPct(st.top3, total));

    const card = document.createElement("div");
    card.className = "results-markcard";

    card.innerHTML =
      '<div class="results-markcard-head">' +
        '<div class="results-markbadge ' + markBadgeClass(key) + '">' + escapeHtml(key) + '</div>' +
        '<div>' +
          '<div class="results-markname">' + escapeHtml(markLabel(key)) + '</div>' +
          '<div class="results-markmeta">対象 ' + escapeHtml(String(total)) + '頭</div>' +
        '</div>' +
        '<div class="results-markpct">' +
          '<div class="main">' + escapeHtml(_fmtPct(st.top3, total)) + '%</div>' +
          '<div class="sub">複勝率</div>' +
        '</div>' +
      '</div>' +

      '<div class="results-barblock">' +
        '<div class="results-barrow">' +
          '<div class="results-barlabel">1着率</div>' +
          '<div class="results-bartrack"><div class="results-barfill win" style="width:' + String(firstPct) + '%;"></div></div>' +
          '<div class="results-barvalue">' + escapeHtml(_fmtPct(st.first, total)) + '%</div>' +
        '</div>' +
        '<div class="results-barrow">' +
          '<div class="results-barlabel">2着率</div>' +
          '<div class="results-bartrack"><div class="results-barfill top3" style="width:' + String(secondPct) + '%;"></div></div>' +
          '<div class="results-barvalue">' + escapeHtml(_fmtPct(st.second, total)) + '%</div>' +
        '</div>' +
        '<div class="results-barrow">' +
          '<div class="results-barlabel">3着率</div>' +
          '<div class="results-bartrack"><div class="results-barfill top3" style="width:' + String(thirdPct) + '%;"></div></div>' +
          '<div class="results-barvalue">' + escapeHtml(_fmtPct(st.third, total)) + '%</div>' +
        '</div>' +
        '<div class="results-barrow">' +
          '<div class="results-barlabel">複勝率</div>' +
          '<div class="results-bartrack"><div class="results-barfill top3" style="width:' + String(top3Pct) + '%;"></div></div>' +
          '<div class="results-barvalue">' + escapeHtml(_fmtPct(st.top3, total)) + '%</div>' +
        '</div>' +
      '</div>' +

      '<div class="results-rankdist">' +
        '<div class="results-rankbox"><div class="k">1着</div><div class="v">' + escapeHtml(String(st.first)) + '</div></div>' +
        '<div class="results-rankbox"><div class="k">2着</div><div class="v">' + escapeHtml(String(st.second)) + '</div></div>' +
        '<div class="results-rankbox"><div class="k">3着</div><div class="v">' + escapeHtml(String(st.third)) + '</div></div>' +
        '<div class="results-rankbox"><div class="k">着外</div><div class="v">' + escapeHtml(String(st.out)) + '</div></div>' +
      '</div>';

    grid.appendChild(card);
  }

  wrap.appendChild(ttl);
  wrap.appendChild(grid);
  return wrap;
}

  const day = (DATA.races && DATA.races[date]) ? DATA.races[date] : {};
  const tracks = Object.keys(day).sort((a,b) => String(a).localeCompare(String(b), "ja"));

  title.textContent = "全レースリザルト  " + String(date || "");
  body.innerHTML = "";

  body.appendChild(_buildDayTrioMeter(date));
  body.appendChild(_buildResultsSummary(date));

  let hitCount = 0;

  for (const track of tracks) {
    const racesObj = day[track] || {};

          return normalized.join(" / ");
        }

        // ★ 単一券種（枠連 / 馬連 / 馬単 / 3連複 / 3連単 / 単勝）は先頭1件だけ表示
        return normalized[0] || "—";
      };

        return (
          '<div style="' +
            'border:1px solid ' + accent + ';' +
            'background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));' +

      const payoutLinks = box.querySelectorAll(".results-payout-link");
      payoutLinks.forEach((node) => {
        node.style.cursor = "pointer";
        node.addEventListener("click", (e) => {
          e.preventDefault();

        });

      box.addEventListener("click", () => {

      body.appendChild(box);
    }
  }

  if (hitCount === 0) {
    const empty = document.createElement("div");
    empty.className = "results-empty";
    empty.textContent = "この日付は確定済みの1〜3着データがまだありません。";
    body.appendChild(empty);

  modal.classList.add("open");
}

function updateWin5Btn(date) {
  const btn = el("win5Btn");
  if (!btn) return;

  const row = btn.parentElement;
  if (row) {
    row.classList.remove("has-win5");
    row.classList.remove("no-win5");
  }

  const d = String(date || "");

  // ★ まず win5_files を優先（= その日付のWIN5ファイルが存在する）
  const hasByFile = !!(DATA.win5_files && DATA.win5_files[d]);

  // ★ 次に win5_dates（補助）
  const ds = Array.isArray(DATA.win5_dates) ? DATA.win5_dates.map(x => String(x)) : [];

function loadDates() {
  const dateSel = el("dateSel");
  dateSel.innerHTML = "";
  const dates = (DATA.dates || []);
  for (const d of dates) {
    const op = document.createElement("option");
    op.value = d;
    op.textContent = d;
    dateSel.appendChild(op);
  }

  const now = new Date();
  const ymd = (dt) => String(dt.getFullYear()) + String(dt.getMonth() + 1).padStart(2, "0") + String(dt.getDate()).padStart(2, "0");
  const today = ymd(now);
  const tomorrowDt = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const tomorrow = ymd(tomorrowDt);
  const def = (now.getHours() >= 17 && dates.includes(tomorrow))
    ? tomorrow
    : (dates.includes(today) ? today : (DATA.default_date || ""));
  if (def && dates.includes(def)) {
    dateSel.value = def;
    return def;
  }

  if (dates.length > 0) {
    dateSel.value = dates[0];
    return dates[0];
  }

  return "";
}

let hideFinished = false; // 終了済みレースを隠す
let hideEmpty = false;    // 推奨なしを隠す

function _timeKey(x) {
  const s = String(x || "").trim();
  const m = s.match(/(\d{1,2})\s*[:：]\s*(\d{2})/);
  if (!m) return 999999;
  const hh = parseInt(m[1], 10);
  const mm = parseInt(m[2], 10);
  if (Number.isNaN(hh) || Number.isNaN(mm)) return 999999;
  return hh * 60 + mm;
}

function _yenNumber(x) {
  const s = String(x === undefined || x === null ? "" : x).replace(/[,，円\s]/g, "");
  const m = s.match(/\d+(?:\.\d+)?/);
  return m ? Number(m[0]) : 0;
}

function _collectDayTrioStats(date) {
  const day = (DATA.races && DATA.races[date]) ? DATA.races[date] : {};
  const total = { races: 0, hits: 0, returns: 0 };
  const byTrack = {};

  for (const track of Object.keys(day)) {
    for (const r of Object.keys(day[track] || {})) {
      const info = day[track][r] || {};
      if (!info.result_done) continue;
      const rows = info.rows || [];
      const top3 = rows.filter(row => [1,2,3].includes(Number(row && row.__result_n)));
      if (top3.length !== 3) continue;

      // 払戻未反映のレースを0円として数えると回収率が不当に下がるため除外する。
      const trioPayout = _yenNumber((info.payouts || {})["払戻_3連複"]);
      if (!(trioPayout > 0)) continue;

      // Viewerの購入ルールどおり、別計算の「10点買い役割」ではなく表示中の印順で判定する。
      const axes = rows.filter(row => {
        const m = _normalizeResultMark(String((row && row["予想印"]) || ""));
        return m === "◎" || m === "◉";
      });
      const strings = rows.filter(row => ["○","▲","△1","△2","△3"].includes(
        _normalizeResultMark(String((row && row["予想印"]) || ""))
      ));
      // 「10点」は軸1頭×紐5頭から2頭選ぶ10通り。過不足があるデータは集計しない。
      if (axes.length !== 1 || strings.length !== 5) continue;

      const axisNo = String(axes[0]["馬番"] || "").trim();
      const stringNos = Array.from(new Set(strings.map(row => String(row["馬番"] || "").trim()).filter(Boolean)));
      if (!axisNo || stringNos.length !== 5 || stringNos.includes(axisNo)) continue;

      const ticketKey = nos => nos.slice().sort((a,b) => Number(a) - Number(b)).join("-");
      const tickets = new Set();
      for (let i = 0; i < stringNos.length; i += 1) {
        for (let j = i + 1; j < stringNos.length; j += 1) {
          tickets.add(ticketKey([axisNo, stringNos[i], stringNos[j]]));
        }
      }
      if (tickets.size !== 10) continue;

      const hit = tickets.has(ticketKey(top3.map(row => String(row["馬番"] || "").trim())));
      if (!byTrack[track]) byTrack[track] = { races: 0, hits: 0, returns: 0 };
      total.races += 1;
      byTrack[track].races += 1;
      if (hit) {
        total.hits += 1;
        total.returns += trioPayout;
        byTrack[track].hits += 1;
        byTrack[track].returns += trioPayout;
      }
    }
  }
  return { total, byTrack };
}

function _buildDayTrioMeter(date) {
  const collected = _collectDayTrioStats(date);
  const races = collected.total.races;
  const hits = collected.total.hits;
  const returns = collected.total.returns;

  const investment = races * 1000;
  const hitRate = races ? (hits * 100 / races) : 0;
  const roi = investment ? (returns * 100 / investment) : 0;
  let judge = "集計待ち", judgeClass = "watch";
  if (races >= 6) {
    if (hitRate >= 40 && roi >= 100) { judge = "やって良い目安"; judgeClass = "go"; }
    else if (hitRate < 25 && roi < 80) { judge = "見送り目安"; judgeClass = "stop"; }
    else { judge = "様子見"; judgeClass = "watch"; }
  }

  const box = document.createElement("div");
  box.className = "day-trio-meter";
  const trackRows = Object.keys(collected.byTrack).sort((a,b) => String(a).localeCompare(String(b), "ja")).map(track => {
    const st = collected.byTrack[track];
    const inv = st.races * 1000;
    const hitPct = st.races ? st.hits * 100 / st.races : 0;
    const roiPct = inv ? st.returns * 100 / inv : 0;
    return '<div class="day-trio-track"><strong>' + escapeHtml(track) + '</strong>' +
      '<span>的中 ' + st.hits + '/' + st.races + '</span>' +
      '<span>' + hitPct.toFixed(1) + '%</span>' +
      '<span>回収 ' + roiPct.toFixed(1) + '%</span></div>';
  }).join("");
  box.innerHTML =
    '<div class="day-trio-head"><div class="day-trio-title">今日の◎軸3連複10点</div>' +
    '<div class="day-trio-judge ' + judgeClass + '">' + judge + '</div></div>' +
    '<div class="day-trio-values">' +
      '<div class="day-trio-value"><small>的中率</small><strong>' + hitRate.toFixed(1) + '%</strong></div>' +
      '<div class="day-trio-value"><small>回収率</small><strong>' + roi.toFixed(1) + '%</strong></div>' +
      '<div class="day-trio-value"><small>成績</small><strong>' + hits + ' / ' + races + '</strong></div>' +
      '<div class="day-trio-value"><small>収支</small><strong>' + (returns - investment).toLocaleString("ja-JP") + '円</strong></div>' +
    '</div>' +
    '<div class="day-trio-tracks">' + trackRows + '</div>' +
    '<div class="day-trio-note">着順・3連複払戻が反映済みの全レース対象｜◎（◉を含む）－○▲△1～3（組合せ10点）｜各100円。投資 ' +
      investment.toLocaleString("ja-JP") + '円 / 払戻 ' + returns.toLocaleString("ja-JP") + '円</div>';
  return box;
}

function renderList(date) {
  const root = el("list");
  root.innerHTML = "";

  const obj = (DATA.races[date] || {});
  let tracks = Object.keys(obj);

  // --- 競馬場は発走時刻順で固定 ---
  tracks.sort((a,b) => {
    const ra = obj[a] || {};
    const rb = obj[b] || {};

    const mina = (() => {
      let best = 999999;
      for (const r of Object.keys(ra)) {
        const info = ra[r] || null;
        const st = (info && info.race_info) ? info.race_info["発走時刻"] : "";
        best = Math.min(best, _timeKey(st));
      }
      return best;
    })();

    const minb = (() => {
      let best = 999999;
      for (const r of Object.keys(rb)) {
        const info = rb[r] || null;
        const st = (info && info.race_info) ? info.race_info["発走時刻"] : "";
        best = Math.min(best, _timeKey(st));
      }
      return best;
    })();

    if (mina !== minb) return mina - minb;
    return String(a).localeCompare(String(b), "ja");
  });

  for (const t of tracks) {
    const section = document.createElement("div");
    section.className = "section";

    const head = document.createElement("div");
    head.className = "secthead";

    const left = document.createElement("div");
    left.className = "left";
    left.innerHTML = '<div class="track">' + escapeHtml(t) + "</div>";

    const meta = document.createElement("div");
    meta.className = "meta";
    const nRace = Object.keys(obj[t] || {}).length;
    meta.textContent = String(nRace) + "レース";

    head.appendChild(left);
    head.appendChild(meta);

    const list = document.createElement("div");
    list.className = "rlist";

    const races = Object.keys(obj[t] || {}).sort((a,b) => _numKey(a) - _numKey(b));
    for (const r of races) {
      const info = obj[t][r] || null;
      if (!info) continue;

      // ★ 推奨なし判定（おすすめ/凄馬/乗替/予想/◉ のいずれかがあれば「空ではない」）
      const norikae0 = (info && info.norikae_horses) ? (info.norikae_horses || []) : [];
      const rec0 = (info.race_info && info.race_info["おすすめランク(採用)"]) ? info.race_info["おすすめランク(採用)"] : "";
      const buy0 = (info.race_info && info.race_info["買い判定"]) ? String(info.race_info["買い判定"]).trim() : "";
      const sug0 = info.sugouma || null;
      const hasMaruHonmei0 = !!((info && info.rows ? info.rows : []).some(row => String((row && row["予想印"]) || "").includes("◉")));
      const hasAny0 = (norikae0.length > 0) || !!rec0 || (buy0 && buy0 !== "見送り") || (sug0 && sug0.on) || isPredictRace(info) || hasMaruHonmei0;
      const isEmptyRace = !hasAny0;

      const row = document.createElement("div");
      row.className = "rrow";
      const buyDecision = (info.race_info && info.race_info["買い判定"]) ? String(info.race_info["買い判定"]).trim() : "";
      if (buyDecision === "買い") row.classList.add("buy-go-row");
      else if (buyDecision === "狙い") row.classList.add("buy-aim-row");
      else if (buyDecision === "注意") row.classList.add("buy-warn-row");
      else if (buyDecision === "様子見") row.classList.add("buy-watch-row");
      else if (buyDecision === "見送り") row.classList.add("buy-no-row");

      const isFinishedRace = !!(info && info.result_done);

      // ★ 行にフラグを持たせて、条件一致時は即非表示
      row.dataset.empty = isEmptyRace ? "1" : "0";
      row.dataset.finished = isFinishedRace ? "1" : "0";

      if ((hideEmpty && isEmptyRace) || (hideFinished && isFinishedRace)) {
        row.style.display = "none";
      }

      const leftcol = document.createElement("div");
      leftcol.className = "leftcol";

      const rno = document.createElement("div");
      rno.className = "rno";
      rno.textContent = raceNoLabel(r);

      if (info.result_done) rno.classList.add("done");
      else rno.classList.add("pending");

      const battleJudge = String((info.race_info && info.race_info["勝負判定(採用)"]) ? info.race_info["勝負判定(採用)"] : "").trim();

      decisionPill.style.flex = "0 0 auto";
      decisionPill.style.whiteSpace = "nowrap";
      pills.appendChild(decisionPill);

      const sug = info.sugouma || null;

        p.className = "pill " + sugoumaClass(sug.kind || "");
        const lb = sug.label || "凄馬";
        p.textContent = String(lb); // ★ 頭数は表示しない

      // ★ 乗換推奨：右側（後ろ）に寄せる／1レース1頭前提なので「1頭」などの表示はしない

        const predSurfClass =
          baba.includes("障") ? "pred-jump" :

          location.href = buildPredictionUrl(date, info, t, r);
        });
        pills.appendChild(p);
      }

      main.appendChild(name);
      main.appendChild(pills);

      const badges = document.createElement("div");
      badges.className = "rbadges";

      // ★ WIN5対象なら「右端バッジ列」に WIN5 ピル（常に見える・タップで WIN5 HTMLへ）
      if (info && info.win5_target) {
        const w5 = document.createElement("span");
        w5.className = "pill-win5";
        w5.textContent = "WIN5";
        w5.title = "WIN5へ";
        w5.style.cursor = "pointer";
        w5.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          openWin5(date, t, r);
        });
        badges.appendChild(w5);
      }

      row.appendChild(leftcol);
      row.appendChild(main);
      row.appendChild(badges);

      row.addEventListener("click", () => {
        openViewer(date, t, r);
      });


      list.appendChild(row);
    }

    section.appendChild(head);
    section.appendChild(list);
    root.appendChild(section);
  }
}

function init() {
  const defaultDate = loadDates();
  const hs = parseHash();

  // ★ hashの日付が有効なら尊重する。未来日/翌日出力を開いた後に当日へ戻さない。
  const dates = (DATA.dates || []);
  const date = (hs.date && dates.includes(hs.date)) ? hs.date : defaultDate;

  // ★ 初期表示でもURLに日付を反映（＝現在表示中の日付のリンクになる）
  if (!hs.date || hs.date !== date) {
    location.hash = "#date=" + encodeURIComponent(date);
  }

  el("dateSel").value = date;
  setUpdateBadge(date);
  updateTodayJushoBtn(date);
  updateTipsterPerfBtn(date);
  updateWin5Btn(date);
  renderList(date);

  // ★ 更新（PWAでも確実に最新を取りに行く：URLに v= を付けて再読み込み）
  const refreshBtn = el("refreshBtn");
  if (refreshBtn) {
    refreshBtn.addEventListener("click", () => {
      const hs = parseHash();
      const d = el("dateSel") ? el("dateSel").value : (hs.date || "");
      const v = Date.now();
      const h = d ? ("#date=" + encodeURIComponent(d)) : "";
      location.href = "index.html?v=" + v + h;
    });
  }

  const resultsBtn = el("resultsBtn");
  if (resultsBtn) {
    resultsBtn.addEventListener("click", () => {
      openResultsModal(el("dateSel").value);
    });
  }

  const resultsCloseBtn = el("resultsCloseBtn");
  if (resultsCloseBtn) {
    resultsCloseBtn.addEventListener("click", () => {
      closeResultsModal();
    });
  }

  const resultsModal = el("resultsModal");
  if (resultsModal) {
    resultsModal.addEventListener("click", (e) => {
      if (e.target === resultsModal) closeResultsModal();
    });
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeResultsModal();
  });

  // ★ 終了レース切替
  const hideFinishedBtn = el("hideFinishedBtn");
  if (hideFinishedBtn) {
    hideFinishedBtn.addEventListener("click", () => {
      hideFinished = !hideFinished;
      hideFinishedBtn.textContent = hideFinished ? "終了: 非表示" : "終了: 表示";

      const rows = document.querySelectorAll(".rrow");
      rows.forEach((row) => {
        const isFinished = row.dataset.finished === "1";
        const isEmpty = row.dataset.empty === "1";
        row.style.display = ((hideFinished && isFinished) || (hideEmpty && isEmpty)) ? "none" : "";
      });
    });
  }

  // ★ 推奨なし切替
  const hideBtn = el("hideEmptyBtn");
  if (hideBtn) {
    hideBtn.addEventListener("click", () => {
      hideEmpty = !hideEmpty;
      hideBtn.textContent = hideEmpty ? "推奨なし: 非表示" : "推奨なし: 表示";

      const rows = document.querySelectorAll(".rrow");
      rows.forEach((row) => {
        const isFinished = row.dataset.finished === "1";
        const isEmpty = row.dataset.empty === "1";
        row.style.display = ((hideFinished && isFinished) || (hideEmpty && isEmpty)) ? "none" : "";
      });
    });
  }

  el("dateSel").addEventListener("change", () => {
    const d2 = el("dateSel").value;
    setUpdateBadge(d2);
    updateTodayJushoBtn(d2);
    updateTipsterPerfBtn(d2);
    updateWin5Btn(d2);
    location.hash = "#date=" + encodeURIComponent(d2);
    renderList(d2);
  });
}

init();

// ★ Top画面に戻ってきた時、iPhone/PWAの復元表示でも必ず最新化する
window.addEventListener("pageshow", (e) => {
  const nav = (performance && performance.getEntriesByType)
    ? performance.getEntriesByType("navigation")
    : [];
  const navType = (nav && nav[0] && nav[0].type) ? nav[0].type : "";

  if (e.persisted || navType === "back_forward") {
    const d = el("dateSel") ? el("dateSel").value : "";
    const v = Date.now();
    const h = d ? ("#date=" + encodeURIComponent(d)) : "";
    location.replace("index.html?v=" + v + h);
  }
});
</script>
